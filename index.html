<!DOCTYPE html>
<!--
================================================================================
  星际防线（Space Line）· 单文件 HTML5 太空射击游戏
================================================================================
  【游戏说明】
    玩家驾驶飞船驻守屏幕底部，敌方战机从顶部落下。
    - 子弹命中敌人：敌人被击毁并获得分数，同时产生粒子爆炸；
    - 敌人撞到玩家或在屏幕底部漏过：扣除 1 点生命；
    - 生命归零则游戏结束。
    - 击杀精英敌（橙色六边形，3 发才能击毁）分数更高；
    - 难度随时间提升：敌人更快、生成更密、精英出现概率更高。

  【核心玩法循环】
    连击倍率  —— 连续击杀不断则倍率从 x1 爬到 x5（每 5 连升 1 级），
                 一旦漏怪或受击立即清零。这把"苟着不打"和"稳定清屏"区分开，
                 也让每次漏怪都有明确的代价。
    道具掉落  —— 击毁敌机有概率掉落 7 种道具：
                 护盾（挡一次伤害）/ 散射（三向弹）/ 急速（射速翻倍）/
                 清屏炸弹（清空全场并伤及 BOSS）/ 增援（+1 命，上限 6）/
                 双列（解锁平行双弹道）/ 激光（解锁持续穿透光束）。
    三把武器  —— 单发 / 双列 / 激光，同位选择而非升级链条：
                 单发最均衡；双列两条平行弹道，清横向排开的敌机最顺手；
                 激光单体输出略高且能贯穿整列，但完全吃不到散射加成。
                 解锁后随时切换（Q 循环 / 1 2 3 直选）。
    冲刺      —— Shift 短距高速位移，期间无敌，用于脱险，有 1.1 秒冷却。
    BOSS 战   —— 每 5 级出现一个 BOSS：高血量、横向机动、发射慢速瞄准弹。
                 血量降到 66% / 33% 时进入二阶段、三阶段：
                 横移更快、开火更密、弹幕从单发变扇形、三阶段追加环形弹幕，
                 且每次切换都会清空场上敌弹，给玩家一个喘息的节拍。
                 击破给高额分数并掉落 3 个道具。
    排行榜    —— 本地保存前 5 名（分数 / 等级 / 存活时长），带名次高亮。
    分数      —— 击毁得分 × 当前连击倍率；BOSS 击破另计。

  【操作方式】
    键盘：移动 ← → ↑ ↓ / W A S D · 射击 空格（按住可连发）·
          冲刺 Shift · 换枪 Q（或 1 2 3 直选）·
          暂停 P / Esc · 重开 R
    鼠标：在画布上按住拖动即可移动（拖动即自动开火）。
          用的是"相对拖动"而不是"飞船跟手"—— 后者手指会挡住飞船，
          而且手指接触面积远大于碰撞半径，微操会彻底废掉。
    触屏：手指在画布空白处拖动移动 + 自动开火；右下角按钮冲刺，
          左下角按钮换枪。手机建议横屏（画布能大 30%）。

  【运行方法】
    直接用浏览器打开本文件即可（双击，或拖进 Chrome/Edge 窗口）。
    无需服务器、无需联网、无任何第三方库 / 图片 / 音频依赖。
    所有图形均由 Canvas 2D API 实时绘制，音效由 WebAudio 合成（见 SFX 模块，
    若浏览器策略限制自动播放，静音不会影响游戏逻辑）。

  【代码结构】
    CFG        —— 全部可调参数集中区（速度、冷却、生成间隔、难度增长、
                  连击/道具/BOSS/后处理特效……）
    工具函数    —— clamp / rand / randDir / lerp / pick / weightedPick /
                  aabbOverlap / circleOverlap 等
    Input      —— 键盘状态对象（含防粘滞与一次性按键处理）
    Player     —— 玩家飞船（移动、冲刺、护盾、射击、绘制）
    Bullet     —— 玩家子弹（直线/散射、光矛拖尾、出界标记）
    Enemy      —— 敌人（普通 / 精英、下落、漂移、受击）
    Particle   —— 粒子（爆炸碎片、渐隐）
    Shockwave  —— 冲击波圆环（爆炸的"能量释放"层）
    FloatText  —— 飘字（得分 / 连击 / 道具提示）
    PowerUp    —— 掉落道具（5 种类型，含磁吸拾取）
    EnemyBullet—— 敌方子弹（BOSS 发射，瞄准玩家）
    Boss       —— 阶段 Boss（横向机动 + 周期开火）
    Star/Nebula/Meteor —— 背景层（视差星、星云、流星）
    Game       —— 状态机 + 游戏循环 + 生成 / 碰撞 / 渲染 / HUD / 后处理
    frame()    —— requestAnimationFrame 主循环，基于 deltaTime 更新
================================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星际防线 · 简易太空射击</title>
<style>
  /* ===== 主题变量：想换配色只改这里 ===== */
  :root{
    --bg-deep: #05070f;
    --accent: #4fd1ff;        /* 主强调色（青蓝） */
    --accent-2: #ff5d7a;      /* 危险色（红） */
    --text: #e8f2ff;
    --text-dim: #7fa7c9;
    /* 画布之外必须留出的垂直空间（标题 + 脚注 + 内外边距）。
       它直接决定画布能长多大，所以抽成变量，好在矮窗口里收紧。 */
    --vpad: 150px;
  }

  *{ box-sizing: border-box; }

  html, body{ height: 100%; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    /* 深空底色 + 中心微亮，让画面外也有宇宙感 */
    background:
      radial-gradient(circle at 50% 18%, #101c38 0%, #05070f 62%),
      var(--bg-deep);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden; /* 游戏是固定尺寸缩放的，禁止页面滚动 */
  }

  .brand{
    font-size: 13px;
    letter-spacing: .42em;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0;
    text-transform: uppercase;
  }

  /*
    矮视口分支：桌面应用窗口、笔记本矮屏、以及被系统压缩过的窗口都会落到这里。
    藏掉标题与脚注（窗口标题栏已经写着游戏名了）并把预留空间压到最小，
    于是 800×600 的画布在 680px 高的窗口里也能完整放下 —— 不然画布会被
    "为了给标题留位置"白白缩小到 756×567 这种非整数倍尺寸，画面会发虚。
  */
  @media (max-height: 820px){
    :root{ --vpad: 40px; }
    .brand, .footnote{ display: none; }
    body{ gap: 0; padding: 12px; }
  }

  /*
    触屏设备（手机/平板）：标题和脚注对拿手机的人毫无价值，
    却占掉了唯一能让画布长大的那点空间（见上方 --vpad 的说明）。
    实测手机横屏下这一条能把画布从 467×350 放大到 520×390 —— 值得。
  */
  @media (pointer: coarse){
    :root{ --vpad: 28px; }
    .brand, .footnote{ display: none; }
    body{ gap: 0; padding: 8px; }
    /* 允许画布吃掉被 body padding 让出来的那点宽度 */
    #game-wrap{ width: min(96vw, 800px, calc((100vh - var(--vpad)) * 4 / 3)); }
  }

  /*
    画布容器：固定 4:3 比例，随窗口自适应缩放。
    width 里同时用 calc((100vh - var(--vpad)) * 4 / 3) 约束宽度，
    这样窗口很矮时画布会跟着变窄，而不会把页面撑出滚动条。
  */
  #game-wrap{
    position: relative;
    width: min(94vw, 800px, calc((100vh - var(--vpad)) * 4 / 3));
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px #16233d,
      0 18px 60px rgba(0,0,0,.7),
      0 0 90px rgba(41,110,255,.13);
  }

  /* 逻辑分辨率由 canvas 的 width/height 属性决定（800x600），
     CSS 只负责把画布拉伸到容器大小，所以不同屏幕下手感完全一致。 */
  canvas{
    display: block;
    width: 100%;
    height: 100%;
    background: #02030a;
    /* 手机上必须显式关掉浏览器手势：否则"拖着飞船往下滑"会被识别成下拉刷新，
       长按会被识别成文字选择/放大镜，游戏根本没法玩。 */
    touch-action: none;
  }

  /* ===== 覆盖层：开始 / 暂停 / 结束三态共用一个容器 ===== */
  #overlay{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 24px;
    text-align: center;
    background: linear-gradient(180deg, rgba(3,6,16,.82), rgba(3,6,16,.94));
    transition: opacity .18s ease;
  }
  #overlay.hidden{
    opacity: 0;
    pointer-events: none;   /* 隐藏时必须同时取消命中，否则会挡住画布上的点击 */
  }

  #ov-title{
    font-size: clamp(22px, 4.4vw, 40px);
    font-weight: 700;
    letter-spacing: .18em;
    margin: 0;
    color: #ffffff;
    text-shadow: 0 0 24px rgba(79,209,255,.75), 0 0 60px rgba(79,209,255,.35);
  }
  #ov-sub{
    margin: 0;
    font-size: clamp(12px, 1.6vw, 15px);
    color: var(--text-dim);
    line-height: 1.7;
  }
  #ov-stats{
    min-height: 20px;
    font-size: clamp(12px, 1.6vw, 15px);
    color: #bcd7ee;
    line-height: 1.8;
  }
  #ov-stats b{ color: var(--accent); font-size: 1.12em; }

  .btn{
    margin-top: 6px;
    padding: 11px 30px;
    font-family: inherit;
    font-size: clamp(13px, 1.7vw, 15px);
    font-weight: 600;
    letter-spacing: .12em;
    color: #04121f;
    background: linear-gradient(180deg, #9beaff, var(--accent));
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(79,209,255,.35);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover{ transform: translateY(-2px); box-shadow: 0 10px 30px rgba(79,209,255,.5); }
  .btn:active{ transform: translateY(0) scale(.98); filter: brightness(.94); }
  .btn:focus-visible{ outline: 2px solid #fff; outline-offset: 3px; }

  #ov-hint{
    font-size: clamp(10px, 1.4vw, 12px);
    color: #55799a;
    line-height: 1.9;
    margin: 0;
  }
  kbd{
    display: inline-block;
    padding: 1px 6px;
    margin: 0 1px;
    font-family: Consolas, "Courier New", monospace;
    font-size: .95em;
    color: #a9d8f5;
    background: rgba(79,209,255,.1);
    border: 1px solid rgba(79,209,255,.28);
    border-radius: 4px;
  }

  .footnote{
    font-size: 11px;
    color: #3d5b78;
    margin: 0;
  }

  /* ===== 排行榜（开始 / 结束界面共用）===== */
  #ov-board{
    display: none;              /* 无记录时整块隐藏，避免出现一个空框 */
    width: min(100%, 320px);
    padding: 10px 14px;
    text-align: left;
    font-family: Consolas, "Courier New", monospace;
    font-size: clamp(11px, 1.5vw, 13px);
    color: #9fc4e0;
    background: rgba(79, 209, 255, .06);
    border: 1px solid rgba(79, 209, 255, .18);
    border-radius: 10px;
  }
  #ov-board.show{ display: block; }
  #ov-board .bhead{
    font-size: .92em;
    letter-spacing: .22em;
    color: #55799a;
    margin-bottom: 6px;
  }
  #ov-board .brow{
    display: flex;
    justify-content: space-between;
    gap: 10px;
    line-height: 1.85;
  }
  #ov-board .brow .rk{ color: #55799a; width: 1.6em; }
  #ov-board .brow .sc{ color: #8fe3ff; flex: 1; }
  /* 二倍速标记：琥珀色，与普通成绩区分开。用 ×2 而不是文字，
     因为榜单是等宽字体的紧凑列表，一个符号比"二倍速"三个字省地儿也更快读。 */
  #ov-board .brow .sc .sp{ color: #ffb457; margin-left: 6px; font-size: .86em; }
  /* AI 标记：紫色。它和二倍速标记是同一类信息 ——
     "这个分数不是在同等条件下的产物"，必须能一眼分辨。 */
  #ov-board .brow .sc .ai{ color: #b48cff; margin-left: 6px; font-size: .86em; }
  #ov-board .brow .meta{ color: #476b8a; font-size: .92em; }
  /* 本局排名高亮：玩家一眼就能在榜上找到自己刚才那一次 */
  #ov-board .brow.now .rk,
  #ov-board .brow.now .sc{ color: #ffd479; }
  #ov-board .brow.now .sc::after{ content: " ←"; }

  /* ===== 触屏辅助按钮（只在触摸设备上出现）=====
     为什么用 DOM 按钮而不是画在 canvas 里：
     画布是 800×600 逻辑坐标再整体缩放的，画在里面的按钮到了手机屏上
     会缩成 30 多物理像素，手指根本按不准。DOM 按钮的尺寸以物理像素为单位，
     手指按得准；半透明背景又能让底下的飞船保持可见。 */
  #touch-pad{
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: none;   /* 容器本身不挡画布，只有按钮自己可点 */
  }
  #game-wrap.touch-mode #touch-pad{ display: block; }

  .tbtn{
    position: absolute;
    bottom: 14px;
    width: 62px;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;
    pointer-events: auto;
    border: 1px solid rgba(180, 140, 255, .42);
    border-radius: 50%;
    background: rgba(10, 16, 34, .40);
    color: #d9c6ff;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    line-height: 1.1;
    touch-action: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background .12s ease, transform .12s ease, border-color .12s ease;
  }
  .tbtn small{ font-size: 9px; color: #8fa9c5; letter-spacing: 0; }
  .tbtn:active{ transform: scale(.93); }
  #touch-dash{ right: 14px; border-color: rgba(127, 232, 255, .5); color: #9fe9ff; }
  #touch-dash:active{ background: rgba(127, 232, 255, .3); }
  /* 冷却中：按钮变暗，玩家不必盯着屏幕角落的数字也知道现在按了没用 */
  #touch-dash.cooling{ border-color: rgba(85, 121, 154, .45); color: #55799a; }
  #touch-weapon{ left: 14px; }
  #touch-weapon:active{ background: rgba(180, 140, 255, .3); }
  /* 还没解锁第二把武器：按钮变暗表示"按了也没用" */
  #touch-weapon.dim{ border-color: rgba(85, 121, 154, .4); color: #6b86a3; }
  /* 倍速按钮：排在换枪按钮右边（14 + 62 + 10 = 86），与它同处底部一行。
     ⚠️ 曾经把它叠在换枪按钮正上方（bottom: 86），结果是它压住了左下角的
     WEAPON 那一行 HUD —— 手机上的画布只有约 275 CSS 像素高，纵向叠两个
     62px 的按钮要吃掉 54% 的高度，屏幕又矮、HUD 又没地方去。
     排成一行就没有这个问题：底部 HUD 的让位高度只需按"一行按钮"算。
     它刻意不放在两个拇指的热区（左下换枪 / 右下冲刺）里 ——
     倍速是整局只按一两次的档位开关，混在热区里会被误触，而后果是整局节奏突变。 */
  #touch-speed{ left: 86px; }
  #touch-speed:active{ background: rgba(255, 180, 87, .3); }
  /* 已开到二倍速：点亮成琥珀色，余光扫一眼就能确认当前档位 */
  #touch-speed.on{
    border-color: rgba(255, 180, 87, .85);
    color: #ffb457;
    background: rgba(255, 180, 87, .16);
  }
  /* AI 自动模式按钮：排在冲刺按钮左边（right: 86 = 14 + 62 + 10），同处底部一行。
     ⚠️ 为什么在右侧而不是挨着倍速（左侧）—— 这是实拍+真机测试逼出来的结论：
     竖屏手机上画布只有约 367 CSS 像素宽，一颗圆钮就占 62px。
     左侧簇一旦向右多排一颗（到 158px），它的右边界就压过了画布中线的 0.5w ≈ 183，
     而"手指落在飞船正下方开始拖动"恰恰就在那条线上 —— 于是手指一按下去
     就点在按钮上，画布收不到拖动（实测表现为"飞船几乎不跟着走"）。
     底部中央必须永远留给拖动，所以左侧簇最多两颗。
     放右侧的代价是它离右拇指近一点，但它是整局只按一两次的档位开关，风险可控。 */
  #touch-ai{ right: 86px; border-color: rgba(180, 140, 255, .5); }
  #touch-ai:active{ background: rgba(180, 140, 255, .3); }
  /* 接管中：点亮成紫色。这个状态必须一眼可见 ——
     否则玩家会困惑"我的飞船怎么自己在动"，甚至以为手机触控坏了。 */
  #touch-ai.on{
    border-color: rgba(180, 140, 255, .9);
    color: #d9c6ff;
    background: rgba(180, 140, 255, .18);
  }

  /* 覆盖层必须盖在触屏按钮之上，否则暂停/结束时按钮还能被按到 */
  #overlay{ z-index: 10; }
</style>
</head>
<body>

  <h1 class="brand">Space Line</h1>

  <div id="game-wrap">
    <!-- 逻辑分辨率固定 800x600，所有游戏逻辑都基于这套坐标系 -->
    <canvas id="game" width="800" height="600"></canvas>

    <div id="overlay" class="hidden">
      <h2 id="ov-title">星际防线</h2>
      <p id="ov-sub"></p>
      <div id="ov-stats"></div>
      <div id="ov-board"></div>
      <button id="ov-btn" class="btn" type="button">开始游戏</button>
      <p id="ov-hint">
        <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
        <kbd>空格</kbd> 射击 ·
        <kbd>Shift</kbd> 冲刺 ·
        <kbd>Q</kbd> 换枪 ·
        <kbd>F</kbd> 二倍速 ·
        <kbd>I</kbd> AI 自动 ·
        <kbd>P</kbd> 暂停 ·
        <kbd>R</kbd> 重开
      </p>
    </div>

    <!-- 触屏辅助按钮：只在触摸设备上显示（由键盘/触摸检测自动切换） -->
    <div id="touch-pad">
      <button id="touch-weapon" class="tbtn" type="button">
        <span id="touch-weapon-text">单发</span><small>换枪 Q</small>
      </button>
      <button id="touch-dash" class="tbtn" type="button">
        <span id="touch-dash-text">冲刺</span><small>Shift</small>
      </button>

  /* ---------- 敌人 ---------- */

  PARTICLE: {

  STAR_COUNT: 170,          // 星星数量（3 层视差由每颗星的 z 值自动分配）

                            // 全部画星芒会糊成一片，只有少数几颗闪光才有层次

/* ============================================================================
 * 2. 通用工具函数
 * ========================================================================== */

/**
 * 把数值 v 夹紧到 [min, max] 区间。
 * @param {number} v   待夹紧的数值
 * @param {number} min 下限
 * @param {number} max 上限
 * @returns {number} 夹紧后的数值
 * 用途：限制飞船不出界、控制数值不越界，比写 if 判断更不容易漏。
 */
function clamp(v, min, max) {
  return v < min ? min : (v > max ? max : v);
}

/**
 * 返回 [min, max) 区间内的随机浮点数。
 * @param {number} min 下限（含）
 * @param {number} max 上限（不含）
 * @returns {number} 随机数
 */
function rand(min, max) {
  return min + Math.random() * (max - min);
}

/**
 * 返回一个随机单位方向向量。
 * @returns {{x:number, y:number}} 模长为 1 的二维向量
 * 用途：粒子爆炸时朝四面八方飞散，比随机取 (x, y) 再归一化更均匀。
 */
function randDir() {
  const a = Math.random() * Math.PI * 2;
  return { x: Math.cos(a), y: Math.sin(a) };
}

/** 圆周率的两倍。画整圆/做周期性运算时到处都要用，提出来避免重复写 Math.PI * 2。 */
const TAU = Math.PI * 2;

/**
 * 线性插值。
 * @param {number} a 起点值
 * @param {number} b 终点值
 * @param {number} t 插值比例（0 → a，1 → b）
 * @returns {number} 插值结果
 * 用途：所有"平滑跟随"的手感都靠它 —— 机翼倾角、光圈呼吸、道具吸附速度。
 *      直接赋值会很僵硬，插值一下就有了惯性。
 */
function lerp(a, b, t) {
  return a + (b - a) * t;
}

/**
 * 从数组里随机取一个元素。
 * @param {Array} arr 候选数组
 * @returns {*} 随机元素
 * 用途：道具类型抽取。刻意不用 switch + 一堆 if，靠一张权重表驱动，
 *      以后想加新道具只要往表里加一行。
 */
function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length) % arr.length];
}

/**
 * 按权重表抽取一个键。
 * @param {Object} table 形如 { A: 3, B: 1 } 的权重表（值越大越容易被抽到）
 * @returns {string} 被抽中的键
 * 为什么不用等概率抽：加命和清屏炸弹这种"救命牌"如果和散射一样常见，
 * 游戏的紧张感会被稀释；靠权重把稀有度压下来，抽到才有惊喜。
 */
function weightedPick(table) {
  const keys = Object.keys(table);
  let total = 0;
  for (let i = 0; i < keys.length; i++) total += table[keys[i]];
  let r = Math.random() * total;
  for (let i = 0; i < keys.length; i++) {
    r -= table[keys[i]];
    if (r <= 0) return keys[i];
  }
  return keys[keys.length - 1];   // 浮点误差兜底
}

/**
 * 轴对齐矩形相交检测（AABB）。
 * @param {{x:number,y:number,w:number,h:number}} a 矩形 A（x/y 为左上角）
 * @param {{x:number,y:number,w:number,h:number}} b 矩形 B
 * @returns {boolean} 是否相交
 * 用途：子弹 × 敌人。两者都近似方正的形状，AABB 只需 4 次比较，
 *      是每帧要跑几百次的热点，比圆形检测更省。
 */
function aabbOverlap(a, b) {
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

/**
 * 圆形相交检测。
 * @param {{x:number,y:number,r:number}} a 圆 A（圆心 + 半径）
 * @param {{x:number,y:number,r:number}} b 圆 B
 * @returns {boolean} 是否相交
 * 用途：玩家 × 敌人。两者外形都是圆的，用圆形轮廓判定比包围盒更符合直觉。
 * 实现细节：先比较"距离平方"和"半径和平方"，省掉一次 Math.sqrt——
 *          开方是逐帧碰撞检测里最贵的运算之一，能省则省。
 */
function circleOverlap(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const rr = a.r + b.r;
  return dx * dx + dy * dy <= rr * rr;
}

/* ============================================================================
 * 3. 输入模块 Input
 *    —— 只负责"记录输入状态"，把键盘与指针翻译成语义化查询
 *       （left/right/shoot/dragTarget），游戏逻辑不需要知道玩家按的是 A 还是点的是屏幕。
 * ========================================================================== */
const Input = {
  // 普通对象存键状态，用 Object.create(null) 避免 'constructor' 之类的原型键名冲突
  keys: Object.create(null),

  /* ---- 指针（鼠标 / 触摸 / 触控笔）状态 ----
     统一走 pointer 事件而不是分别处理 mouse + touch：
       · 一套代码覆盖三种设备；
       · 浏览器已经替我们处理好了多点触控、手掌误触、指针捕获等脏活；
       · touch 事件还需要手写 passive:false 才能 preventDefault，pointer 没这层麻烦。 */
  pointer: {
    active: false,        // 是否正在按住
    id: null,             // 正在"认领"的 pointerId（多指时只认第一根，避免基准被顶掉）
    x: 0, y: 0,           // 当前指针位置（画布逻辑坐标）
    sx: 0, sy: 0,         // 按下时的指针位置（拖动基准）
    shipX: 0, shipY: 0,   // 按下时的飞船位置（拖动基准）
    targetX: 0,           // 飞船要去的目标 x
    targetY: 0,
    dx: 0, dy: 0,         // 本帧的拖动方向（-1~1），用于机身倾斜与冲刺方向
    downAt: 0,            // 按下时间戳（毫秒），用于单击/拖动判定
    dashRequest: false,   // 一次性：请求冲刺（由屏幕按钮或双击置位）
    isTouch: false        // 是否来自触摸（触摸下会自动开火，且不显示键盘提示）
  },

  /** 一次性动作回调（开始/暂停/重开），由 Game 注入。 */
  oneShot: null,
  /** 画布元素，用来把屏幕坐标换算成逻辑坐标。 */
  canvas: null,

  /**
   * 绑定全局输入事件。
   * @param {function(string):void} oneShotHandler 一次性按键处理器
   * @param {HTMLCanvasElement} canvas 游戏画布
   * @returns {void}
   */
  init(oneShotHandler, canvas) {
    this.oneShot = oneShotHandler;
    // 兜底：万一调用方忘了传画布，就自己找一次。
    // 没了这一步，initPointer() 会静默早退 —— 键盘照常、指针全哑，且不报错，
    // 是那种"测不出来但用户一眼就能发现"的 bug。
    this.canvas = canvas ||
      (typeof document !== 'undefined' ? document.getElementById('game') : null);

    window.addEventListener('keydown', (e) => {
      // 统一转小写：开着 CapsLock 或按住 Shift 时，事件里是 'A' 而不是 'a'，
      // 不归一化就会出现"大写字母按了没反应"的诡异 bug。
      const k = e.key.toLowerCase();

      // 空格会滚动页面、方向键会滚动页面，必须拦掉默认行为，
      // 否则在页面模式下按空格会把整个游戏滚出视野。
      if (k === ' ' || k.indexOf('arrow') === 0) e.preventDefault();

      this.keys[k] = true;

      // e.repeat 表示这是浏览器长按产生的"自动重复"事件。
      // 开始 / 暂停 / 重开这类一次性动作必须排除它，否则按住空格会疯狂重开。
      if (!e.repeat) this.oneShot(k);
    });

    window.addEventListener('keyup', (e) => {
      this.keys[e.key.toLowerCase()] = false;
    });

    // 关键防粘滞处理：Alt+Tab 切走时 keyup 会丢在别的窗口，
    // 回到游戏后那个键会一直"按着"，飞船就会自己飘。
    // 监听失焦直接清空全部状态即可根治。
    window.addEventListener('blur', () => { this.clear(); });

    this.initPointer();
  },

  /**
   * 绑定画布上的指针事件（鼠标 / 触摸 / 触控笔）。
   * @returns {void}
   */
  initPointer() {
    const c = this.canvas;
    if (!c) return;

    // 把屏幕坐标换算成画布逻辑坐标。
    // 必须按 getBoundingClientRect 的实际显示尺寸做比例缩放 ——
    // 画布内部是 800×600，但 CSS 会把它拉伸到容器大小，
    // 直接用 clientX 会让触摸位置整体偏移（屏幕越小偏得越离谱）。
    const toLogical = (ev) => {
      const r = c.getBoundingClientRect();
      return {
        x: (ev.clientX - r.left) / r.width * CFG.W,
        y: (ev.clientY - r.top) / r.height * CFG.H
      };
    };

    const down = (ev) => {
      const p = toLogical(ev);
      const P = this.pointer;

      // ---- 多指保护：只认"第一根落在画布上的手指" ----
      // 手机上右手会去点屏幕上的冲刺/换枪按钮，那根手指同样会产生 pointer 事件。
      // 如果不区分 pointerId，第二根手指一按下就会把拖动基准（shipX/shipY）
      // 重置到当前位置，飞船会"咯噔"一下跳走 —— 两手同操时手感直接崩掉。
      if (P.active && ev.pointerId !== P.id) return;

      P.id = ev.pointerId;
      P.isTouch = (ev.pointerType === 'touch');
      P.active = true;
      P.x = P.sx = p.x;
      P.y = P.sy = p.y;
      // 拖动基准：按下瞬间的飞船位置。之后飞船位移 = 指针位移，
      // 所以手指可以放在飞船下方的空白处，不会挡住飞船（详见 CFG.TOUCH 的注释）
      P.shipX = Game.player.x;
      P.shipY = Game.player.y;
      P.targetX = P.shipX;
      P.targetY = P.shipY;
      P.dx = 0; P.dy = 0;
      P.downAt = performance.now();
      // 指针捕获：手指滑出画布后仍然收得到 move/up，
      // 否则"拖到边缘再松手"会丢掉 up 事件，飞船卡在最后的位置
      try { c.setPointerCapture(ev.pointerId); } catch (e) { /* 某些环境不支持，忽略 */ }
      ev.preventDefault();
    };

    const move = (ev) => {
      const P = this.pointer;
      if (!P.active) return;
      // 只响应"认领"的那根手指，其余（比如按屏幕按钮的那根）全部忽略
      if (ev.pointerId !== P.id) return;
      const p = toLogical(ev);
      P.x = p.x; P.y = p.y;

      // ---- 相对拖动 ----
      const g = CFG.TOUCH.DRAG_GAIN;
      const m = CFG.PLAYER.MARGIN;
      P.targetX = clamp(P.shipX + (P.x - P.sx) * g, CFG.PLAYER.RADIUS + m, CFG.W - CFG.PLAYER.RADIUS - m);
      P.targetY = clamp(P.shipY + (P.y - P.sy) * g,
                        CFG.H * CFG.PLAYER.Y_MIN_RATIO, CFG.H - CFG.PLAYER.RADIUS - m);

      // 本帧拖动方向（归一化到 -1~1）：驱动机身倾斜与"无方向按键时朝哪冲"
      const span = 60;   // 移动多少像素算"满偏"
      P.dx = clamp((P.x - P.sx) / span, -1, 1);
      P.dy = clamp((P.y - P.sy) / span, -1, 1);
      ev.preventDefault();
    };

    const up = (ev) => {
      const P = this.pointer;
      // 只处理认领的那根手指；否则"按按钮的手指抬起"会把拖动状态一并清掉，
      // 玩家的移动手指还按着，飞船却停住了。
      if (ev.pointerId !== P.id) return;
      // 单击（按住时间短）视为"点一下"，不产生位移 —— 这样误触不会让飞船乱飘
      if (performance.now() - P.downAt < CFG.TOUCH.TAP_MS && P.isTouch) {
        P.targetX = Game.player.x;
        P.targetY = Game.player.y;
      }
      P.active = false;
      P.id = null;
      P.dx = 0; P.dy = 0;
      try { c.releasePointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
    };

    c.addEventListener('pointerdown', down, { passive: false });
    c.addEventListener('pointermove', move, { passive: false });
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);

    // 屏蔽右键菜单与长按选择：拖动时弹出菜单会直接打断操作
    c.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  /** 清空全部输入状态。状态切换（开始/重开/暂停恢复）时调用，避免残留输入干扰新一局。 */
  clear() {
    this.keys = Object.create(null);
    const P = this.pointer;
    P.active = false;
    P.id = null;
    P.dx = 0; P.dy = 0;
    P.dashRequest = false;
  },

  /* ---- 语义化查询：逻辑层只读这些 getter ---- */
  get left()  { return !!(this.keys['arrowleft']  || this.keys['a']); },
  get right() { return !!(this.keys['arrowright'] || this.keys['d']); },
  get up()    { return !!(this.keys['arrowup']    || this.keys['w']); },
  get down()  { return !!(this.keys['arrowdown']  || this.keys['s']); },

  /**
   * 是否正在开火。
   * @returns {boolean}
   * 触摸/鼠标下自动开火：手机上没有"按住空格"这种操作，
   * 要求玩家同时按住屏幕再腾手指去按射击键是不现实的，
   * 所以触摸期间默认持续开火（这也是所有手机射击游戏的做法）。
   */
  get shoot() { return !!this.keys[' '] || this.pointer.active; },

  /**
   * 取走一次"冲刺请求"（读后即清）。
   * @returns {boolean} 本次是否请求了冲刺
   * 为什么要"读后即清"：冲刺是一次性动作，如果用普通布尔标记，
   * 按住屏幕按钮会每帧都触发一次冲刺，冷却形同虚设。
   */
  consumeDash() {
    if (!this.pointer.dashRequest) return false;
    this.pointer.dashRequest = false;
    return true;
  },

  /** 请求一次冲刺（供屏幕按钮调用）。参数：无。返回：无。 */
  requestDash() { this.pointer.dashRequest = true; }
};

/* ============================================================================
 * 3b. AI 自动模式 AutoPilot
 *    —— 接管玩家操作。它读的是 Game 的战场状态，写的是"一个与 Input 同形的
 *       虚拟手柄"，因此 Game 那边只需要换一个输入源，其余代码一行都不用改。
 * ========================================================================== */

const AutoPilot = {
  on: false,          // 是否正在接管
  engaged: 0,         // 已接管时长（秒），仅用于展示

  goalX: 0,           // 本帧求解出的落点（逻辑坐标）
  goalY: 0,
  danger: 0,          // 落点的危险度（0 = 完全安全）；超过 DASH_AT 才考虑冲刺

  _weaponTimer: 0,    // 换枪决策的节流计时
  _wantWeapon: '',    // 上一次的换枪意向（用于滞后判定，避免在边界上反复横跳）
  _wantHits: 0,

  /* 换枪策略开关（默认 'legacy'）。另一支 'band' 是**已实测更差**的变体，
     保留仅供 `verify/aitest.js` 的同进程 A/B 复现那次结论，勿在生产里启用。

     ⚠️ 这里记一次"推理错了、实验赢了"的经过，值得留着提醒：
     我曾把门槛改成"有 ≥2 个真正打得到的目标就用双列"，理由是
     "实测 Lv.12 吞吐只差 0.30 架/秒，而双列的击杀带 60px 比单发 38px 宽 1.58 倍，
       所以瓶颈是带宽、不是火力（脉冲 7.7 发/秒 vs 需求 2.5，富余 3 倍）"。
     ——**这个推理是错的。** 同进程交替 A/B（各 5 局、武器随机解锁在两臂上均摊）实测：
          平均存活 196.3s → 160.1s ・ 平均得分 20340 → 14225
     真正的原因是**双列冷却 0.17s 比单发 0.13s 贵 30%**，而两条弹道只差 22px，
     对单个目标纯亏。瓶颈不是"走廊多宽"，是"扫过时能命中多少发" ——
     多花的冷却直接换成了漏怪。教训：单次"相关性"（带宽宽 ⇒ 该用双列）
     很容易被讲成因果，必须做受控 A/B 才知道方向。 */
  weaponPolicy: 'legacy',   // 'legacy'（默认，实测更好）| 'band'（已实测更差，仅供对照）

  /* ---- 虚拟手柄 ----
     接口必须与 Input 严格同形。Game 只用到这几样：
       left/right/up/down · pointer{active,targetX,targetY,dx,dy} · shoot · consumeDash()
     任何一项漏掉都不会报错，只会静默失效（读到 undefined），
     所以这里宁可把当前不用的字段也一并写全。 */
  input: {
    left: false,
    right: false,
    up: false,
    down: false,
    pointer: { active: false, targetX: 0, targetY: 0, dx: 0, dy: 0 },
    _dash: false,
    get shoot() { return AutoPilot.on; },
    consumeDash() { const r = this._dash; this._dash = false; return r; }
  },

  /**
   * 开关自动模式。
   * @param {object} game Game 实例
   * @returns {boolean} 切换后的状态
   */
  toggle(game) {
    return this.on ? this.disengage(game, 'toggle') : this.engage(game);
  },

  /**
   * 接管操作。
   * @param {object} game Game 实例
   * @returns {boolean} 恒为 true
   */
  engage(game) {
    this.on = true;
    this.engaged = 0;
    this.danger = 0;
    this._weaponTimer = 0;
    this._wantWeapon = '';
    this._wantHits = 0;
    this.input._dash = false;
    this.input.pointer.active = true;

    // 清掉一次按键残留：否则"玩家按着方向键去点 AI"的瞬间，
    // 那一帧的按键状态会被判成手动输入，AI 刚开就被自己踢掉。
    Input.clear();

    if (game && game.state === 'playing') {
      game.showBanner('AI 接管', '自动走位 · 自动开火', 1.2, '#b48cff');
    }
    return true;
  },

  /**
   * 交还操作权。
   * @param {object} game Game 实例
   * @param {'toggle'|'manual'|'run-over'} reason 交还原因
   * @returns {boolean} 恒为 false
   */
  disengage(game, reason) {
    this.on = false;
    this.input.pointer.active = false;
    this.input._dash = false;
    // 只有"玩家动手抢回来"才提示：主动按 I 关掉是他自己的操作，不需要再解释一遍
    if (game && game.state === 'playing' && reason === 'manual') {
      game.showBanner('已交还操作', '检测到手动输入', 1.1, '#7fe8ff');
    }
    return false;
  },

  /**
   * 清空接管状态（重开一局时调用）。参数：无。返回：无。
   * 注意这里**不**改变 on：AI 是一个档位，换一局不该把它关掉。
   */
  reset() {
    this.engaged = 0;
    this.danger = 0;
    this._weaponTimer = 0;
    this._wantWeapon = '';
    this._wantHits = 0;
    this.input._dash = false;
    this.input.pointer.active = this.on;
  },

  /**
   * 玩家此刻是否正在手动操作。
   * @returns {boolean}
   * 判的是"当前输入状态"而不是拦截事件：无论玩家用的是键盘、鼠标还是手指，
   * 也不管事件从哪个元素发起，都只有一条判断路径，不会漏掉某种输入方式。
   */
  _manualInput() {
    if (Input.pointer.active) return true;   // 手指/鼠标确实按在画布上
    if (Input.left || Input.right || Input.up || Input.down) return true;
    if (Input.keys[' '] || Input.keys['shift']) return true;
    return false;
  },

  /**
   * 每帧决策：求解落点、写进虚拟手柄、决定要不要冲刺。
   * @param {object} game Game 实例
   * @param {number} dt 时间步（秒）
   * @returns {void}
   */
  think(game, dt) {
    if (!this.on) return;

    // 手动输入永远优先：玩家一动，AI 立刻退出，而不是两边抢方向
    if (this._manualInput()) { this.disengage(game, 'manual'); return; }

    this.engaged += dt;

    // ---- 换枪决策（0.6 秒评估一次，且要求连续两次同向）----
    this._weaponTimer -= dt;
    if (this._weaponTimer <= 0) {
      this._weaponTimer = 0.6;
      this._decideWeapon(game);
    }

    // ---- 求解落点 ----
    const plan = this._solve(game);
    this.goalX = plan.x;
    this.goalY = plan.y;
    this.danger = plan.danger;

    // ---- 落点 → 虚拟指针目标 ----
    // Player 的拖动是 x += (target - x) * (1 - exp(-FOLLOW·dt))，本质是"追点"而不是
    // "按速度走"。把目标点固定在领先 lead 像素处时，稳态速度恰好等于 FOLLOW × lead。
    // 取 lead = SPEED / FOLLOW，AI 的最大速度就与键盘玩家完全一致 —— 不靠手速占便宜。
    const p = game.player;
    const lead = CFG.PLAYER.SPEED / CFG.TOUCH.FOLLOW;
    const dx = clamp(plan.x - p.x, -lead, lead);
    const dy = clamp(plan.y - p.y, -lead, lead);

    const ptr = this.input.pointer;
    ptr.active = true;
    ptr.targetX = clamp(p.x + dx, 0, CFG.W);
    ptr.targetY = clamp(p.y + dy, 0, CFG.H);
    // dx/dy 同时喂给机身倾斜与侧灯，让 AI 操作时的姿态和真人拖动看起来一样
    ptr.dx = clamp(dx / lead, -1, 1);
    ptr.dy = clamp(dy / lead, -1, 1);

    // ---- 冲刺的两个用途 ----
    // ① **硬解**：连最优格都躲不掉了（整张网格无解）→ 用 0.22 秒无敌帧扛过去。
    //    判据是「**最优格**的危险度」而不是"我现在的危险度"：
    //    全网格都躲不开，才叫躲不掉 —— 只要还有一格安全，走位就够了，不必浪费这 1.1 秒冷却。
    // ② **赶路**：去救一架快要漏掉的敌机，而它离得太远、走过去来不及 → 冲过去抢时间。
    //    这一条是从实测数据补上的：漏怪时 AI 离那架敌机平均 270px，93% 是"压根没赶过去"。
    //    冲刺 0.16 秒走 144px，比横向飞过去快一倍多，人类玩家就是这么用它的。
    //    但方向一旦锁定就改不了，所以只在身边干净时才敢盲冲。
    // 必须放在最后：dash() 会读 pointer.dx/dy 决定冲哪边，而上面刚写进去的航向
    // 正好就是"全网格里最安全的方向"，于是冲刺也是朝安全处（或朝该救的那架）冲。
    // （若 dx/dy 恰好都是 0，dash() 内部会退回"向上冲"，那是脱险方向的常见默认值。）
    // 为什么以前它从不按 shift：旧的敌机本体用的是"时间到命中"推演，把最优格的危险度
    //   长期压在 0.1 以下（实测峰值 0.11），DASH_AT=1.0 永远够不着 —— 是个结构性死代码。
    //   现在 BODY_MAX(1.6) > DASH_AT(1.0)，敌机贴脸那一刻必然越过阈值。
    this.input._dash = false;
    if (p.dashCd <= 0 && !p.isDashing) {
      if (plan.danger >= CFG.AI.DASH_AT) {
        this.input._dash = true;
      } else if (plan.danger < CFG.AI.DASH_RUSH_CLEAR) {
        const u = this._urgent(game);
        const walking = u ? u.gap / CFG.PLAYER.SPEED : 0;   // 飞过去要多久
        if (u && u.gap > CFG.AI.DASH_RUSH && walking > u.tdead * CFG.AI.DASH_RUSH_URGENT) {
          this.input._dash = true;
        }
      }
    }
  },

  /**
   * 在候选网格上求解最优点。
   * @param {object} game Game 实例
   * @returns {{x:number,y:number,danger:number}} 落点与该点的危险度
   *
   * 目标函数 = 攻击收益 − 危险度 × SAFETY。
   * 为什么把"躲"和"打"合成一个标量，而不是写成"先躲，安全了再打"两段式：
   * 两段式会掉进"躲到绝对安全、但离所有敌机都很远"的僵局 —— 它不挨打，
   * 也打不着人，于是靠漏怪扣命慢慢死。合成一个目标函数后，AI 会自然地选
   * "在够安全的位置里挑最方便输出"的那一格。
   */
  _solve(game) {
    const A = CFG.AI;
    const p = game.player;
    const x0 = p.r + CFG.PLAYER.MARGIN;
    const x1 = CFG.W - p.r - CFG.PLAYER.MARGIN;
    const y0 = CFG.H * A.Y_MIN_RATIO;
    const y1 = CFG.H * A.Y_MAX_RATIO;

    let bestScore = -Infinity;
    let bx = p.x, by = p.y, bd = 0;

    for (let r = 0; r < A.ROWS; r++) {
      const y = A.ROWS === 1 ? (y0 + y1) / 2 : y0 + (y1 - y0) * r / (A.ROWS - 1);
      for (let i = 0; i < A.SAMPLES; i++) {
        const x = x0 + (x1 - x0) * i / (A.SAMPLES - 1);
        const danger = this._danger(game, x, y);
        const gain = this._gain(game, x, y);
        const score = gain - danger * A.SAFETY;
        if (score > bestScore) { bestScore = score; bx = x; by = y; bd = danger; }
      }
    }
    return { x: bx, y: by, danger: bd };
  },

  /**
   * 找出现在"最该去救"的那一架敌机（只给冲刺赶路用）。
   * @param {object} game Game 实例
   * @returns {{x:number,gap:number,tdead:number}|null} 目标信息；没有则 null
   *
   * 为什么不复用 _gain 的导航项：那一项是"逐格打分"，回答的是"哪一格最值得待"；
   * 这里回答的是"我该不该冲过去抢时间"，是另一个问题 ——
   * 它需要知道目标离我多远、以及走过去的耗时和剩余可击杀时间之比。
   * 硬塞进 _gain 会让那个函数既算位置又做决策，两头都说不清。
   */
  _urgent(game) {
    const A = CFG.AI;
    const p = game.player;
    const killLine = CFG.H * A.Y_MAX_RATIO;
    let best = null, bestDoom = 0;
    for (let i = 0; i < game.enemies.length; i++) {
      const e = game.enemies[i];
      if (e.y < 0 || e.y >= p.y) continue;                  // 打不到的不管
      const tdead = e.speed > 1e-3 ? (killLine - e.y) / e.speed : Infinity;
      if (tdead <= 0 || tdead >= A.LEAK_HORIZON) continue;
      const doom = Math.pow(1 - tdead / A.LEAK_HORIZON, A.LEAK_CURVE);
      if (doom > bestDoom) {
        bestDoom = doom;
        best = { x: e.x, gap: Math.abs(e.x - p.x), tdead };
      }
    }
    return best;
  },

  /**
   * 计算某个候选位置的危险度。
   * @param {object} game Game 实例
   * @param {number} x 候选横坐标
   * @param {number} y 候选纵坐标
   * @returns {number} 危险度（0 = 安全，越大越危险）
   *
   * 核心手法是"时间到命中"（time-to-hit），而不是"当前距离"：
   *   对每颗敌弹求它飞到 y 这一行所需的时刻 t，再看那一刻它的横坐标离候选点多远。
   *   于是"现在离我很远、但正朝我飞来"的弹会被正确算成威胁，
   *   而"擦身而过、其实打不着我"的弹会被忽略 ——
   *   后者正是"当前距离"模型最容易犯的错：AI 会被满屏的流弹吓得乱跑，
   *   看起来躲得热闹，实际一直在放弃输出位。
   * 紧迫度取 1/(t+0.08)：0.1 秒内命中的弹权重约为 1 秒后的 5 倍，
   * 所以 AI 天然优先处理"马上要中的"，远处威胁只影响倾向。
   */
  _danger(game, x, y) {
    const A = CFG.AI;
    const p = game.player;
    const decay = A.NEAR_MISS - 1;
    let danger = 0;

    // ---- 敌弹 ----
    const bs = game.enemyBullets;
    for (let i = 0; i < bs.length; i++) {
      const b = bs[i];
      const rr = p.r + b.r + A.MARGIN;
      const t = Math.abs(b.vy) > 1e-3 ? (y - b.y) / b.vy : Infinity;
      let dist, tt;
      if (t > 0 && t <= A.HORIZON) {
        dist = Math.abs(b.x + b.vx * t - x);   // 那一刻它正好在 y 这一行上
        tt = t;
      } else if (Math.abs(b.y - y) < rr + 20) {
        // 不穿越这一行（横向平飞，或已经贴在同一高度）：
        // 按"瞬时威胁"处理。漏掉这一支的话，Boss 的环形弹幕里
        // 那些在本行横着飞的弹会被完全无视。
        dist = Math.hypot(b.x - x, b.y - y);
        tt = 0.05;
      } else {
        continue;
      }
      if (dist >= rr * A.NEAR_MISS) continue;
      const near = dist <= rr ? 1 : 1 - (dist - rr) / (rr * decay);
      danger += near / (tt + 0.08);
    }

    // ---- 敌机本体 ----
    // ⚠️ 这里刻意 **不** 用与敌弹相同的"时间到命中"推演，这是修一个实测出来的大坑：
    //   敌弹只能躲，所以"它飞到这一行"确实就是威胁；
    //   但敌机是**可以打掉**的，用同一套推演会把「我该站到它下面开火」判成高危 ——
    //   实测那一格的危险度是 8.01，乘上 SAFETY 是 -33 分，而击杀收益只有 1.34。
    //   结果 AI 宁可站着不动让敌机漏掉，也不敢过去接敌：87% 的命都丢在漏怪上。
    // 改成"贴脸才算威胁"：只在它还有 BODY_WINDOW 秒就要落到这一行时才计入，
    //   且随剩余时间三次衰减（BODY_CURVE）—— 于是 AI 能安心把瞄准打完，
    //   只在真的来不及那一刻才放弃输出。峰值 BODY_MAX > DASH_AT，
    //   所以最后一刻必然触发冲刺：躲不掉的撞击由无敌帧来解，而不是靠提前缩头。
    const es = game.enemies;
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      const tArrive = e.speed > 1e-3 ? (y - e.y) / e.speed : Infinity;
      // tArrive ≤ 0：它已经在这一行下方了，正在远离（敌机只往下落）→ 不构成威胁
      if (tArrive <= 0 || tArrive > A.BODY_WINDOW) continue;
      const rr = p.r + e.r + A.MARGIN;
      const dist = Math.abs(e.x + e.vx * tArrive - x);
      if (dist >= rr * A.NEAR_MISS) continue;
      const near = dist <= rr ? 1 : 1 - (dist - rr) / (rr * (A.NEAR_MISS - 1));
      danger += near * A.BODY_MAX * Math.pow(1 - tArrive / A.BODY_WINDOW, A.BODY_CURVE);
    }

    // ---- Boss 本体 ----
    // 刻意 *不* 判定：它停在 y≈108、半径 46，而 AI 的纵向上界是 0.52H = 312，
    // 纵向差至少 204，远大于两者判定半径之和（16+46），永远撞不到。
    // 写上只是死代码，还会让后来人误以为这里需要考虑它。
    return danger;
  },

  /**
   * 计算某个候选位置的"攻击收益"。
   * @param {object} game Game 实例
   * @param {number} x 候选横坐标
   * @param {number} y 候选纵坐标
   * @returns {number} 收益（越大越值得去）
   */
  _gain(game, x, y) {
    const A = CFG.AI;
    const p = game.player;
    // 命中宽度：激光是一条竖直光柱（判定用 box，比视觉更宽），
    // 双列分左右两条弹道，单发只有一条细线 —— 站得越正，命中越稳。
    const spread = p.weapon === 'laser' ? 30 : (p.weapon === 'twin' ? 38 : 18);
    let gain = 0;

    // ---- 敌机 ----
    // ⚠️ 必须带 y 门槛：子弹只向上飞，站在这一格只能打到"还在我上方"的敌机。
    // 少了这个门槛，AI 会站得高高的（实测它常年缩在 312，也就是活动区上界）
    // 去"瞄"已经掉到它下面的敌机 —— 那根本打不到，于是漏怪。
    const es = game.enemies;
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      if (e.y < 0 || y <= e.y) continue;   // 还没进场 / 已经掉到我下方，都打不着
      // 越接近底部越急：漏掉一架同样扣一命，所以击杀优先级必须跟着上涨。
      // 这一项是 AI 不会退化成"只躲不打"的关键。
      const rush = clamp((e.y - 120) / (CFG.H - 420), 0, 1);
      const w = 0.4 + A.RUSH_BOTTOM * rush;
      const off = e.x - x;
      gain += w * Math.exp(-(off * off) / (2 * spread * spread));
    }

    // ---- 导航：挑一架"最该去救"的敌机，然后赶过去 ----
    // 上面那个循环用的是窄核（spread 只有 18~38px），它只回答"我有没有对准"，
    // 回答不了"要不要往那边走"。于是 AI 一辈子只打恰好落到自己头上的那几架，
    // 屏幕另一侧的敌机从生成到漏掉它全程无感 —— 实测 67% 的命就是这么丢的。
    //
    // 五个要点，每一个都是实测逼出来的：
    // ① **取 max 而不是求和**。求和会造出一个"多点吸引力"的势场，
    //    于是 AI 停在几架待漏敌机的**正中间**，谁也没救到 ——
    //    实测漏怪时它离那架敌机平均 220px，77% 的情况是"压根没赶过去"。
    //    取 max 等于"认准最该救的那一架、赶过去"，这才是导航该有的行为。
    // ② 用**线性**核而不是高斯核：高斯核在 200px 外梯度就衰减到几乎为零，
    //    AI 只会"轻微偏一点"而不是真的赶过去。线性核的梯度是常数，多远都拽得动。
    // ③ y 门槛（y > e.y）：从这一格根本打不到它就不该给分。
    //    这一条同时在"教"AI 往下站 —— 站得越低，能打的敌机越多。
    // ④ 死线取**AI 自己的击杀下界**（Y_MAX_RATIO 那一行）而不是漏怪线：
    //    敌机一旦掉到那条线以下，AI 就再也打不到它了（子弹只向上飞）。
    //    用漏怪线当死线会白送 0.3~0.4 秒，实测漏怪时敌机的 y 全是 617~630。
    // ⑤ "赶不赶得到"的软化因子：追一个时限内到不了的目标，等于把别的敌机一起漏掉。
    const killLine = CFG.H * A.Y_MAX_RATIO;
    let nav = 0;
    for (let i = 0; i < es.length; i++) {
      const e = es[i];
      if (e.y < 0 || y <= e.y) continue;
      const tdead = e.speed > 1e-3 ? (killLine - e.y) / e.speed : Infinity;
      if (tdead <= 0 || tdead >= A.LEAK_HORIZON) continue;   // 打不到了 / 还早
      const gap = Math.abs(e.x - x);
      const tgo = gap / CFG.PLAYER.SPEED;                    // 赶过去要多久
      const doom = Math.pow(1 - tdead / A.LEAK_HORIZON, A.LEAK_CURVE);
      const reach = Math.max(0, 1 - gap / A.NAV_REACH);
      const feas = clamp(1 - tgo / Math.max(tdead, 0.05), 0, 1);
      const v = A.LEAK_SAVE * doom * reach * feas;
      if (v > nav) nav = v;
    }
    gain += nav;

    // ---- Boss ----
    if (game.boss && game.boss.entered) {
      const off = game.boss.x - x;
      const bs = p.weapon === 'laser' ? 80 : 50;   // 体型很宽，几乎不需要瞄准
      gain += 1.1 * Math.exp(-(off * off) / (2 * bs * bs));
    }

    // ---- 道具 ----
    // 权重远小于一次有效输出：道具是"顺手拿"，不值得为它穿过一片弹幕。
    // 危险度那边有 SAFETY 倍率兜底，所以"安全时才去捡"是自动成立的，不必另写分支。
    const us = game.powerups;
    for (let i = 0; i < us.length; i++) {
      const u = us[i];
      const ox = u.x - x, oy = u.y - y;
      gain += A.POWERUP_PULL * Math.exp(-(ox * ox + oy * oy) / (2 * 170 * 170));
    }

    // ---- 平滑项 ----
    // 没有它，AI 会在两个几乎等价的空档之间来回抽搐（看起来像在发抖），
    // 也会为了 0.001 的收益差横穿半个屏幕。
    gain -= 0.18 * (Math.abs(x - p.x) / CFG.W + Math.abs(y - p.y) / CFG.H);

    return gain;
  },

  /**
   * 决定要不要换枪（0.6 秒评估一次，且要求连续两次意向一致）。
   * @param {object} game Game 实例
   * @returns {void}
   * 为什么需要滞后：敌机数量在 2↔3 之间抖动时，按"当前数量"选枪会让 AI
   * 每秒换好几次枪 —— 换枪会重置射击冷却（等于白掉输出），屏幕上的提示也会刷屏。
   */
  _decideWeapon(game) {
    const p = game.player;
    if (p.weapons.length <= 1) return;   // 只有一把枪，没有可评估的选项

    let want;
    if (game.boss && game.boss.entered) {
      // Boss 血厚且体型宽 → 激光的持续输出最划算，而且几乎不可能打空
      want = p.weapons.includes('laser') ? 'laser' : 'pulse';
    } else {
      const es = game.enemies;
      let engaged = 0, urgent = 0, minX = Infinity, maxX = -Infinity;
      for (let i = 0; i < es.length; i++) {
        const e = es[i];
        if (e.y < 0) continue;
        engaged++;
        if (e.x < minX) minX = e.x;
        if (e.x > maxX) maxX = e.x;
        if (e.y > CFG.H * 0.55) urgent++;   // 已经压到下半屏的敌机
      }
      const wide = isFinite(minX) && (maxX - minX) > 130;
      if (this.weaponPolicy === 'band') {
        // 已实测更差的变体，保留仅为让 A/B 可复现。理由见 weaponPolicy 处的注释。
        if (engaged >= 2 && p.weapons.includes('twin')) want = 'twin';
        else if (urgent >= 2 && p.weapons.includes('laser')) want = 'laser';
        else want = 'pulse';
      } else {
        // 门槛是"≥3 个且分散 >130px"。这里的 `es.length` 确实把 y<0 的敌机也算进去了，
        // 但实测（见上）放宽它反而更差，所以**保持原样** ——
        // 看着不严谨的门槛，未必是错的；改它之前先做受控 A/B。
        if (es.length >= 3 && wide && p.weapons.includes('twin')) want = 'twin';
        else if (urgent >= 2 && p.weapons.includes('laser')) want = 'laser';
        else want = 'pulse';
      }
    }
    if (!p.weapons.includes(want)) want = 'pulse';

    // 滞后判定：连续两次意向一致才真的切
    if (want === this._wantWeapon) this._wantHits++;
    else { this._wantWeapon = want; this._wantHits = 1; }

    if (this._wantHits >= 2 && want !== p.weapon) game.switchWeapon(want);
  }
};

/* ============================================================================
 * 4. 实体类
 * ========================================================================== */

/**
 * 玩家飞船。
 * 职责：根据输入更新自己的位置与冷却计时；绘制自己。
 *      它不做任何游戏规则判定（扣命、结束游戏等），那是 Game 的职责——
 *      实体只描述"我是什么、我在哪、我长什么样"。
 */
class Player {
  constructor() {
    this.reset();
  }

  /**
   * 复位到初始状态。
   * @returns {void}
   */
  reset() {
    this.x = CFG.W / 2;                  // 初始位置：底部正中
    this.y = CFG.H - 70;
    this.r = CFG.PLAYER.RADIUS;          // 碰撞半径
    this.speed = CFG.PLAYER.SPEED;
    this.lives = CFG.PLAYER.LIVES;
    this.cooldown = 0;                   // 射击冷却剩余时间（秒）
    this.invincible = 0;                 // 无敌剩余时间（秒）
    this.tilt = 0;                       // 机身视觉倾斜（纯绘制用）
    this.thrust = 1;                     // 尾焰强度 0~1（纯绘制用）

    // ---- 冲刺状态 ----
    this.dashTime = 0;                   // 冲刺剩余时间（> 0 表示正在冲刺）
    this.dashCd = 0;                     // 冲刺冷却剩余时间
    this.dashVx = 0;                     // 冲刺方向（单位向量），开始冲刺时锁定
    this.dashVy = 0;

    // ---- 道具赋予的临时状态（秒）----
    // 全部用"独立计时器 + 每帧递减"实现，而不是布尔标记，
    // 这样 HUD 能直接读出剩余秒数，玩家知道还剩多久，不用猜。
    this.shieldTime = 0;                 // 护盾：受击只破盾不扣命
    this.spreadTime = 0;                 // 散射：三向开火
    this.rapidTime = 0;                  // 急速：射击冷却减半

    // ---- 纯绘制用 ----
    this.engineTimer = 0;                // 尾迹粒子发射节流
    this.shieldPhase = 0;                // 护盾环旋转相位
    this.bankGlow = 0;                   // 转向时的侧灯亮度

    // ---- 武器 ----
    // 用"已解锁集合 + 当前选中"两个字段而不是一个数字索引：
    // 这样以后要加武器只要往集合里塞名字，切换顺序可以任意调整。
    this.weapons = ['pulse'];            // 已解锁的武器（开局只有单发）
    this.weapon = 'pulse';               // 当前武器
    this.laserOn = 0;                    // 激光已持续的时间（纯视觉，用来做光柱抖动）
  }

  /**
   * 每帧更新位置与计时器。
   * @param {number} dt    时间步（秒）
   * @param {object} input Input 模块（提供 left/right/up/down）
   * @returns {void}
   */
  update(dt, input) {
    // ---- 计时器统一推进 ----
    if (this.cooldown > 0) this.cooldown -= dt;
    if (this.invincible > 0) this.invincible -= dt;
    if (this.dashCd > 0) this.dashCd -= dt;
    if (this.shieldTime > 0) this.shieldTime -= dt;
    if (this.spreadTime > 0) this.spreadTime -= dt;
    if (this.rapidTime > 0) this.rapidTime -= dt;
    this.shieldPhase += dt * 2.4;
    this.engineTimer -= dt;
    this.laserOn += dt;

    // ---- 计算输入方向 ----
    let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);

    // 斜向归一化：同时按两个方向时，向量长度是 √2，
    // 不除以长度就会让"斜着走"比"直着走"快 41%，操作手感会歪。
    if (dx !== 0 || dy !== 0) {
      const len = Math.hypot(dx, dy);
      dx /= len;
      dy /= len;
    }

    // ---- 触摸/鼠标拖动：覆盖方向键输入 ----
    // 两种输入互斥处理而不是叠加：如果拖动的同时还按着方向键，
    // 两套位移会打架，手感变得完全不可预测。谁"更直接"就听谁的 —— 指针更直接。
    const ptr = input.pointer;
    const dragging = !!(ptr && ptr.active) && this.dashTime <= 0;
    if (dragging) {
      // 用 1 - exp(-k·dt) 做指数插值，而不是固定比例的 lerp。
      // 固定比例（如 x += (t-x)*0.2）会让跟随速度随帧率变化，
      // 120Hz 手机上飞船会明显比 60Hz 更"窜"，指数形式则完全一致。
      const t = 1 - Math.exp(-CFG.TOUCH.FOLLOW * dt);
      this.x += (ptr.targetX - this.x) * t;
      this.y += (ptr.targetY - this.y) * t;
      // 倾斜沿用拖动方向，视觉上和拖动保持一致
      dx = ptr.dx;
      dy = ptr.dy;
    }

    // ---- 位移 ----
    const m = CFG.PLAYER.MARGIN;
    if (this.dashTime > 0) {
      // 冲刺期间：忽略一切输入，沿开始冲刺时锁定的方向猛冲。
      // 为什么锁定方向而不是实时跟随输入？因为 0.16 秒内玩家手指几乎必然会
      // 滑到别的键上，实时跟随会让冲刺方向变得不可预测，等于把保命技变成随机技。
      this.dashTime -= dt;
      this.x += this.dashVx * CFG.DASH.SPEED * dt;
      this.y += this.dashVy * CFG.DASH.SPEED * dt;

      // 冲刺时尾焰拉到最亮（视觉上"推力全开"）
      this.thrust = 1.6;
    } else if (!dragging) {
      // 注意这里是 `!dragging` 而不是 `!ptr.active`：
      // 拖动时的位移已经在上面用插值算过了，这里再加一次等于速度翻倍。
      // （这类"两处各写了一点位移"的 bug 靠肉眼几乎看不出来，只能靠条件写严）
      this.x += dx * this.speed * dt;
      this.y += dy * this.speed * dt;
      // 尾焰每帧随机抖动，模拟火焰不稳定地跳动
      this.thrust = 0.7 + Math.random() * 0.3;
    } else {
      this.thrust = 1.15;   // 拖动时推力略大，视觉上呼应"手在推着它走"
      dx *= 0.7;            // 拖动到位后逐渐回正，避免机身一直歪着
    }

    // 边界限制放在两种位移之后统一处理，避免冲刺直接冲出画面
    this.x = clamp(this.x, this.r + m, CFG.W - this.r - m);
    this.y = clamp(this.y, CFG.H * CFG.PLAYER.Y_MIN_RATIO, CFG.H - this.r - m);

    // 倾斜角朝输入方向平滑插值（*0.28 是最大倾角，dt*10 是插值速度），
    // 用插值而不是直接赋值，转向时会有一点点惯性感，视觉上更"重"。
    this.tilt += (dx * 0.28 - this.tilt) * Math.min(1, dt * 10);
    // 侧灯亮度跟随转向方向：左转亮左灯、右转亮右灯，给操作一个即时视觉呼应
    this.bankGlow = Math.abs(dx) > 0.01 ? 1 : Math.max(0, this.bankGlow - dt * 3);
  }

  /**
   * "完全免疫"：这一状态下连接触都不该发生，碰撞检测整段跳过。
   * @returns {boolean}
   * 为什么必须和 isInvincible 分开：
   *   护盾是"能挡一次"的可消耗防御，不是"碰不到"。
   *   如果把护盾也算进这个状态，碰撞阶段就会直接跳过，
   *   于是护盾永远不会被消耗 —— 一个不会破的护盾等于永久无敌。
   *   （这个 bug 正是被 verify/selftest.js 场景 D 抓出来的。）
   */
  get isProtected() {
    return this.invincible > 0 || this.dashTime > 0;
  }

  /**
   * 当前是否处于某种保护之下（含护盾）。用于对外语义与 HUD 显示。
   * @returns {boolean}
   */
  get isInvincible() {
    return this.isProtected || this.shieldTime > 0;
  }

  /** @returns {boolean} 当前是否正在冲刺（用于绘制残影） */
  get isDashing() { return this.dashTime > 0; }

  /**
   * 触发一次冲刺。
   * @returns {boolean} 是否成功触发（冷却中会被拒绝）
   */
  dash(input) {
    if (this.dashTime > 0 || this.dashCd > 0) return false;

    // 方向优先级：方向键 > 拖动方向 > 默认向上。
    // 触摸/鼠标下没有方向键，所以用"手指最近移动的方向"来冲；
    // 若手指静止悬停，退回默认的向上冲（最常见的脱险方向）。
    let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    const ptr = input.pointer;
    if (dx === 0 && dy === 0 && ptr && (ptr.dx !== 0 || ptr.dy !== 0)) {
      dx = ptr.dx;
      dy = ptr.dy;
    }
    if (dx === 0 && dy === 0) { dx = 0; dy = -1; }
    const len = Math.hypot(dx, dy);
    this.dashVx = dx / len;
    this.dashVy = dy / len;

    this.dashTime = CFG.DASH.TIME;
    this.dashCd = CFG.DASH.COOLDOWN;
    // 冲刺自带的无敌独立于"受击无敌"，写在 invincible 上即可（取较大值不会互相削弱）
    this.invincible = Math.max(this.invincible, CFG.DASH.INVINCIBLE);
    return true;
  }

  /**
   * 尝试发射子弹。
   * @returns {Array<Bullet>} 本次实际生成的子弹（可能 0、1、2、4 发）
   * 说明：冷却放在这里而不是 Game 里，是为了让"射击频率"这件事
   *      只由玩家自己负责，Game 只关心 Input.shoot 是不是按着。
   *      返回数组而不是单发，是为了让"散射/双列"这些改弹道的机制
   *      不需要 Game 知道任何细节 —— Game 只管把返回的子弹都塞进数组。
   */
  shoot() {
    // 激光不发实体子弹：它是一条持续光束，伤害按 dt 结算。
    // 放在冷却判断之前返回，是为了让切到激光时不会残留上一发的冷却。
    if (this.weapon === 'laser') return [];

    if (this.cooldown > 0) return [];

    const W = CFG.WEAPON[this.weapon.toUpperCase()];
    // 急速道具让冷却减半：射速翻倍，配合散射就是"弹幕覆盖"的爽感
    const cd = W.cd * (this.rapidTime > 0 ? 0.5 : 1);
    this.cooldown = cd;

    // 子弹从机头前方出发，避免一出生就叠在机身上
    const bx = this.x;
    const by = this.y - this.r - 6;
    const a = CFG.BULLET.SPREAD_ANGLE;
    const out = [];

    if (this.weapon === 'twin') {
      // 双列用"横向平移"而不是"角度外扩"：
      // 角度外扩在远距离会散得过开，命中率反而下降；
      // 平行双弹道能保持两条等宽的覆盖带，清横向排开的敌机时明显更好用。
      const o = W.offset;
      out.push(new Bullet(bx - o, by, 0, { damage: W.dmg, twin: true }));
      out.push(new Bullet(bx + o, by, 0, { damage: W.dmg, twin: true }));
      // 散射道具叠加在双列上：给外侧两条各再斜射一发，共 4 发
      if (this.spreadTime > 0) {
        out.push(new Bullet(bx - o, by, -a, { damage: W.dmg, twin: true }));
        out.push(new Bullet(bx + o, by, a, { damage: W.dmg, twin: true }));
      }
    } else {
      // 单发：正中一发；吃到散射就变成三向
      if (this.spreadTime > 0) {
        out.push(new Bullet(bx, by, -a, { damage: W.dmg }));
        out.push(new Bullet(bx, by, 0,  { damage: W.dmg }));
        out.push(new Bullet(bx, by, a,  { damage: W.dmg }));
      } else {
        out.push(new Bullet(bx, by, 0, { damage: W.dmg }));
      }
    }
    return out;
  }

  /**
   * 激光本帧应造成的伤害（按 dt 结算，而不是"每帧固定值"）。
   * @param {number} dt 时间步（秒）
   * @returns {number}
   * 为什么要乘 dt：如果写成"每帧造成固定伤害"，伤害就会随帧率翻倍 ——
   * 120Hz 手机上激光会比 60Hz 强一倍。所有"持续型"伤害都必须乘 dt。
   */
  laserDamage(dt) {
    const W = CFG.WEAPON.LASER;
    // 急速道具作用在激光上是"提高输出"而不是"缩短冷却"（激光本来就没有冷却）
    return W.dps * (this.rapidTime > 0 ? 1.6 : 1) * dt;
  }

  /** @returns {boolean} 当前是否在使用激光 */
  get usingLaser() { return this.weapon === 'laser'; }

  /**
   * 激光光束的矩形范围（从机头一直向上）。
   * @returns {{x:number,y:number,w:number,h:number}}
   */
  get laserBeam() {
    const W = CFG.WEAPON.LASER;
    const top = this.y - this.r - CFG.LASER_LEN;
    return {
      x: this.x - W.width / 2,
      y: top,
      w: W.width,
      h: this.y - this.r - top
    };
  }

  /**
   * 切换到指定武器。
   * @param {string} name 武器名（'pulse' | 'twin' | 'laser'）
   * @returns {boolean} 是否切换成功（未解锁会被拒绝）
   */
  switchWeapon(name) {
    if (!this.weapons.includes(name)) return false;
    if (this.weapon === name) return false;
    this.weapon = name;
    this.cooldown = 0;          // 换枪即重置冷却，避免"切枪后被上一把的冷却卡住"
    return true;
  }

  /** 按固定顺序切到下一把已解锁武器。参数：无。返回：切换到的武器名。 */
  cycleWeapon() {
    const order = ['pulse', 'twin', 'laser'].filter((w) => this.weapons.includes(w));
    if (order.length <= 1) return this.weapon;
    const i = order.indexOf(this.weapon);
    this.weapon = order[(i + 1) % order.length];
    this.cooldown = 0;
    return this.weapon;
  }

  /**
   * 解锁一把武器。
   * @param {string} name 武器名
   * @returns {boolean} true 表示这是一把新武器（用于决定要不要弹提示）
   */
  unlockWeapon(name) {
    if (!CFG.WEAPON[name.toUpperCase()]) return false;
    if (this.weapons.includes(name)) return false;
    this.weapons.push(name);
    // 解锁即自动装备：捡到新武器却还要手动切一次，等于把奖励变成了操作负担
    this.weapon = name;
    this.cooldown = 0;
    return true;
  }

  /**
   * 绘制飞船。
   * @param {CanvasRenderingContext2D} ctx 画布上下文
   * @returns {void}
   */
  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);

    // ---- 冲刺残影：在机身后面拖 4 个逐渐变淡的旧位置 ----
    // 用透明度递减的重复轮廓模拟速度线，比单纯的 motion blur 便宜得多，
    // 但足以让"冲刺"这个动作在视觉上一眼可辨。
    if (this.isDashing) {
      for (let i = 4; i >= 1; i--) {
        const k = i / 5;
        ctx.globalAlpha = 0.16 * (1 - k) + 0.05;
        ctx.beginPath();
        ctx.moveTo(-this.dashVx * 14 * i, -this.dashVy * 14 * i - this.r);
        ctx.lineTo(-this.dashVx * 14 * i + 7, -this.dashVy * 14 * i + 8);
        ctx.lineTo(-this.dashVx * 14 * i - 7, -this.dashVy * 14 * i + 8);
        ctx.closePath();
        ctx.fillStyle = '#7fe8ff';
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.rotate(this.tilt * 0.5);   // 倾斜只用一半幅度，克制一点不容易看出是"整体旋转"

    // 受击无敌期间闪烁：只闪"受击无敌"，护盾和冲刺各自有独立的视觉表现，
    // 全部混在一起闪会让玩家分不清自己到底处于哪种保护状态。
    const blink = this.invincible > 0 && this.shieldTime <= 0 && !this.isDashing;
    if (blink && Math.sin(this.invincible * 40) < 0) {
      ctx.restore();
      return;
    }

    // ---- 尾焰：外焰（宽、暗）+ 内焰（窄、亮）双层 ----
    // 单层火焰看起来像一块贴纸；分两层、长度不同、颜色不同，才有燃烧的层次。
    const flame = (13 + this.thrust * 12) * (this.isDashing ? 1.5 : 1);
    ctx.beginPath();
    ctx.moveTo(-7, 11);
    ctx.lineTo(0, 11 + flame * 1.35);
    ctx.lineTo(7, 11);
    ctx.closePath();
    ctx.fillStyle = 'rgba(60, 150, 235, 0.55)';
    ctx.shadowColor = '#4fd1ff';
    ctx.shadowBlur = 18;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-3.4, 11);
    ctx.lineTo(0, 11 + flame);
    ctx.lineTo(3.4, 11);
    ctx.closePath();
    ctx.fillStyle = 'rgba(215, 246, 255, 0.95)';
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;            // 用完立刻清零，避免影响后续绘制

    // ---- 后掠机翼：用渐变换色，翼尖偏冷、翼根偏暖，产生受光方向的暗示 ----
    const wingGrad = ctx.createLinearGradient(-18, 0, 18, 0);
    wingGrad.addColorStop(0, '#1c4468');
    wingGrad.addColorStop(0.5, '#3f7fb5');
    wingGrad.addColorStop(1, '#1c4468');
    ctx.beginPath();
    ctx.moveTo(-17, 8); ctx.lineTo(-6, -4); ctx.lineTo(-6, 12);
    ctx.closePath();
    ctx.moveTo(17, 8);  ctx.lineTo(6, -4);  ctx.lineTo(6, 12);
    ctx.closePath();
    ctx.fillStyle = wingGrad;
    ctx.fill();

    // ---- 翼尖航行灯：转向时对应一侧亮起 ----
    if (this.bankGlow > 0.05) {
      const side = this.tilt > 0 ? 1 : -1;
      ctx.globalAlpha = this.bankGlow;
      ctx.beginPath();
      ctx.arc(side * 17, 6, 2.6, 0, TAU);
      ctx.fillStyle = side > 0 ? '#9beaff' : '#ffb0c4';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ---- 机身：朝上的四边菱形，用渐变模拟金属反光 ----
    const g = ctx.createLinearGradient(0, -this.r - 6, 0, 15);
    g.addColorStop(0, '#f4fbff');
    g.addColorStop(0.45, '#a9dcff');
    g.addColorStop(1, '#4a86c4');
    ctx.beginPath();
    ctx.moveTo(0, -this.r - 6);
    ctx.lineTo(9, 10);
    ctx.lineTo(0, 15);
    ctx.lineTo(-9, 10);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();

    // ---- 机身高光棱线：一条细白线沿机身中轴，金属感全靠它 ----
    ctx.beginPath();
    ctx.moveTo(0, -this.r - 3);
    ctx.lineTo(0, 9);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // ---- 座舱 ----
    ctx.beginPath();
    ctx.arc(0, -2, 4.5, 0, TAU);
    ctx.fillStyle = '#0b2b4a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(150, 230, 255, 0.9)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();

    // ---- 护盾环：画在旋转坐标系之外（不随机身倾斜），看起来才是"包裹"而不是"贴在机身上" ----
    if (this.shieldTime > 0) this.drawShield(ctx);
  }

  /**
   * 绘制护盾：旋转的双层六边形能量环 + 呼吸明暗。
   * @param {CanvasRenderingContext2D} ctx
   * @returns {void}
   */
  drawShield(ctx) {
    const R = this.r + 13;
    // 快到期时（最后 1.5 秒）加快闪烁，给玩家"护盾要没了"的预警
    const expiring = this.shieldTime < 1.5;
    const pulse = 0.72 + Math.sin(this.shieldPhase * 2.2) * 0.28;
    ctx.save();
    ctx.translate(this.x, this.y);

    ctx.globalAlpha = expiring
      ? (Math.sin(this.shieldTime * 22) * 0.5 + 0.5) * 0.75 * pulse
      : pulse;
    ctx.strokeStyle = '#7fe8ff';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#4fd1ff';
    ctx.shadowBlur = 16;

    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i + this.shieldPhase;
      const px = Math.cos(a) * R;
      const py = Math.sin(a) * R;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // 内层反向旋转且更淡，形成"能量流动"的错觉
    ctx.globalAlpha *= 0.45;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - this.shieldPhase * 1.6;
      const px = Math.cos(a) * (R - 5);
      const py = Math.sin(a) * (R - 5);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/**
 * 子弹：自下而上直线飞行。
 * 位置用"中心点"存储，碰撞时再换算成左上角包围盒。
 */
class Bullet {
  /**
   * @param {number} x     出生点 x
   * @param {number} y     出生点 y
   * @param {number} angle 相对"正上方"的偏角（弧度，0 = 笔直向上，正数偏右）
   *                       散射道具靠它实现；普通射击传 0 即可。
   * @param {object} [opts] 可选覆盖项
   *        opts.damage 单发伤害（默认取 CFG.BULLET.DAMAGE）
   *        opts.twin   true 时用"双列"配色，让玩家一眼看出自己拿的是哪把武器
   */
  constructor(x, y, angle, opts) {
    const o = opts || {};
    this.x = x;
    this.y = y;
    this.angle = angle || 0;

    // 预存三角函数：碰撞盒每帧都要算一次旋转后的包围盒，
    // 而 angle 在整个飞行过程中不变，所以完全没有必要反复调用 Math.cos/sin。
    this.cos = Math.cos(this.angle);
    this.sin = Math.sin(this.angle);

    this.vx = this.sin * CFG.BULLET.SPEED;      // 偏角带来的横向速度
    this.vy = -this.cos * CFG.BULLET.SPEED;     // 负值 = 向上（Canvas 的 y 轴向下为正）
    this.w = CFG.BULLET.W;
    this.h = CFG.BULLET.H;
    this.damage = o.damage != null ? o.damage : CFG.BULLET.DAMAGE;
    this.twin = !!o.twin;
    this.dead = false;                          // 死亡标记，由 Game 统一回收

    // ---- 光矛拖尾：保存最近若干帧的位置，绘制时连成一条渐细的光带 ----
    // 只在子弹内部存位置，不需要额外的 Effect 对象，
    // 也不会干扰碰撞（碰撞只看 this.x / this.y）。
    this.trail = [];
  }

  /**
   * 更新位置，并标记出界。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   */
  update(dt) {
    // 拖尾先记录"当前"位置再移动，这样光带正好落在身后
    this.trail.unshift(this.x, this.y);
    if (this.trail.length > CFG.BULLET.TRAIL * 2) this.trail.length = CFG.BULLET.TRAIL * 2;

    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // 飞出顶部就标记 dead，而不是在这里直接 splice。
    // 原因：此刻很可能正在 for 循环遍历 bullets 数组，
    //      边遍历边删除会导致索引错位、漏掉元素甚至死循环。
    // 同时判断左右出界：散射子弹斜飞时可能从侧面离开，不回收会永远留在数组里。
    if (this.y + this.h < 0 || this.x < -20 || this.x > CFG.W + 20) this.dead = true;
  }

  /**
   * 左上角包围盒（供 AABB 使用）。
   * @returns {{x:number,y:number,w:number,h:number}}
   * 细节：子弹被旋转后，它的轴对齐包围盒会比原始 w×h 大一点点。
   *      这里按旋转角把真实外接矩形算出来（|w·cos|+|h·sin|），
   *      而不是偷懒用 w×h —— 否则斜射的子弹会出现"看着打中了却没判定"的鬼影。
   *      因为 cos/sin 已缓存，这个 getter 每帧的成本几乎为零。
   */
  get box() {
    const c = Math.abs(this.cos);
    const s = Math.abs(this.sin);
    const bw = this.w * c + this.h * s;
    const bh = this.h * c + this.w * s;
    return { x: this.x - bw / 2, y: this.y - bh / 2, w: bw, h: bh };
  }

  /**
   * 绘制子弹：拖尾光带 + 头部光矛。
   * @param {CanvasRenderingContext2D} ctx
   * @returns {void}
   */
  draw(ctx) {
    // 双列用琥珀色、单发用青白：武器状态必须能在"余光里"分辨出来，
    // 否则切了武器玩家还得低头看 HUD 才敢确认。
    const glow = this.twin ? '#ffcf6a' : '#7fe8ff';
    const core = this.twin ? '#fff0c4' : '#9beeff';

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);        // 让光矛指向飞行方向

    // ---- 拖尾：由粗到细的三段渐隐，营造"高速切开空气"的拉丝感 ----
    const seg = CFG.BULLET.TRAIL;
    if (this.trail.length >= 4) {
      for (let i = 1; i < seg; i++) {
        const idx = i * 2;
        if (idx + 1 >= this.trail.length) break;
        const tx = this.trail[idx] - this.x;
        const ty = this.trail[idx + 1] - this.y;
        const k = 1 - i / seg;                     // 越靠后越淡越细
        ctx.globalAlpha = k * 0.5;
        ctx.beginPath();
        ctx.arc(tx, ty, (this.w / 2) * k * 1.15, 0, TAU);
        ctx.fillStyle = glow;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ---- 头部：亮芯 + 外层辉光，两段叠出"光矛"的实体感 ----
    ctx.shadowColor = glow;
    ctx.shadowBlur = 14;
    ctx.fillStyle = core;
    ctx.fillRect(-this.w / 2 - 1, -this.h / 2 - 2, this.w + 2, this.h + 4);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-this.w / 2 + 0.6, -this.h / 2, this.w - 1.2, this.h);

    ctx.restore();
  }
}

/**
 * 敌人：从顶部随机位置向下移动，可带横向漂移。
 * 分两档：普通敌（1 血）与精英敌（3 血、更大、得分更高）。
 */
class Enemy {
  /**
   * @param {number} level 当前难度等级（从 1 开始）
   */
  constructor(level) {
    const E = CFG.ENEMY;
    const growth = level - 1;   // 等级成长量，多处复用

    // ---- 精英判定：概率随等级线性提升，但设上限 ----
    const eliteChance = Math.min(
      E.ELITE_CHANCE_MAX,
      E.ELITE_CHANCE + growth * E.ELITE_CHANCE_PER_LEVEL
    );
    this.elite = Math.random() < eliteChance;

    this.maxHp = this.elite ? E.HP_ELITE : E.HP_NORMAL;
    this.hp = this.maxHp;
    this.r = this.elite ? E.RADIUS * E.ELITE_SCALE : E.RADIUS;

    // ---- 出生位置：顶部上方一点点，横向随机但留出半径不贴边 ----
    this.x = rand(this.r + 12, CFG.W - this.r - 12);
    this.y = -this.r - 4;

    // ---- 下落速度：基础速度 + 等级成长，再叠加 ±jitter 的随机浮动 ----
    // 随机浮动是"敌人不会像一堵墙一样同速推进"的关键
    const baseSpeed = E.BASE_SPEED + growth * E.SPEED_PER_LEVEL;
    this.speed = baseSpeed * rand(1 - E.SPEED_JITTER, 1 + E.SPEED_JITTER);

    // ---- 横向漂移：只有一部分敌人有，制造走位压力 ----
    this.vx = Math.random() < E.DRIFT_CHANCE ? rand(-E.DRIFT, E.DRIFT) : 0;

    this.spin = rand(0, Math.PI * 2);   // 自转角（纯视觉）
    this.hitFlash = 0;                  // 受击白闪剩余时间（秒）
    this.dead = false;
  }

  /**
   * 更新位置与状态。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   */
  update(dt) {
    this.y += this.speed * dt;
    this.x += this.vx * dt;

    // 碰到左右边界就反弹。不能让它飘出屏幕——那样它既打不到、
    // 又不会触发"到底扣命"，会变成一个永远存在的幽灵对象。
    if (this.x - this.r < 0 && this.vx < 0) this.vx = -this.vx;
    if (this.x + this.r > CFG.W && this.vx > 0) this.vx = -this.vx;

    this.spin += dt * CFG.ENEMY.ROT_SPEED;
    if (this.hitFlash > 0) this.hitFlash -= dt;
  }

  /** @returns {{x:number,y:number,w:number,h:number}} 包围盒（供 AABB 用） */
  get box() {
    return { x: this.x - this.r, y: this.y - this.r, w: this.r * 2, h: this.r * 2 };
  }

  /** @returns {{x:number,y:number,r:number}} 圆形轮廓（供圆形检测用） */
  get circle() {
    return { x: this.x, y: this.y, r: this.r };
  }

  /** @returns {boolean} 是否已经越过屏幕底部（用于扣命判定） */
  get pastBottom() {
    return this.y - this.r > CFG.H;
  }

  /**
   * 受到伤害。
   * @param {number} damage 伤害值
   * @returns {boolean} true 表示这次伤害导致敌人被击毁
   */
  hit(damage) {
    this.hp -= damage;
    this.hitFlash = 0.12;   // 白闪一瞬间，给玩家明确的命中反馈
    return this.hp <= 0;
  }

  /**
   * 绘制敌人。
   * @param {CanvasRenderingContext2D} ctx
   * @returns {void}
   */
  draw(ctx) {
    const R = this.r;
    const flash = this.hitFlash > 0;
    const T = this.spin;
    const now = this.spin;   // 自转相位顺带当动画时钟用，省一个计时器字段

    ctx.save();
    ctx.translate(this.x, this.y);

    // 受击瞬间整体变白，是"我打中了"最廉价也最有效的视觉反馈
    const hot = this.elite ? '#ffb457' : '#ff5d7a';
    const bodyColor = flash ? '#ffffff' : hot;

    if (this.elite) {
      // ================= 精英敌 =================
      ctx.rotate(T);

      // ---- 外圈脉冲环：用六边形描边而非 arc() ----
      // 刻意的实现约束：普通敌的绘制路径里不能出现半径 > 10 的 arc()，
      // 否则自检脚本里"是否存在大半径圆"这条精英分支判据就失去意义了。
      const pulse = R * (1.16 + Math.sin(now * 2.4) * 0.07);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI / 2;
        const px = Math.cos(a) * pulse;
        const py = Math.sin(a) * pulse;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(255, 180, 87, 0.5)';
      ctx.lineWidth = 1.6;
      ctx.shadowColor = hot;
      ctx.shadowBlur = 14;
      ctx.stroke();

      // ---- 主体六边形：径向渐变让它看起来是个有体积的壳，而不是一块色板 ----
      const shell = ctx.createLinearGradient(0, -R, 0, R);
      shell.addColorStop(0, flash ? '#ffffff' : '#ffd79a');
      shell.addColorStop(0.55, bodyColor);
      shell.addColorStop(1, flash ? '#ffffff' : '#b45c14');
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI / 2;
        const px = Math.cos(a) * R;
        const py = Math.sin(a) * R;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = shell;
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;

      // ---- 内饰棱线：三条径向线，让六边形内部有结构感 ----
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = (Math.PI / 3) * i * 2 - Math.PI / 2;
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * R * 0.82, Math.sin(a) * R * 0.82);
      }
      ctx.strokeStyle = 'rgba(80, 35, 0, 0.42)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // ---- 内核：半径 R*0.45 ≈ 12px，这是自检用来识别"精英分支"的标志圆 ----
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.45, 0, TAU);
      ctx.fillStyle = '#3a1d05';
      ctx.fill();
      // 内核里的能量亮点随呼吸缩放
      ctx.beginPath();
      ctx.arc(0, 0, R * 0.45 * (0.42 + Math.sin(now * 3.6) * 0.16), 0, TAU);
      ctx.fillStyle = '#ffdc9a';
      ctx.shadowColor = '#ffb457';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.restore();

      // ---- 精英敌血条：画在包围盒上方，不跟随自转（否则会晃得看不清）----
      // 高度固定 4px 是给自检留的识别特征（用 fillRect 的尺寸反查敌人类型）
      if (this.hp > 0) {
        const w = R * 2;
        const ratio = this.hp / this.maxHp;
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(this.x - w / 2, this.y - R - 9, w, 4);
        ctx.fillStyle = ratio > 0.5 ? '#ffd479' : '#ff7a7a';
        ctx.fillRect(this.x - w / 2, this.y - R - 9, w * ratio, 4);
        ctx.restore();
      }
      return;
    }

    // ================= 普通敌 =================
    ctx.rotate(Math.sin(T) * 0.14);   // 普通敌只做小幅摇摆，不做整圈自转（否则像在翻滚）

    // ---- 外层机壳：尖头朝下的三角 ----
    const hull = ctx.createLinearGradient(0, -R * 0.8, 0, R);
    hull.addColorStop(0, flash ? '#ffffff' : '#8e2540');
    hull.addColorStop(0.5, bodyColor);
    hull.addColorStop(1, flash ? '#ffffff' : '#ff5570');
    ctx.beginPath();
    ctx.moveTo(0, R);
    ctx.lineTo(-R * 0.92, -R * 0.8);
    ctx.lineTo(R * 0.92, -R * 0.8);
    ctx.closePath();
    ctx.fillStyle = hull;
    ctx.shadowColor = hot;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    // ---- 内侧装甲板：同形状缩到 62%，颜色更深，制造"双层壳体"的厚度 ----
    ctx.beginPath();
    ctx.moveTo(0, R * 0.66);
    ctx.lineTo(-R * 0.52, -R * 0.42);
    ctx.lineTo(R * 0.52, -R * 0.42);
    ctx.closePath();
    ctx.fillStyle = flash ? '#ffffff' : 'rgba(40, 8, 20, 0.55)';
    ctx.fill();

    // ---- 顶部双推进器喷口：两个上扬的小三角 + 光点，暗示敌人是"飞下来"的 ----
    ctx.beginPath();
    ctx.moveTo(-R * 0.62, -R * 0.8);
    ctx.lineTo(-R * 0.30, -R * 1.02);
    ctx.lineTo(-R * 0.18, -R * 0.62);
    ctx.closePath();
    ctx.moveTo(R * 0.62, -R * 0.8);
    ctx.lineTo(R * 0.30, -R * 1.02);
    ctx.lineTo(R * 0.18, -R * 0.62);
    ctx.closePath();
    ctx.fillStyle = flash ? '#ffffff' : '#7a1c33';
    ctx.fill();

    // 喷口光点（半径 2 左右，远小于 10，不会干扰自检判据）
    ctx.beginPath();
    ctx.arc(-R * 0.40, -R * 0.84, R * 0.13, 0, TAU);
    ctx.moveTo(R * 0.40 + R * 0.13, -R * 0.84);
    ctx.arc(R * 0.40, -R * 0.84, R * 0.13, 0, TAU);
    ctx.fillStyle = flash ? '#ffffff' : 'rgba(255, 200, 220, 0.9)';
    ctx.fill();

    // ---- 核心"眼"：半径 R*0.30 ≈ 5px ----
    ctx.beginPath();
    ctx.arc(0, -R * 0.15, R * 0.30, 0, TAU);
    ctx.fillStyle = flash ? '#ffffff' : '#2a0710';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -R * 0.15, R * 0.30 * 0.5, 0, TAU);
    ctx.fillStyle = flash ? '#ffffff' : '#ff8ea3';
    ctx.fill();

    ctx.restore();
  }
}

/**
 * 粒子：爆炸碎片。带初速度 + 指数阻尼 + 渐隐。
 */
class Particle {
  /**
   * @param {number} x     初始 x
   * @param {number} y     初始 y
   * @param {number} vx    初速度 x（像素/秒）
   * @param {number} vy    初速度 y
   * @param {number} life  寿命（秒）
   * @param {string} color 颜色
   * @param {number} size  初始半径
   */
  constructor(x, y, vx, vy, life, color, size) {
    this.reset(x, y, vx, vy, life, color, size);
  }

  /**
   * 重置粒子参数（复用对象，减少垃圾回收压力）。
   * @returns {void} 参数含义同构造函数
   */
  reset(x, y, vx, vy, life, color, size) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.life = life;
    this.maxLife = life;   // 保存初始寿命，用于计算渐隐比例
    this.color = color;
    this.size = size;
    this.dead = false;
  }

  /**
   * 更新粒子。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   */
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;

    // 指数阻尼：v *= e^(-k·dt)。
    // 为什么不用 v *= 0.95 这种写法？因为那是"每帧"衰减，
    // 60Hz 和 144Hz 下粒子会明显一个跑得远、一个跑得近，帧率不一致就不公平。
    // 用 e^(-k·dt) 才能保证"单位时间内的衰减量"与帧率无关。
    const damp = Math.exp(-CFG.PARTICLE.DAMPING * dt);
    this.vx *= damp;
    this.vy *= damp;

    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }

  /**
   * 绘制粒子。
   * @param {CanvasRenderingContext2D} ctx
   * @returns {void}
   */
  draw(ctx) {
    const t = this.life / this.maxLife;   // 1 → 0 的生命比例
    ctx.globalAlpha = t;                  // 越接近死亡越透明
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * t, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;                  // 立刻复位，避免污染后续绘制
  }
}

/**
 * 背景星：靠 z（深度）分层做视差滚动。
 * 远处的星暗而慢，近处的星亮而快，画面立刻有了纵深。
 */
class Star {
  constructor() {
    this.reset(true);
  }

  /**
   * 重置一颗星。
   * @param {boolean} randomY true = 在整屏随机位置生成（初始化用），
   *                          false = 从顶部重新进入（滚动出界后复用）
   * @returns {void}
   */
  reset(randomY) {
    this.x = Math.random() * CFG.W;
    this.y = randomY ? Math.random() * CFG.H : -3;
    this.z = Math.random();                          // 深度 0（远）~ 1（近）
    this.speed = 16 + this.z * 90;                   // 越近越快
    this.size = 0.6 + this.z * 1.6;                  // 越近越大
    // 每颗星给一个独立的闪烁相位。如果所有星同相位，整片天会一起明一起暗，
    // 看起来像画面在闪故障；独立相位才是"各自闪烁"的自然感。
    this.phase = Math.random() * TAU;
  }

  /**
   * 更新：向下滚动，出界后从顶部复用。
   * @param {number} dt 时间步（秒，已按状态乘过倍率）
   * @returns {void}
   */
  update(dt) {
    this.y += this.speed * dt;
    this.phase += dt * CFG.STAR_TWINKLE * (0.5 + this.z);
    if (this.y > CFG.H + 3) this.reset(false);
  }

  /**
   * 绘制一颗星。
   * @param {CanvasRenderingContext2D} ctx
   * @returns {void}
   */
  draw(ctx) {
    const tw = 0.72 + Math.sin(this.phase) * 0.28;   // 闪烁系数 0.44~1
    const a = (0.2 + this.z * 0.7) * tw;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#cfe8ff';
    ctx.fillRect(this.x, this.y, this.size, this.size);

    // ---- 近星的十字星芒 ----
    // 只给 z 足够大的少数星画，全部画会糊成一片白噪点。
    // 用两条细矩形（而不是带 shadowBlur 的线条）是有意为之：
    // shadowBlur 每帧调用上百次会明显掉帧，矩形几乎零成本。
    if (this.z > CFG.STAR_CROSS_MIN_Z) {
      const L = this.size * 6;
      ctx.globalAlpha = a * 0.42;
      ctx.fillRect(this.x - L / 2 + this.size / 2, this.y + this.size / 2 - 0.4, L, 0.8);
      ctx.fillRect(this.x + this.size / 2 - 0.4, this.y - L / 2 + this.size / 2, 0.8, L);
    }
    ctx.globalAlpha = 1;
  }
}

/**
 * 星云团：一团非常淡的彩色雾，缓慢平移并循环。
 * 作用是把"纯黑背景 + 白点"变成有色彩层次的深空，
 * 同时给静止的菜单界面一点缓慢的生命感。
 */
class Nebula {
  /**
   * @param {number} i 序号（用来错开初始位置与色调）
   */
  constructor(i) {
    this.x = rand(0, CFG.W);
    this.y = rand(0, CFG.H);
    this.r = rand(120, 230);
    this.speed = rand(3, 9);            // 极慢，几乎察觉不到在动，但画面不"死"
    this.hue = pick(['#2a4fd0', '#7a2fb0', '#1e6fa8', '#b0468f']);
    this.alpha = rand(0.05, 0.11);
    this.phase = rand(0, TAU) + i;
  }

  /** @param {number} dt 时间步（秒） @returns {void} */
  update(dt) {
    this.y += this.speed * dt;
    if (this.y - this.r > CFG.H) { this.y = -this.r; this.x = rand(0, CFG.W); }
    this.phase += dt * 0.35;
  }

  /** @param {CanvasRenderingContext2D} ctx @returns {void} */
  draw(ctx) {
    // 呼吸透明度：让星云缓慢明暗变化，配合漂移产生"气体在流动"的错觉
    const a = this.alpha * (0.75 + Math.sin(this.phase) * 0.25);
    const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
    g.addColorStop(0, this.hue);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = a;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/**
 * 流星：偶尔划过画面的短促光迹。
 * 纯装饰，但它承担一个具体的职能 —— 让背景在"没有战斗发生"的时间里
 * 也有偶发事件，避免玩家在等待新一波时觉得屏幕是静止的。
 */
class Meteor {
  constructor() {
    // 从上半屏随机横向位置出发，斜向右下（和星空下落的整体方向一致）
    this.x = rand(-60, CFG.W * 0.75);
    this.y = rand(-40, CFG.H * 0.35);
    const sp = rand(CFG.METEOR.SPEED_MIN, CFG.METEOR.SPEED_MAX);
    const ang = rand(0.55, 0.95);          // 与水平方向夹角，约 31°~54°
    this.vx = Math.cos(ang) * sp;
    this.vy = Math.sin(ang) * sp;
    this.life = CFG.METEOR.LIFE;
    this.maxLife = this.life;
    this.len = rand(46, 110);
    this.dead = false;
  }

  /** @param {number} dt 时间步（秒） @returns {void} */
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.life -= dt;
    if (this.life <= 0 || this.y > CFG.H + 120) this.dead = true;
  }

  /** @param {CanvasRenderingContext2D} ctx @returns {void} */
  draw(ctx) {
    const t = this.life / this.maxLife;
    const d = Math.hypot(this.vx, this.vy) || 1;
    const ux = this.vx / d;
    const uy = this.vy / d;

    // 头亮尾淡的线性渐变，是"流星"和"一条线"的区别所在
    const g = ctx.createLinearGradient(
      this.x, this.y,
      this.x - ux * this.len, this.y - uy * this.len
    );
    g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * t).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(150,225,255,' + (0.4 * t).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(80,150,255,0)');

    ctx.strokeStyle = g;
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(this.x - ux * this.len, this.y - uy * this.len);
    ctx.stroke();
  }
}

/**
 * 冲击波圆环：爆炸时向外扩张的一圈光。
 * 为什么爆炸里必须有它：单靠粒子只会让人看到"碎屑散开"，
 * 而一圈快速扩张的环才传达"能量释放"这件事，也是所有动作游戏爆炸的标配。
 */
class Shockwave {
  /**
   * @param {number} x     圆心 x
   * @param {number} y     圆心 y
   * @param {number} maxR  最大半径（像素）
   * @param {string} color 环颜色
   * @param {number} life  存活时长（秒）
   */
  constructor(x, y, maxR, color, life) {
    this.x = x;
    this.y = y;
    this.maxR = maxR;
    this.color = color;
    this.life = life;
    this.maxLife = life;
    this.dead = false;
  }

  /** @param {number} dt 时间步（秒） @returns {void} */
  update(dt) {
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }

  /** @param {CanvasRenderingContext2D} ctx @returns {void} */
  draw(ctx) {
    // p 从 0 走到 1
    const p = 1 - this.life / this.maxLife;
    // 半径用"先快后慢"的开方曲线：爆炸初期扩张极快，之后减速，
    // 这是真实冲击波的观感；线性扩张会显得很假。
    const r = this.maxR * Math.sqrt(p);
    ctx.globalAlpha = (1 - p) * 0.85;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = Math.max(0.5, 4.5 * (1 - p));   // 越扩张越细
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/**
 * 飘字：击杀得分 / 连击提示 / 道具名，从产生点向上飘并淡出。
 * 存在的意义是把"分数变化"这件抽象的事情落到具体位置和具体时刻上，
 * 玩家的注意力在画面上移动，飘字让每次击杀都有即时的正反馈落点。
 */
class FloatText {
  /**
   * @param {number} x     起始 x
   * @param {number} y     起始 y
   * @param {string} text  文本
   * @param {string} color 颜色
   * @param {number} size  字号（像素）
   * @param {number} life  存活时长（秒）
   */
  constructor(x, y, text, color, size, life) {
    this.x = x;
    this.y = y;
    this.text = text;
    this.color = color;
    this.size = size;
    this.life = life;
    this.maxLife = life;
    this.vy = -46;                 // 上浮速度（像素/秒）
    this.dead = false;
  }

  /** @param {number} dt 时间步（秒） @returns {void} */
  update(dt) {
    this.y += this.vy * dt;
    // 上浮逐渐减速，像被空气拖住，比匀速上飘更自然
    this.vy *= Math.exp(-2.2 * dt);
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }

  /** @param {CanvasRenderingContext2D} ctx @returns {void} */
  draw(ctx) {
    const t = this.life / this.maxLife;
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 1.8);   // 前段保持不透明，最后 55% 才开始淡出
    ctx.font = '700 ' + this.size + 'px Consolas, "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

/**
 * 道具：击毁敌机后按概率掉落，缓慢下落。
 * 五种类型各自解决一个具体困境，而不是单纯的数值奖励。
 */
class PowerUp {
  /**
   * @param {string} type 类型键（shield / spread / rapid / bomb / life）
   * @param {number} x    出生 x
   * @param {number} y    出生 y
   */
  constructor(type, x, y) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.r = CFG.POWERUP.SIZE;
    this.vy = CFG.POWERUP.FALL_SPEED;
    this.vx = rand(-CFG.POWERUP.DRIFT, CFG.POWERUP.DRIFT);
    this.phase = rand(0, TAU);
    this.dead = false;
    this.taken = false;              // true = 已被拾取，用于放拾取特效
    this.def = PowerUp.TYPES[type];
  }

  /** @param {number} dt 时间步（秒） @returns {void} */
  update(dt) {
    this.phase += dt * 2.6;
    this.y += this.vy * dt;
    this.x += this.vx * dt;
    // 碰到左右边界反弹：道具飘出画面等于白掉，玩家会觉得很亏
    if (this.x - this.r < 0 && this.vx < 0) this.vx = -this.vx;
    if (this.x + this.r > CFG.W && this.vx > 0) this.vx = -this.vx;
    if (this.y - this.r > CFG.H) this.dead = true;
  }

  /** @returns {{x:number,y:number,r:number}} 圆形轮廓，供拾取判定用 */
  get circle() { return { x: this.x, y: this.y, r: this.r }; }

  /** @param {CanvasRenderingContext2D} ctx @returns {void} */
  draw(ctx) {
    const D = this.def;
    const breathe = 1 + Math.sin(this.phase) * 0.08;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(breathe, breathe);

    // ---- 外圈光晕：颜色即类型，玩家不用读字也能一眼分辨 ----
    ctx.globalAlpha = 0.24;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 1.55, 0, TAU);
    ctx.fillStyle = D.color;
    ctx.fill();
    ctx.globalAlpha = 1;

    // ---- 旋转的胶囊外壳：外框不断转 = 视觉上"这是可拾取物"的通用语言 ----
    ctx.save();
    ctx.rotate(this.phase * 0.6);
    ctx.beginPath();
    ctx.moveTo(0, -this.r);
    ctx.lineTo(this.r, 0);
    ctx.lineTo(0, this.r);
    ctx.lineTo(-this.r, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(6, 14, 26, 0.9)';
    ctx.strokeStyle = D.color;
    ctx.lineWidth = 2;
    ctx.shadowColor = D.color;
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // ---- 类型图标：用最简单的几何符号画，不依赖字体/图片 ----
    ctx.shadowBlur = 0;
    ctx.strokeStyle = D.color;
    ctx.fillStyle = D.color;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const s = this.r * 0.46;
    ctx.beginPath();
    switch (this.type) {
      case 'shield':                                  // 盾牌轮廓
        ctx.moveTo(0, -s);
        ctx.lineTo(s, -s * 0.35);
        ctx.lineTo(s * 0.7, s * 0.8);
        ctx.lineTo(0, s);
        ctx.lineTo(-s * 0.7, s * 0.8);
        ctx.lineTo(-s, -s * 0.35);
        ctx.closePath();
        ctx.stroke();
        break;
      case 'spread':                                  // 三向箭头
        ctx.moveTo(-s, s * 0.7);  ctx.lineTo(-s * 0.6, -s * 0.7);
        ctx.moveTo(0, s * 0.9);   ctx.lineTo(0, -s);
        ctx.moveTo(s, s * 0.7);   ctx.lineTo(s * 0.6, -s * 0.7);
        ctx.stroke();
        break;
      case 'rapid':                                   // 闪电
        ctx.moveTo(s * 0.4, -s);
        ctx.lineTo(-s * 0.35, s * 0.1);
        ctx.lineTo(s * 0.1, s * 0.1);
        ctx.lineTo(-s * 0.35, s);
        ctx.stroke();
        break;
      case 'bomb':                                    // 同心圆（爆炸）
        ctx.arc(0, 0, s * 0.95, 0, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.38, 0, TAU);
        ctx.fill();
        break;
      case 'twin':                                    // 两条平行弹道
        ctx.moveTo(-s * 0.5, s);
        ctx.lineTo(-s * 0.5, -s * 0.75);
        ctx.moveTo(s * 0.5, s);
        ctx.lineTo(s * 0.5, -s * 0.75);
        ctx.stroke();
        // 顶部箭头，强调"向上打"的方向感
        ctx.beginPath();
        ctx.moveTo(-s, -s * 0.4); ctx.lineTo(-s * 0.5, -s); ctx.lineTo(0, -s * 0.4);
        ctx.moveTo(0, -s * 0.4);  ctx.lineTo(s * 0.5, -s);  ctx.lineTo(s, -s * 0.4);
        ctx.stroke();
        break;
      case 'laser':                                   // 中心光束 + 两侧放射
        ctx.moveTo(0, s);
        ctx.lineTo(0, -s);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-s * 0.75, -s * 0.15); ctx.lineTo(-s * 0.3, -s * 0.55);
        ctx.moveTo(s * 0.75, -s * 0.15);  ctx.lineTo(s * 0.3, -s * 0.55);
        ctx.stroke();
        break;
      default:                                        // life：加号
        ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
        ctx.moveTo(0, -s); ctx.lineTo(0, s);
        ctx.stroke();
        break;
    }
    ctx.restore();
  }
}

/**
 * 道具类型表。
 * 把"权重 + 颜色 + 名称"集中成一张表，抽类型时只查表，
 * 以后想加新道具只需往这里加一行，不必动任何逻辑代码。
 */
PowerUp.TYPES = {
  shield: { weight: 26, color: '#7fe8ff', label: '护盾 SHIELD', toast: '护盾展开' },
  spread: { weight: 24, color: '#ffb457', label: '散射 SPREAD', toast: '三向散射' },
  rapid:  { weight: 22, color: '#b48cff', label: '急速 RAPID',  toast: '射速提升' },
  bomb:   { weight: 16, color: '#ff6b8a', label: '炸弹 BOMB',   toast: '全屏爆破' },
  life:   { weight: 10, color: '#8dffb0', label: '增援 +1',     toast: '生命 +1' },

  // ---- 武器解锁 ----
  // 权重刻意给得不低：武器是"改变玩法"的奖励，拿到后整局体验都不同，
  // 掉率太低等于白做了三种武器。但也不会在已解锁后继续掉落 ——
  // 那样它们就退化成"占掉一次道具机会"，见 maybeDrop() 里的过滤。
  twin:   { weight: 14, color: '#ffcf6a', label: '双列 TWIN',  toast: '解锁 双列', weapon: 'twin' },
  laser:  { weight: 12, color: '#b48cff', label: '激光 LASER', toast: '解锁 激光', weapon: 'laser' }
};

/**
 * 从类型表推导出的权重表，供 weightedPick() 使用。
 * 单独推导而不是手写第二份，是为了避免"加了新道具却忘了在权重表里登记"
 * 这种只会在运行到那一步才暴露的漏洞。
 */
PowerUp.WEIGHTS = (function () {
  const w = {};
  const keys = Object.keys(PowerUp.TYPES);
  for (let i = 0; i < keys.length; i++) w[keys[i]] = PowerUp.TYPES[keys[i]].weight;
  return w;
})();

/**
 * 敌方子弹：由 Boss 发射，向下（或朝玩家）飞行。
 * 用独立类而不是复用 Bullet，是因为两者差异很大：飞行方向相反、
 * 需要与玩家做圆形碰撞、还要带自转和脉动 —— 塞进一个类只会变成一堆 if。
 */
class EnemyBullet {
  /**
   * @param {number} x     出生 x
   * @param {number} y     出生 y
   * @param {number} vx    速度 x
   * @param {number} vy    速度 y
   * @param {string} color 颜色
   */
  constructor(x, y, vx, vy, color) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.r = CFG.BOSS.BULLET_RADIUS;
    this.color = color;
    this.phase = 0;
    this.dead = false;
  }

  /** @param {number} dt 时间步（秒） @returns {void} */
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.phase += dt * 6;
    // 出界即回收（含左右），否则斜射的弹会滞留在数组里
    if (this.y - this.r > CFG.H || this.y + this.r < -20 ||
        this.x < -30 || this.x > CFG.W + 30) this.dead = true;
  }

  /** @returns {{x:number,y:number,r:number}} 圆形轮廓，供玩家碰撞判定 */
  get circle() { return { x: this.x, y: this.y, r: this.r }; }

  /** @param {CanvasRenderingContext2D} ctx @returns {void} */
  draw(ctx) {
    const pulse = 1 + Math.sin(this.phase) * 0.14;
    ctx.save();
    ctx.translate(this.x, this.y);

    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 2 * pulse, 0, TAU);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(0, 0, this.r * pulse, 0, TAU);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 14;
    ctx.fill();

    // 内层白点：让子弹有"高能量核心"的读感，也和玩家的青色子弹区分开
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.42, 0, TAU);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.restore();
  }
}

/**
 * Boss：每 5 级出现的阶段性敌人。
 * 三个设计要点：
 *   1) 它不"扔下来"，而是横向机动 —— 强迫玩家在水平方向做长距离走位；
 *   2) 它发射慢速瞄准弹 —— 威胁来自"必须移动"而不是"反应速度"；
 *   3) 它不越过底部扣命 —— Boss 战只有一个失败条件：玩家被弹打光血。
 */
class Boss {
  /**
   * @param {number} index 第几个 Boss（从 1 开始），决定血量与分数
   */
  constructor(index) {
    const B = CFG.BOSS;
    this.index = index;
    this.maxHp = B.BASE_HP + (index - 1) * B.HP_PER_BOSS;
    this.hp = this.maxHp;
    this.r = B.RADIUS;
    this.x = CFG.W / 2;
    this.y = -B.RADIUS - 10;          // 从画面上方进场
    this.entered = false;             // 是否已经就位（未就位时不攻击）
    this.sway = 0;                    // 横向摆动相位
    this.fireTimer = B.FIRE_INTERVAL * 0.8;
    this.spin = 0;
    this.hitFlash = 0;
    this.dead = false;
    this.score = B.SCORE + (index - 1) * B.SCORE_PER_BOSS;

    // ---- 阶段状态 ----
    this.phase = 1;                   // 当前阶段 1/2/3
    this.phaseFlash = 0;              // 切换阶段的爆闪（0.6 秒）—— 给"它变了"一个明确的视觉信号
  }

  /** @param {number} dt 时间步（秒） @returns {void} */
  update(dt) {
    const B = CFG.BOSS;
    this.spin += dt * 0.5;
