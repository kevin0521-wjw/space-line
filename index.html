    if (this.hitFlash > 0) this.hitFlash -= dt;
    if (this.phaseFlash > 0) this.phaseFlash -= dt;

    if (!this.entered) {
      // 进场阶段：匀速下压到指定高度，期间不攻击。
      // 给玩家一点"它来了"的缓冲时间，而不是一出现就开火。
      this.y += 70 * dt;
      if (this.y >= B.ENTER_Y) { this.y = B.ENTER_Y; this.entered = true; }
      return;
    }

    // ---- 横向正弦机动 ----
    // 摆动速度随阶段提升：三阶段的 BOSS 移动得又快又没有规律感（视觉上），
    // 玩家不能再靠"站在它下一次经过的位置"来预判输出。
    this.sway += dt * this.swaySpeed;
    this.x = CFG.W / 2 + Math.sin(this.sway) * B.SWAY_RANGE;

    this.fireTimer -= dt;
  }

  /**
   * 当前阶段（1 = 常规，2 = 加速，3 = 狂暴）。
   * 按剩余血量比例算而不是按"被打了几次"：
   * 这样后续血量更厚的 BOSS 会自动落进同一套阈值，不需要另配一套数值。
   * @returns {number} 1 | 2 | 3
   */
  get phaseByHp() {
    const B = CFG.BOSS;
    const ratio = this.hp / this.maxHp;
    if (ratio <= B.PHASE_3_AT) return 3;
    if (ratio <= B.PHASE_2_AT) return 2;
    return 1;
  }

  /**
   * 同步阶段：检测到阶段变化时置位 phaseFlash 并返回新阶段。
   * 由 Game 每帧调用（Game 拿到"刚变阶段"的信号才好播横幅/震动）。
   * @returns {number|null} 本帧刚进入的新阶段；没有变化返回 null
   */
  syncPhase() {
    const p = this.phaseByHp;
    if (p === this.phase) return null;
    this.phase = p;
    this.phaseFlash = 0.6;
    // 阶段切换立刻重置开火计时器：让"变阶段"和"下一波弹幕"之间有最短 0.4 秒间隔，
    // 否则玩家可能在同一瞬间既要点清旧弹幕又要应对新形态，纯粹是运气问题
    this.fireTimer = 0.4;
    return p;
  }

  /** @returns {number} 当前阶段的横移角速度 */
  get swaySpeed() {
    const B = CFG.BOSS;
    if (this.phase >= 3) return B.SWAY_SPEED_3;
    if (this.phase === 2) return B.SWAY_SPEED_2;
    return B.SWAY_SPEED;
  }

  /** @returns {number} 当前阶段的开火间隔 */
  get fireInterval() {
    const B = CFG.BOSS;
    if (this.phase >= 3) return B.FIRE_INTERVAL_3;
    if (this.phase === 2) return B.FIRE_INTERVAL_2;
    return B.FIRE_INTERVAL;
  }

  /** @returns {number} 当前阶段一次射出的扇形弹数（1 = 单发瞄准弹） */
  get spreadCount() {
    const B = CFG.BOSS;
    if (this.phase >= 3) return B.SPREAD_3;
    if (this.phase === 2) return B.SPREAD_2;
    return 1;
  }

  /** @returns {boolean} 当前阶段是否附带环形弹幕（仅三阶段） */
  get hasRing() { return this.phase >= 3; }

  /** @returns {boolean} 是否该开火了（由 Game 负责实际生成子弹并复位计时器） */
  get wantsToFire() {
    return this.entered && this.fireTimer <= 0;
  }

  /** 复位开火计时器。参数：无。返回：无。 */
  resetFire() {
    // 加入 ±25% 随机浮动：固定节奏会被玩家背板，随机化后必须临场反应。
    // 三阶段浮动收窄到 ±12%，让狂暴阶段的压迫感更连贯（不再有长空档）。
    const j = this.phase >= 3 ? 0.12 : 0.25;
    this.fireTimer = this.fireInterval * rand(1 - j, 1 + j);
  }

  /** @returns {{x:number,y:number,w:number,h:number}} 包围盒（供 AABB 用） */
  get box() {
    return { x: this.x - this.r, y: this.y - this.r, w: this.r * 2, h: this.r * 2 };
  }

  /** @returns {{x:number,y:number,r:number}} 圆形轮廓（供玩家碰撞用） */
  get circle() { return { x: this.x, y: this.y, r: this.r }; }

  /**
   * 受到伤害。
   * @param {number} damage 伤害值
   * @returns {boolean} true 表示被击毁
   */
  hit(damage) {
    this.hp -= damage;
    this.hitFlash = 0.1;
    return this.hp <= 0;
  }

  /** @param {CanvasRenderingContext2D} ctx @returns {void} */
  draw(ctx) {
    const R = this.r;
    const flash = this.hitFlash > 0 || this.phaseFlash > 0;
    // 三阶段用三套配色：玩家必须能在"余光里"就判断出 BOSS 现在是什么形态，
    // 否则阶段切换就只是"数值变了"，玩家感受不到，也就谈不上重新学习应对方式。
    const pal = this.phase >= 3
      ? { ring: 'rgba(255, 74, 210, 0.62)', glow: '#ff4ad2', a: '#ffffff', b: '#e03aa8', c: '#5c0a55' }
      : this.phase === 2
        ? { ring: 'rgba(255, 161, 74, 0.58)', glow: '#ffa14a', a: '#ffd9ac', b: '#d0691a', c: '#5c2a06' }
        : { ring: 'rgba(255, 107, 138, 0.55)', glow: '#ff6b8a', a: '#ff9db2', b: '#c02a52', c: '#5c0c22' };
    const pulse = 1 + Math.sin(this.spin * 3) * 0.04;

    ctx.save();
    ctx.translate(this.x, this.y);

    // ---- 阶段切换爆闪：一圈迅速扩散的白环 ----
    // 阶段变化是 BOSS 战里最重要的信息，但很容易被弹幕淹没，
    // 所以额外给一个"整屏都能看到"的信号（Game 那边还会同时震屏 + 播横幅）。
    if (this.phaseFlash > 0) {
      const k = 1 - this.phaseFlash / 0.6;
      ctx.globalAlpha = (1 - k) * 0.85;
      ctx.beginPath();
      ctx.arc(0, 0, R * (1.3 + k * 2.1), 0, TAU);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.shadowColor = pal.glow;
      ctx.shadowBlur = 30;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // ---- 外层能量护罩：大半径虚线感圆环（用多段短弧拼成）----
    // 三阶段的护罩转得更快、段数更密 —— 视觉上"它在加速"
    ctx.save();
    ctx.rotate(-this.spin * (this.phase >= 3 ? 1.9 : this.phase === 2 ? 1.3 : 0.7));
    ctx.strokeStyle = flash ? '#ffffff' : pal.ring;
    ctx.lineWidth = 3;
    ctx.shadowColor = pal.glow;
    ctx.shadowBlur = 18;
    const dashes = this.phase >= 3 ? 16 : this.phase === 2 ? 13 : 10;
    for (let i = 0; i < dashes; i++) {
      const a0 = (TAU / dashes) * i;
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.24, a0, a0 + TAU / (dashes * 2));
      ctx.stroke();
    }
    ctx.restore();

    // ---- 主体：六边形重装甲 ----
    ctx.scale(pulse, pulse);
    const body = ctx.createLinearGradient(0, -R, 0, R);
    body.addColorStop(0, flash ? '#ffffff' : pal.a);
    body.addColorStop(0.5, flash ? '#ffffff' : pal.b);
    body.addColorStop(1, flash ? '#ffffff' : pal.c);
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 2;
      const px = Math.cos(a) * R;
      const py = Math.sin(a) * R;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = body;
    ctx.shadowColor = pal.glow;
    ctx.shadowBlur = 24;
    ctx.fill();
    ctx.shadowBlur = 0;

    // ---- 装甲分片线：三条贯穿的暗线，暗示这是拼装的重装机体 ----
    ctx.strokeStyle = 'rgba(40, 4, 14, 0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = (Math.PI / 3) * i * 2;
      ctx.moveTo(Math.cos(a) * R * 0.95, Math.sin(a) * R * 0.95);
      ctx.lineTo(Math.cos(a + Math.PI) * R * 0.95, Math.sin(a + Math.PI) * R * 0.95);
    }
    ctx.stroke();

    // ---- 中央"独眼"核：Boss 的视觉焦点，也是最亮的部分 ----
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.42, 0, TAU);
    ctx.fillStyle = '#2a0510';
    ctx.fill();
    const core = 0.6 + Math.sin(this.spin * (this.phase >= 3 ? 11 : 5)) * 0.22;
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.42 * core, 0, TAU);
    ctx.fillStyle = '#ffd7e0';
    ctx.shadowColor = pal.glow;
    ctx.shadowBlur = 26;
    ctx.fill();

    // ---- 两侧炮口：让"它为什么会发射子弹"这件事在造型上说得通 ----
    // 二阶段起炮口点亮：提前告诉玩家"火力变多了"，不用等挨打才知道
    ctx.shadowBlur = 0;
    const gunOn = this.phase >= 2;
    ctx.fillStyle = gunOn ? pal.glow : '#3d0814';
    if (gunOn) { ctx.shadowColor = pal.glow; ctx.shadowBlur = 14; }
    ctx.beginPath();
    ctx.arc(-R * 0.72, R * 0.5, R * 0.14, 0, TAU);
    ctx.moveTo(R * 0.72 + R * 0.14, R * 0.5);
    ctx.arc(R * 0.72, R * 0.5, R * 0.14, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;

    // ---- 环形弹幕指示环：三阶段才出现，对应它已经解锁了环形弹幕 ----
    if (this.hasRing) {
      ctx.globalAlpha = 0.5 + Math.sin(this.spin * 4) * 0.25;
      ctx.beginPath();
      ctx.arc(0, 0, R * 1.55, 0, TAU);
      ctx.strokeStyle = pal.glow;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 9]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }
}

/* ============================================================================
 * 5. 游戏主体 Game
 *    —— 状态机（ready / playing / paused / over）+ 实体管理 + 主循环逻辑
 * ========================================================================== */
const Game = {

  /* ---------- 运行时状态 ---------- */
  state: 'ready',    // 'ready' | 'playing' | 'paused' | 'over'
  score: 0,
  best: 0,
  level: 1,
  elapsed: 0,        // 本局存活时间（秒），同时驱动难度曲线
  bullets: [],       // 玩家子弹数组
  enemies: [],       // 敌人数组
  particles: [],     // 粒子数组
  stars: [],         // 背景星数组
  nebulae: [],       // 星云团数组
  meteors: [],       // 流星数组
  shockwaves: [],    // 冲击波圆环数组
  floatTexts: [],    // 飘字数组
  powerups: [],      // 掉落中的道具数组
  enemyBullets: [],  // 敌方子弹数组（目前只有 Boss 会发射）
  spawnTimer: 0,     // 距离下一次生成敌人的剩余时间
  shakeTime: 0,      // 屏幕震动剩余时间
  shakeMag: 0,       // 屏幕震动幅度（像素）
  flash: 0,          // 受击红闪剩余时间

  // ---- 连击系统 ----
  combo: 0,          // 当前连续击杀数
  comboTimer: 0,     // 距离断连剩余时间（秒）
  get comboLevel() {
    // 倍率等级：0 级 = x1，每 STEP 次击杀升一级，封顶 MAX_LEVEL
    return Math.min(CFG.COMBO.MAX_LEVEL, Math.floor(this.combo / CFG.COMBO.STEP));
  },
  get multiplier() { return this.comboLevel + 1; },

  // ---- Boss ----
  boss: null,        // 当前 Boss 实例（null = 没有 Boss）
  bossIndex: 0,      // 已经出现过几个 Boss
  bossWarn: 0,       // Boss 预警剩余时间（秒）

  // ---- 横幅提示（升级 / 道具拾取）----
  banner: '',        // 主标题文字
  bannerSub: '',     // 副标题文字
  bannerTime: 0,     // 剩余显示时间
  bannerMax: 1,      // 初始显示时间（用于算淡出比例）
  bannerColor: '#7fe8ff',

  // ---- 道具拾取提示（HUD 右侧短暂显示）----
  toast: '',
  toastTime: 0,

  // ---- 激光命中火花的节流计时器 ----
  // 见 applyLaserDamage：不节流会让同一位置每秒堆 60 簇粒子
  laserSparkTimer: 0,

  // ---- 本地排行榜（Top 5）----
  // 存的是对象数组 [{score, level, elapsed, ts}, ...]，按分数降序。
  scores: [],
  lastRank: 0,       // 本局在榜单上的名次（1 起）；0 = 没进榜（用于结算高亮）
  touchMode: false,  // 是否处于触屏模式（决定要不要显示屏幕按钮、HUD 要不要让位）
  hudBottomPad: 0,   // 触屏模式下底部 HUD 需要上抬的逻辑像素（由 measureTouchPad 算出）

  // ---- 二倍速档位 ----
  // 做成"跨局保留"的模式，而不是每局重置：它相当于一个难度档位，
  // 玩家开了二倍速就是打算一直这么打，每局都要重新按一次只会很烦。
  // 由此带来的风险（加速局刷出更高的分）由榜上的 ×2 标记兜住 —— 见 recordScore。
  timeScale: 1,

  // ---- 真实存活秒数 ----
  // 为什么不能直接用 elapsed：elapsed 吃的是缩放后的 dt，它驱动难度等级，
  // 属于"游戏世界内的时间"。二倍速下打 30 秒真实时间，elapsed 会走到 60。
  // 结算界面上写"存活 60.0s"对玩家就是一句假话，所以另存一个不缩放的计时。
  realElapsed: 0,

  /**
   * 当前生效的输入源：AI 接管时是"虚拟手柄"，否则是真人输入。
   * @returns {object} 一个与 Input 同形的输入对象
   * 把它做成 getter 而不是在 update() 里临时判断，是为了让"谁是当前输入源"
   * 只有一个答案 —— 否则开火这件事会被三个地方各判一次（发子弹、激光结算、
   * 画激光光柱），只要有一处忘了跟着切，AI 接管时就会出现
   * "实际在开火、但画面不画光柱"这种不报错的静默不一致。
   */
  get controlInput() {
    return AutoPilot.on ? AutoPilot.input : Input;
  },

  /** @returns {boolean} 当前是否处于"开火中"，与输入源无关 */
  get firing() {
    return this.controlInput.shoot;
  },

  /* ==========================================================================
   * 初始化：只做一次
   * ========================================================================== */
  init() {
    // ---- 画布 ----
    this.canvas = document.getElementById('game');
    this.canvas.width = CFG.W;      // 用属性而非 CSS 设定逻辑分辨率
    this.canvas.height = CFG.H;
    this.ctx = this.canvas.getContext('2d');

    // ---- 实体 ----
    this.player = new Player();

    // 星空在初始化时随机铺满整屏（randomY = true），
    // 否则开场会看到上半屏空着、星星"排队"从顶上落下来的尴尬效果
    this.stars = [];
    for (let i = 0; i < CFG.STAR_COUNT; i++) {
      const s = new Star();
      s.reset(true);
      this.stars.push(s);
    }

    // 星云团：铺一层有色雾在星空下面，把"纯黑 + 白点"变成有色彩层次的深空
    this.nebulae = [];
    for (let i = 0; i < CFG.NEBULA_COUNT; i++) {
      this.nebulae.push(new Nebula(i));
    }
    this.meteorTimer = 0;   // 流星生成计时（累积到阈值就放一颗）

    // 背景星云光晕：渐变对象创建成本不低，缓存一份反复使用
    this.bgGrad = this.ctx.createRadialGradient(
      CFG.W * 0.5, CFG.H * 0.16, 20,
      CFG.W * 0.5, CFG.H * 0.16, CFG.W * 0.75
    );
    this.bgGrad.addColorStop(0, '#101d3a');
    this.bgGrad.addColorStop(1, '#02030a');

    // HUD 区域顶部的渐隐暗带：敌人从顶部落下时会穿过分数栏，
    // 直接压一层由深到透明的遮罩，HUD 文字在任何时候都清晰可读，
    // 视觉上还像飞船穿出云层，比给文字加描边更自然。
    this.hudGrad = this.ctx.createLinearGradient(0, 0, 0, 78);
    this.hudGrad.addColorStop(0, 'rgba(2, 3, 10, 0.94)');
    this.hudGrad.addColorStop(0.65, 'rgba(2, 3, 10, 0.55)');
    this.hudGrad.addColorStop(1, 'rgba(2, 3, 10, 0)');

    // 中央横幅的底衬：一条只压暗"横幅所在横带"的软遮罩。
    // 为什么必须有：横幅虽然画在最上层，但"在上层"并不等于"读得清"——
    // 字形笔画很细，背后只要有一架亮色敌机、一团爆炸或 BOSS 的能量环，
    // 对比度立刻塌掉（实测：粉色副标题压在橙色精英敌身上几乎无法辨认）。
    // 用横向渐隐而不是整块黑色，是为了保住战场的可见度，不至于"一弹横幅就黑屏"。
    const by = CFG.H * 0.36;                 // 横幅中心线（与 drawBanner 保持一致）
    this.bannerGrad = this.ctx.createLinearGradient(0, by - 78, 0, by + 76);
    this.bannerGrad.addColorStop(0,    'rgba(2, 3, 10, 0)');
    this.bannerGrad.addColorStop(0.34, 'rgba(2, 3, 10, 0.74)');
    this.bannerGrad.addColorStop(0.64, 'rgba(2, 3, 10, 0.80)');
    this.bannerGrad.addColorStop(1,    'rgba(2, 3, 10, 0)');

    // 暗角（vignette）：中心透明、四周压暗的径向渐变。
    // 它是最省力也最有效的"电影感"手段 —— 视线被自然收拢到画面中央的战场，
    // 边缘的冷清区域被压暗后不再跟主体抢注意力。
    this.vignette = this.ctx.createRadialGradient(
      CFG.W / 2, CFG.H / 2, CFG.H * 0.34,
      CFG.W / 2, CFG.H / 2, CFG.H * 0.92
    );
    this.vignette.addColorStop(0, 'rgba(0,0,0,0)');
    this.vignette.addColorStop(1, 'rgba(0,0,0,' + CFG.FX.VIGNETTE.toFixed(2) + ')');

    // 受击用的红色暗角。跟上面同一套几何，只换颜色 ——
    // 这样"挨打"的观感是边缘在报警，而不是整块红布糊住战场。
    this.vignetteHit = this.ctx.createRadialGradient(
      CFG.W / 2, CFG.H / 2, CFG.H * 0.2,
      CFG.W / 2, CFG.H / 2, CFG.H * 0.86
    );
    this.vignetteHit.addColorStop(0, 'rgba(255,40,80,0)');
    this.vignetteHit.addColorStop(1, 'rgba(255,40,80,' + CFG.FX.HIT_VIGNETTE.toFixed(2) + ')');

    // ---- DOM 引用 ----
    this.overlay = document.getElementById('overlay');
    this.ovTitle = document.getElementById('ov-title');
    this.ovSub = document.getElementById('ov-sub');
    this.ovStats = document.getElementById('ov-stats');
    this.ovBtn = document.getElementById('ov-btn');
    this.ovBoard = document.getElementById('ov-board');
    this.wrap = document.getElementById('game-wrap');
    this.touchDash = document.getElementById('touch-dash');
    this.touchWeapon = document.getElementById('touch-weapon');
    this.touchSpeed = document.getElementById('touch-speed');
    this.touchAi = document.getElementById('touch-ai');
    this.touchDashText = document.getElementById('touch-dash-text');
    this.touchWeaponText = document.getElementById('touch-weapon-text');
    this.touchSpeedText = document.getElementById('touch-speed-text');
    this.touchAiText = document.getElementById('touch-ai-text');

    // 按钮点击：先 blur() 再处理。
    // 为什么必须 blur：按钮被点击后会获得焦点，之后按空格浏览器会
    // 把它当成"点击游戏按钮"，导致空格既射击又重开游戏，行为完全错乱。
    this.ovBtn.addEventListener('click', () => {
      this.ovBtn.blur();
      if (this.state === 'paused') this.resume();
      else this.start();
    });

    this.initTouchUI();
    this.loadBest();

    // ---- 输入 ----
    // ⚠️ 第二个参数（画布）必须传！
    //    漏了它，initPointer() 会在 `if (!c) return` 处静默早退 ——
    //    键盘一切正常，触摸和鼠标却完全没反应，而且不报任何错。
    //    （verify/selftest.js 场景 H 就是为了钉死这个静默失败。）
    Input.init((k) => this.handleOneShotKey(k), this.canvas);

    // ---- 复位并进入初始状态 ----
    this.reset();
    this.setState('ready');

    // ---- 启动主循环 ----
    // 用箭头函数包一层保证 this 指向 Game（直接传 Game.loop 会丢 this）
    const loop = (ts) => this.frame(ts);
    this._loop = loop;
    requestAnimationFrame(loop);
  },

  /* ==========================================================================
   * 主循环：requestAnimationFrame + deltaTime
   * ========================================================================== */

  /**
   * 每一帧的回调。
   * @param {number} ts requestAnimationFrame 传入的高精度时间戳（毫秒）
   * @returns {void}
   */
  frame(ts) {
    // 先把下一帧排上，保证即使本帧抛错，循环也不会彻底停死
    requestAnimationFrame(this._loop);

    // ---- 计算 deltaTime ----
    if (this._lastTs === undefined) this._lastTs = ts;
    let dt = (ts - this._lastTs) / 1000;   // 毫秒 → 秒
    this._lastTs = ts;

    // 兜底：非有限值或负值（时钟回拨）直接归零
    if (!isFinite(dt) || dt < 0) dt = 0;
    // 夹紧上限，防止切后台回来后"瞬移穿模"
    dt = Math.min(dt, CFG.MAX_DT);

    // 真实存活计时用未缩放的 dt，这样二倍速下的"存活秒数"仍是玩家手腕上的秒数
    if (this.state === 'playing') this.realElapsed += dt;

    // ---- 二倍速：全局唯一一处时间缩放 ----
    // 只在进行中生效。菜单 / 暂停 / 结算界面上也让星空加速的话，
    // 会出现"待机画面自己越飞越快"这种说不通的观感。
    // ⚠️ 缩放之后必须再夹一次 MAX_DT。若省掉这一步，最大逻辑步长会翻倍到
    //    1/15 秒，高速子弹一帧就能跨 40 像素，可能直接跳过敌机的碰撞圆
    //    （隧道效应）；那样二倍速就会变成一个"偶尔打不中"的玄学 bug。
    //    代价是帧率掉到 30 以下时二倍速会自动衰减回一倍速 ——
    //    宁可不加速，也不能让碰撞检测漏判。
    let step = dt;
    if (this.state === 'playing' && this.timeScale !== CFG.SPEED.NORMAL) {
      step = Math.min(dt * this.timeScale, CFG.MAX_DT);
    }

    this.update(step);
    this.render();
    // 触屏按钮的冷却显示跟着帧走（内部有变化检测，不会每帧写 DOM）
    this.syncTouchUI();
  },

  /* ==========================================================================
   * 更新（逻辑）
   * ========================================================================== */

  /**
   * 每帧逻辑更新。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   */
  update(dt) {
    // ---- 1) 背景层：任何状态下都在动，画面不会"死"掉 ----
    const starScale = this.state === 'playing'
      ? CFG.STAR_SPEED_ON_PLAY
      : CFG.STAR_SPEED_IDLE;
    for (let i = 0; i < this.stars.length; i++) {
      this.stars[i].update(dt * starScale);
    }
    for (let i = 0; i < this.nebulae.length; i++) this.nebulae[i].update(dt);

    // ---- 2) 流星：按"每秒期望次数"折算成固定周期内的概率 ----
    // 为什么：直接写"每帧 0.5% 概率"会让出现频率随帧率变化（144Hz 下是 60Hz 的 2.4 倍），
    // 改成 期望速率 × 检查周期 才能让不同刷新率下的观感完全一致。
    this.meteorTimer -= dt;
    if (this.meteorTimer <= 0) {
      const tick = 0.4;   // 检查周期（秒）
      if (Math.random() < CFG.METEOR.CHANCE_PER_SEC * tick) {
        this.meteors.push(new Meteor());
      }
      this.meteorTimer = tick;
    }

    // ---- 3) 全局视觉计时器衰减（放在状态判断之前，保证暂停后也能自然收尾）----
    if (this.shakeTime > 0) this.shakeTime -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.bannerTime > 0) this.bannerTime -= dt;
    if (this.toastTime > 0) this.toastTime -= dt;
    if (this.bossWarn > 0) this.bossWarn -= dt;

    // 特效对象在任何状态下都要推进并回收，否则暂停时残留的冲击波会永远停住
    this.updateEffects(dt);

    // 非进行中状态：逻辑全部冻结（暂停 = 完全静止），直接返回
    if (this.state !== 'playing') return;

    // ---- 4) 难度推进 + 升级提示 ----
    this.elapsed += dt;
    const lv = 1 + Math.floor(this.elapsed / CFG.DIFFICULTY.SECONDS_PER_LEVEL);
    const newLevel = Math.min(CFG.DIFFICULTY.MAX_LEVEL, lv);
    if (newLevel !== this.level) {
      this.level = newLevel;
      // 只在没到 Boss 等级时提示 LEVEL；到 Boss 等级时提示交给 Boss 预警，避免两条横幅打架
      if (!this.isBossLevel(newLevel)) {
        this.showBanner('LEVEL ' + newLevel, '敌军强度提升', 1.5, '#7fe8ff');
      }
    }

    // ---- 5) 连击计时：超时断连 ----
    if (this.combo > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) this.breakCombo(false);
    }

    // ---- 6) 玩家 ----
    // 输入源只有一个切换点：AI 接管时换成"虚拟手柄"，其余分支一个字都不用改。
    // 这是整个自动模式的实现基石 —— 走位插值、冲刺、开火冷却、激光结算
    // 走的是和真人完全相同的那条路径，AI 没有第二套运动学，也就无从作弊。
    const ctl = this.controlInput;
    // 决策必须在 player.update 之前完成：它要把本帧的目标点写进虚拟手柄
    if (AutoPilot.on) AutoPilot.think(this, dt);

    // 屏幕冲刺按钮走"一次性请求"通道：键盘 Shift 在 handleOneShotKey 里直接触发，
    // 指针这边则在这里被消费一次。放在 player.update 之前是有意的 ——
    // dash() 要用"当前"的拖动方向决定冲向哪边，晚一帧就会朝反方向冲出去。
    if (ctl.consumeDash() && this.player.dash(ctl)) this.onDash();

    this.player.update(dt, ctl);

    // 按住空格连发：冷却由 Player 内部管理，冷却未结束时返回空数组。
    // Player.shoot() 返回的是"本次发射的所有子弹"，散射道具因此不需要
    // Game 知道任何细节 —— 拿到什么就往数组里塞什么。
    if (this.firing) {
      const shots = this.player.shoot();
      for (let i = 0; i < shots.length; i++) this.bullets.push(shots[i]);
    }

    // ---- 6b) 激光：唯一不产生实体子弹的武器 ----
    // 它的伤害是"每帧按 DPS×dt 结算"，所以必须单独走一条通道，
    // 不能混进子弹数组（那样会在 60Hz 下每帧生成一颗子弹，既浪费又会把
    // 碰撞检测的复杂度从 O(敌×弹) 拉成 O(敌×60帧)）。
    if (this.player.usingLaser && this.firing) this.applyLaserDamage(dt);

    // ---- 7) 引擎尾迹粒子 ----
    // 用节流而不是每帧发射：60 帧全发会让粒子池迅速塞满，
    // 既浪费预算又让尾迹糊成一条实心带子，反而不好看。
    if (this.player.engineTimer <= 0) {
      this.player.engineTimer = this.player.isDashing ? 0.012 : 0.028;
      this.spawnEngineTrail();
    }

    // ---- 8) 敌人生成 + Boss 调度 ----
    this.updateBoss(dt);
    this.updateSpawning(dt);

    // ---- 9) 更新所有实体 ----
    for (let i = 0; i < this.enemies.length; i++)     this.enemies[i].update(dt);
    for (let i = 0; i < this.bullets.length; i++)     this.bullets[i].update(dt);
    for (let i = 0; i < this.particles.length; i++)   this.particles[i].update(dt);
    for (let i = 0; i < this.powerups.length; i++)    this.powerups[i].update(dt);
    for (let i = 0; i < this.enemyBullets.length; i++) this.enemyBullets[i].update(dt);
    if (this.boss) this.boss.update(dt);

    // ---- 10) 碰撞判定 + 道具拾取 + 回收 ----
    this.handleCollisions();
    this.handlePowerups(dt);
    this.cleanup();

    // ---- 11) 实时刷新最高分（不必等结束，HUD 上能实时看到破纪录）----
    if (this.score > this.best) this.best = this.score;
  },

  /**
   * 推进并回收所有"纯特效"对象。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   * 单独抽出来的原因：这些对象在暂停/结束界面也要继续演完，
   * 如果塞在 `if (state !== 'playing') return` 之后，暂停时爆炸会僵在半空。
   */
  updateEffects(dt) {
    for (let i = this.meteors.length - 1; i >= 0; i--) {
      this.meteors[i].update(dt);
      if (this.meteors[i].dead) this.meteors.splice(i, 1);
    }
    for (let i = this.shockwaves.length - 1; i >= 0; i--) {
      this.shockwaves[i].update(dt);
      if (this.shockwaves[i].dead) this.shockwaves.splice(i, 1);
    }
    for (let i = this.floatTexts.length - 1; i >= 0; i--) {
      this.floatTexts[i].update(dt);
      if (this.floatTexts[i].dead) this.floatTexts.splice(i, 1);
    }
  },

  /**
   * 判断某个等级是否属于"Boss 等级"。
   * @param {number} lv 等级
   * @returns {boolean}
   */
  isBossLevel(lv) {
    return lv > 0 && lv % CFG.BOSS.EVERY_LEVELS === 0;
  },

  /**
   * 在飞船尾部生成尾迹粒子。
   * @returns {void}
   */
  spawnEngineTrail() {
    const p = this.player;
    if (this.particles.length > CFG.PARTICLE.MAX) return;

    // 尾迹速度方向 = 飞船运动的反方向 + 一点随机散射。
    // 纯反方向会拉成一条笔直的线，掺入随机后才有"气流被搅动"的松软感。
    const d = randDir();
    const sp = rand(30, 110) * (p.isDashing ? 1.8 : 1);
    const color = p.isDashing ? '#ffffff' : pick(['#7fe8ff', '#4fd1ff', '#a9e8ff']);
    this.particles.push(new Particle(
      p.x + rand(-3, 3),
      p.y + p.r * 0.62,
      d.x * sp,
      d.y * sp + 90,                     // 整体有个向下的初速，模拟被推力甩出
      rand(0.16, 0.4),
      color,
      rand(1.0, 2.4)
    ));
  },

  /**
   * Boss 调度：到 Boss 等级就召唤、Boss 存活时接管开火。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   */
  updateBoss(dt) {
    const B = CFG.BOSS;

    // ---- 召唤 ----
    // 条件写成"该出现的 Boss 序号 × 间隔 ≤ 当前等级"，这样即使帧率抖动
    // 导致等级一次跳了 2 级，也不会漏掉 Boss，更不会重复召唤。
    const due = (this.bossIndex + 1) * B.EVERY_LEVELS;
    if (!this.boss && this.level >= due) {
      this.bossIndex++;
      this.boss = new Boss(this.bossIndex);
      this.bossWarn = 2.2;
      this.showBanner('战 备 警 报', 'BOSS 已进入战区', 2.2, '#ff6b8a');
      this.addShake(0.5, 8);
      return;
    }

    if (!this.boss) return;

    // ---- 阶段推进 ----
    // 每帧同步一次：血量在 handleCollisions 里被扣，所以这里最多滞后一帧（16ms），
    // 玩家不可能察觉。反过来如果放在扣血处同步，激光那种"每帧多次结算"的路径
    // 就得重复调用，反而容易漏。
    const nextPhase = this.boss.syncPhase();
    if (nextPhase !== null) this.onBossPhase(nextPhase);

    // ---- 开火 ----
    if (this.boss.wantsToFire) {
      this.boss.resetFire();
      this.bossFire();
    }
  },

  /**
   * Boss 进入新阶段时的表现层反馈。
   * @param {number} phase 刚进入的阶段（2 或 3）
   * @returns {void}
   * 为什么表现层要和 syncPhase() 分开：
   *   Boss 类只该知道自己"变了"，不该知道"要播哪条横幅、震多久屏"——
   *   那是 Game 的职责。分开放也让自检能单独断言 syncPhase 的返回值。
   */
  onBossPhase(phase) {
    const b = this.boss;
    if (!b) return;

    const isRage = phase >= 3;
    this.showBanner(
      isRage ? '狂 暴 化' : 'B O S S  强 化',
      isRage ? '环形弹幕 · 火力全开' : '装甲解锁 · 火力提升',
      1.6,
      isRage ? '#ff4ad2' : '#ffa14a'
    );

    this.addShake(0.35, isRage ? 13 : 9);
    this.shockwaves.push(new Shockwave(b.x, b.y, isRage ? 320 : 230,
                                       isRage ? '#ff4ad2' : '#ffa14a', 0.6));
    this.explode(b.x, b.y, isRage ? '#ff4ad2' : '#ffa14a', isRage ? 40 : 26, 1.2);
    this.flash = isRage ? 0.28 : 0.16;

    // ---- 阶段切换时清空场上敌弹 ----
    // 这是个刻意的"让一口气"设计：玩家刚把血量打进下一个阈值，
    // 此时屏幕上往往已经积了一屏弹幕，如果紧接着又叠上更密的新弹，
    // 死亡会显得是运气而不是操作。清屏把阶段切换变成一个"喘息的节拍"，
    // 玩家能明确感受到"我打赢了一小局，现在开始下一局"。
    this.enemyBullets.length = 0;
    this.floatTexts.push(new FloatText(b.x, b.y - b.r - 18, '敌弹清除', '#ffffff', 16, 0.9));
  },

  /**
   * Boss 开火。弹幕形态完全由当前阶段决定：
   *   一阶段 —— 单发瞄准弹（教学：让你看懂"它只会瞄你现在的位"）
   *   二阶段 —— 三发扇形（同一套躲避方式，但容错窗口收窄）
   *   三阶段 —— 五发扇形 + 一圈环形弹（新的躲避规则：不能只横着走）
   * @returns {void}
   */
  bossFire() {
    const b = this.boss;
    const p = this.player;
    const sp = CFG.BOSS.BULLET_SPEED;
    const color = b.phase >= 3 ? '#ff4ad2' : (b.phase === 2 ? '#ffa14a' : '#ff6b8a');
    const ox = b.x;
    const oy = b.y + b.r * 0.5;

    // ---- 瞄准基准角 ----
    // 瞄准玩家"当前"位置（不是预判位置）。
    // 刻意不做提前量：预判弹在慢速下会变成"怎么躲都被打中"，
    // 而瞄当前位置的弹，玩家只要一直移动就自然躲开了 —— 规则的公平性比难度更重要。
    const aim = Math.atan2(p.y - b.y, p.x - b.x);
    const n = b.spreadCount;

    // ---- 扇形/单发 ----
    for (let i = 0; i < n; i++) {
      // 让弹幕以 aim 为中心左右对称展开：n=1 时 k=0（正对玩家），
      // n=3 时 k = -1,0,1，n=5 时 k = -2,-1,0,1,2。
      // 用 (i - (n-1)/2) 而不是"从 aim 开始累加"，中心那一发永远正对玩家，
      // 玩家因此有一个稳定的"最危险的那一发"可以优先处理。
      const k = i - (n - 1) / 2;
      const a = aim + k * CFG.BOSS.SPREAD_ANGLE;
      this.enemyBullets.push(new EnemyBullet(
        ox, oy, Math.cos(a) * sp, Math.sin(a) * sp, color
      ));
    }

    // ---- 环形弹幕（仅三阶段）----
    // 环形的意义不是"多打几下"，而是"封锁横向走位"：
    // 只靠左右横移躲扇形弹的玩家到这里必须学会"卡缝隙穿过去"。
    if (b.hasRing) {
      const R = CFG.BOSS.RING_3;
      const rs = CFG.BOSS.RING_SPEED_3;
      // 用自转相位当起始角：每一轮的缝隙位置都不同，防止被玩家背板
      const off = b.spin * 1.7;
      for (let i = 0; i < R; i++) {
        const a = off + (TAU / R) * i;
        this.enemyBullets.push(new EnemyBullet(
          ox, oy, Math.cos(a) * rs, Math.sin(a) * rs, '#ff9de4'
        ));
      }
    }
  },

  /**
   * 激光的每帧伤害结算。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   * 和子弹通道的三个区别：
   *   ① 伤害按 DPS×dt 算，帧率无关；
   *   ② 不消耗自己 —— 光束一直在，每帧都能打；
   *   ③ 同时命中整条光柱上的所有目标（穿透），这是激光唯一的、也是核心的优势。
   */
  applyLaserDamage(dt) {
    const p = this.player;
    const beam = p.laserBeam;
    const dmg = p.laserDamage(dt);
    let hitAny = false;

    // ---- 敌人（倒序遍历，命中即结算）----
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (!aabbOverlap(beam, e.box)) continue;
      hitAny = true;
      if (e.hit(dmg)) {
        this.enemies.splice(i, 1);
        this.killEnemy(e);
      }
    }

    // ---- BOSS ----
    if (this.boss && aabbOverlap(beam, this.boss.box)) {
      hitAny = true;
      if (this.boss.hit(dmg)) this.killBoss();
    }

    // ---- 命中火花（节流到每 60ms 一簇）----
    // 不节流的话 60FPS 下每秒会在同一位置堆 60 簇粒子，
    // 既看不清"打中了"的闪烁感，又会把粒子池瞬间吃满。
    this.laserSparkTimer -= dt;
    if (hitAny && this.laserSparkTimer <= 0) {
      this.laserSparkTimer = 0.06;
      this.spark(p.x + rand(-4, 4), p.y - p.r - CFG.LASER_LEN * 0.55, '#c9b6ff', 5);
    }
  },

  /**
   * 敌人生成：按"随机间隔"投放，间隔随等级缩短。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   */
  updateSpawning(dt) {
    const E = CFG.ENEMY;

    this.spawnTimer -= dt;
    if (this.spawnTimer > 0) return;

    // ---- 生成一个敌人：它的速度、血量、精英概率都在构造里按当前等级算好 ----
    this.enemies.push(new Enemy(this.level));

    // ---- 计算下一次生成的间隔 ----
    // 基础间隔随等级线性缩短，并受 MIN_INTERVAL 兜底（否则后期会密到不可玩）
    let base = Math.max(
      E.MIN_INTERVAL,
      E.BASE_INTERVAL - (this.level - 1) * E.INTERVAL_PER_LEVEL
    );

    // Boss 在场时把小怪节奏拉长一倍多：
    // 否则"躲 Boss 弹幕"和"清杂兵"两件事会互相挤占玩家的注意力，
    // Boss 战就退化成一片混乱，玩家只会觉得是设计失误而不是难度。
    if (this.boss) base *= 2.2;

    // 再叠加 ±INTERVAL_JITTER 的随机浮动。
    // 纯粹的固定间隔会让玩家立刻背出节奏，随机化之后每一波都要即兴反应。
    this.spawnTimer = base * rand(1 - E.INTERVAL_JITTER, 1 + E.INTERVAL_JITTER);
  },

  /* ==========================================================================
   * 碰撞检测
   * ========================================================================== */

  /**
   * 统一处理三类碰撞：子弹×敌人、玩家×敌人、敌人越界。
   * 全部使用"倒序遍历 + 立即 splice"：
   * 倒着走时，删除当前元素只会影响它后面的索引，
   * 而后面那些都已经访问过了，所以既不会漏项也不会越界。
   * @returns {void}
   */
  handleCollisions() {
    const p = this.player;

    // ---------- 1) 子弹 × 敌人（AABB）----------
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      const eb = e.box;   // 本帧敌人位置不变，包围盒算一次就够

      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (!aabbOverlap(b.box, eb)) continue;

        const dmg = b.damage;
        this.bullets.splice(j, 1);   // 命中即消耗，一颗子弹只结算一次

        if (e.hit(dmg)) {
          this.enemies.splice(i, 1);
          this.killEnemy(e);
          break;   // 敌人已被移除，没必要再用剩下的子弹去检测它
        }
        // 未击毁（精英敌）：继续用后面的子弹检测同一个敌人，
        // 一帧内多发的子弹可以同时结算，打击感更干脆。
        // 同时给一簇小火花，让"打中了但没打死"和"打空了"在视觉上能区分。
        this.spark(b.x, b.y - 6, '#ffd7e0', 3);
      }
    }

    // ---------- 2) 子弹 × Boss ----------
    if (this.boss) {
      const boss = this.boss;
      const bb = boss.box;
      for (let j = this.bullets.length - 1; j >= 0; j--) {
        const b = this.bullets[j];
        if (!aabbOverlap(b.box, bb)) continue;
        this.bullets.splice(j, 1);
        this.spark(b.x, b.y, '#ffd7e0', 4);
        if (boss.hit(b.damage)) {
          this.killBoss();
          break;
        }
      }
    }

    // ---------- 3) 玩家 × 敌人（圆形）----------
    // 完全免疫期间直接跳过整段检测：这是"一次接触只扣一命"的主要保障。
    // 判定用 isProtected 而不是 isInvincible：护盾必须走完碰撞流程才会被消耗，
    // 用错就会得到一个"永远打不破的护盾"，等于永久无敌。
    if (!p.isProtected) {
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        if (!circleOverlap(p, e.circle)) continue;

        this.enemies.splice(i, 1);
        this.explode(e.x, e.y, '#7fd8ff', CFG.PARTICLE.EXPLOSION_COUNT, 1.2);
        this.damagePlayer();
        break;   // 一帧只扣一次命；剩下的交给无敌时间处理
      }
    }

    // ---------- 4) 玩家 × Boss（圆形）----------
    // Boss 撞到玩家不会消失 —— 它是关底目标，撞一下只扣命。
    // 注意这里没有扣完命就 break 的问题：Boss 只有一个。
    if (this.boss && !p.isProtected && circleOverlap(p, this.boss.circle)) {
      this.damagePlayer();
    }

    // ---------- 5) 玩家 × 敌方子弹（圆形）----------
    if (!p.isProtected) {
      for (let i = this.enemyBullets.length - 1; i >= 0; i--) {
        const eb = this.enemyBullets[i];
        if (!circleOverlap(p, eb.circle)) continue;
        this.enemyBullets.splice(i, 1);
        this.spark(p.x, p.y - p.r * 0.5, eb.color, 12);
        this.damagePlayer();
        break;
      }
    }

    // ---------- 6) 敌人越过底部 ----------
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (!e.pastBottom) continue;

      // 漏怪要付出代价，否则玩家可以一直躲着不打。
      // 同时断连：这是连击系统里最重要的负反馈 ——
      // 让"漏掉一个"的心理成本远大于它本身扣的那点血。
      this.enemies.splice(i, 1);
      this.breakCombo(true);
      this.damagePlayer();
    }
  },

  /**
   * 拾取判定 + 道具磁吸。
   * @param {number} dt 时间步（秒）
   * @returns {void}
   * 单独成一个方法并接收 dt（而不是并进 handleCollisions），
   * 是因为磁吸是个"逐帧加速"的过程，必须有时间步参与；碰撞检测本身则不需要。
   */
  handlePowerups(dt) {
    const p = this.player;
    const P = CFG.POWERUP;

    for (let i = this.powerups.length - 1; i >= 0; i--) {
      const u = this.powerups[i];

      // ---- 磁吸 ----
      // 没有磁吸的话，玩家会频繁经历"差几像素没接到"。
      // 那是纯粹的操作挫败，而不是难度，所以用一个随距离增强的引力来兜住。
      const dx = p.x - u.x;
      const dy = p.y - u.y;
      const d = Math.hypot(dx, dy);
      if (d > 0.001 && d < P.MAGNET_RADIUS) {
        const pull = (1 - d / P.MAGNET_RADIUS) * 900;
        u.x += (dx / d) * pull * dt;
        u.y += (dy / d) * pull * dt;
      }

      if (circleOverlap(p, u.circle)) {
        this.powerups.splice(i, 1);
        this.applyPowerUp(u.type);
        continue;
      }
      if (u.dead) this.powerups.splice(i, 1);
    }
  },

  /**
   * 结算一次敌人击毁：加分、连击、爆炸、飘字、掉落。
   * @param {Enemy} e 被击毁的敌人
   * @returns {void}
   */
  killEnemy(e) {
    const E = CFG.ENEMY;
    const base = e.elite ? E.SCORE_ELITE : E.SCORE_NORMAL;
    // 得分 = 基础分 × 连击倍率。倍率只在击杀这一处生效，
    // 保证玩家看到的每一个数字都能手算出来，不需要猜规则。
    const gained = base * this.multiplier;
    this.score += gained;

    this.addKill();
    this.explode(e.x, e.y,
      e.elite ? '#ffb457' : '#ff5d7a',
      e.elite ? CFG.PARTICLE.EXPLOSION_COUNT * 1.8 : CFG.PARTICLE.EXPLOSION_COUNT,
      e.elite ? 1.3 : 1);
    this.floatTexts.push(new FloatText(
      e.x, e.y - e.r * 0.4, '+' + gained,
      e.elite ? '#ffd479' : '#ffd7e0',
      e.elite ? 19 : 15, 0.75
    ));
    this.addShake(CFG.SHAKE_ON_KILL, CFG.SHAKE_ON_KILL_MAG);
    this.maybeDrop(e);
  },

  /**
   * 结算 Boss 击破：高额分数 + 三段式爆炸 + 必掉道具。
   * @returns {void}
   */
  killBoss() {
    const b = this.boss;
    if (!b) return;

    const gained = b.score * this.multiplier;
    this.score += gained;

    // 三段式爆炸：核心闪光 + 两圈不同颜色的粒子，再加两层冲击波。
    // 关底必须有超出普通击杀的"仪式感"，否则辛苦打半天和打小怪没有区别。
    this.explode(b.x, b.y, '#ff6b8a', 60, 1.9);
    this.explode(b.x, b.y, '#ffd479', 28, 1.3);
    this.shockwaves.push(new Shockwave(b.x, b.y, 300, '#ff9db2', 0.75));
    this.shockwaves.push(new Shockwave(b.x, b.y, 190, '#ffd479', 0.5));
    this.addShake(CFG.SHAKE_ON_BOMB, CFG.SHAKE_ON_BOMB_MAG + 6);
    this.flash = 0.4;

    this.floatTexts.push(new FloatText(b.x, b.y, 'BOSS 击破 +' + gained, '#ffd479', 22, 1.6));

    // 击破奖励：直接掉 3 个道具（不参与概率判定）。
    // 高难度战斗后立刻补给，玩家才有动力继续往上打，而不是"打赢了反而更虚"。
    const keys = Object.keys(PowerUp.TYPES);
    for (let i = 0; i < 3; i++) {
      const type = keys[Math.floor(Math.random() * keys.length) % keys.length];
      this.powerups.push(new PowerUp(type, b.x + (i - 1) * 46, b.y));
    }

    this.boss = null;
    this.showBanner('B O S S  击 破', '继续前进', 1.8, '#ffd479');
  },

  /**
   * 按概率掉落道具。
   * @param {Enemy} e 被击毁的敌人
   * @returns {void}
   */
  maybeDrop(e) {
    const P = CFG.POWERUP;
    const chance = P.DROP_CHANCE + (e.elite ? P.ELITE_BONUS : 0);
    if (Math.random() >= chance) return;

    // ---- 过滤掉已经解锁的武器 ----
    // 不这么做的话，后期每次掉武器都等于"白白浪费一次道具机会"，
    // 玩家会觉得捡到的是垃圾 —— 奖励必须始终是奖励。
    const w = {};
    const keys = Object.keys(PowerUp.TYPES);
    for (let i = 0; i < keys.length; i++) {
      const k = keys[i];
      const def = PowerUp.TYPES[k];
      if (def.weapon && this.player.weapons.includes(def.weapon)) continue;
      w[k] = def.weight;
    }

    this.powerups.push(new PowerUp(weightedPick(w), e.x, e.y));
  },

  /**
   * 生效一个道具效果。
   * @param {string} type 道具类型键
   * @returns {void}
   */
  applyPowerUp(type) {
    const p = this.player;
    const P = CFG.POWERUP;
    const def = PowerUp.TYPES[type];

    if (type === 'shield') {
      // 用 max 而不是直接赋值：连续吃到两个护盾应该叠加时长，而不是互相覆盖
      p.shieldTime = Math.max(p.shieldTime, P.SHIELD_TIME);
    } else if (type === 'spread') {
      p.spreadTime = Math.max(p.spreadTime, P.SPREAD_TIME);
    } else if (type === 'rapid') {
      p.rapidTime = Math.max(p.rapidTime, P.RAPID_TIME);
    } else if (type === 'life') {
      // 生命封顶：不然一路吃到 20 条命，游戏后半段就彻底没有紧张感了
      p.lives = Math.min(CFG.PLAYER.MAX_LIVES, p.lives + 1);
    } else if (type === 'bomb') {
      this.detonateBomb();
    } else if (def.weapon) {
      // 武器解锁道具：解锁的同时自动装备（见 Player.unlockWeapon 的注释）
      p.unlockWeapon(def.weapon);
    }

    this.toast = def.toast;
    this.toastTime = 1.8;
    this.floatTexts.push(new FloatText(p.x, p.y - 40, def.toast, def.color, 16, 1.0));
    // 武器解锁给更大的冲击波，因为它是"改变玩法"级别的事件，不该和护盾同一个分量
    this.shockwaves.push(new Shockwave(p.x, p.y, def.weapon ? 150 : 90, def.color, def.weapon ? 0.55 : 0.4));
    if (def.weapon) this.addShake(0.3, 7);
  },

  /**
   * 炸弹引爆：清掉场上所有小怪与敌方子弹，Boss 只吃固定伤害。
   * @returns {void}
   */
  detonateBomb() {
    // 炸弹的定位是"翻盘"，不是"刷分"。所以清屏得分按半价结算，
    // 让主动击杀始终比炸掉更划算，避免玩家把炸弹当刷分工具。
    let gained = 0;
    let n = 0;
    for (let i = 0; i < this.enemies.length; i++) {
      const e = this.enemies[i];
      gained += Math.round(
        (e.elite ? CFG.ENEMY.SCORE_ELITE : CFG.ENEMY.SCORE_NORMAL) * 0.5
      );
      this.explode(e.x, e.y, e.elite ? '#ffb457' : '#ff5d7a', 12, 1.1);
      n++;
    }
    this.enemies.length = 0;

    // Boss 只受伤不秒杀：否则一颗道具就能跳过关底战，整个 Boss 设计就白做了
    if (this.boss && this.boss.hit(8)) this.killBoss();

    // 连带清掉敌方子弹 —— 这才是"解围"的关键，只清小怪的话弹幕还在，等于没救
    for (let i = 0; i < this.enemyBullets.length; i++) {
      this.spark(this.enemyBullets[i].x, this.enemyBullets[i].y, '#ff6b8a', 6);
    }
    this.enemyBullets.length = 0;

    const total = gained * this.multiplier;
    this.score += total;

    if (n > 0) {
      this.floatTexts.push(new FloatText(
        CFG.W / 2, CFG.H * 0.42, '清屏 +' + total, '#ff9db2', 22, 1.2
      ));
    }

    // 一整屏的冲击波 + 强震动：炸弹必须有"整个画面都被掀了一下"的量感
    this.shockwaves.push(new Shockwave(CFG.W / 2, CFG.H * 0.5, CFG.W * 0.72, '#ff9db2', 0.55));
    this.addShake(CFG.SHAKE_ON_BOMB, CFG.SHAKE_ON_BOMB_MAG);
    this.flash = 0.3;
  },

  /**
   * 记一次连击。
   * @returns {void}
   */
  addKill() {
    const before = this.comboLevel;
    this.combo++;
    this.comboTimer = CFG.COMBO.WINDOW;

    // 倍率升级的瞬间给一次明确的正反馈，玩家才会意识到"连击是有价值的"
    if (this.comboLevel > before) {
      this.floatTexts.push(new FloatText(
        this.player.x, this.player.y - 52,
        '连击 x' + this.multiplier, '#ffd479', 20, 1.2
      ));
      this.shockwaves.push(new Shockwave(
        this.player.x, this.player.y, 70, '#ffd479', 0.35
      ));
    }
  },

  /**
   * 断连。
   * @param {boolean} showTip 是否显示"连击中断"提示
   * @returns {void}
   */
  breakCombo(showTip) {
    if (this.combo === 0) return;
    const had = this.multiplier;
    this.combo = 0;
    this.comboTimer = 0;
    // 只在倍率真的高于 x1 时才提示：1 连断掉也弹字会变得很吵
    if (showTip && had > 1) {
      this.floatTexts.push(new FloatText(
        this.player.x, this.player.y - 48, '连击中断', '#ff7a90', 16, 0.9
      ));
    }
  },

  /**
   * 显示一条画面中央的横幅。
   * @param {string} title 主标题
   * @param {string} sub   副标题（可为空）
   * @param {number} time  显示时长（秒）
   * @param {string} color 主色
   * @returns {void}
   */
  showBanner(title, sub, time, color) {
    this.banner = title;
    this.bannerSub = sub || '';
    this.bannerTime = time;
    this.bannerMax = time;
    this.bannerColor = color || '#7fe8ff';
  },

  /**
   * 扣除玩家生命并触发受击反馈。
   * @returns {void}
   */
  damagePlayer() {
    const p = this.player;
    // 双保险：调用方已判断过一次，这里再挡一次。
    // 同样只挡 isProtected —— 护盾要留到下面单独处理。
    if (p.isProtected) return;

    // ---- 护盾优先破盾 ----
    // 把一次致命伤转化成"护盾碎裂"，护盾的价值就变得非常直观（挡一次），
    // 而不是一个模糊的"减伤百分之多少"。玩家能明确知道自己刚刚躲过了什么。
    if (p.shieldTime > 0) {
      p.shieldTime = 0;
      this.shockwaves.push(new Shockwave(p.x, p.y, 130, '#7fe8ff', 0.45));
      this.spark(p.x, p.y, '#7fe8ff', 22);
      this.floatTexts.push(new FloatText(p.x, p.y - 34, '护盾碎裂', '#7fe8ff', 16, 0.9));
      p.invincible = 0.9;   // 破盾后给一小段无敌，避免"盾碎的同一瞬间被第二下打死"
      this.addShake(CFG.SHAKE_ON_HIT, CFG.SHAKE_ON_HIT_MAG * 0.6);
      this.breakCombo(true);
      return;
    }

    p.lives -= 1;
    p.invincible = CFG.PLAYER.INVINCIBLE;   // 进入无敌，避免子弹时间里被连续碰撞
    this.flash = 0.35;                       // 屏幕泛红
    this.addShake(CFG.SHAKE_ON_HIT, CFG.SHAKE_ON_HIT_MAG);   // 屏幕震动
    this.spark(p.x, p.y, '#7fd8ff', 20);     // 飞船位置也喷一簇火花
    this.breakCombo(true);

    if (p.lives <= 0) this.gameOver();
  },

  /**
   * 回收所有被标记 dead 的实体。
   * 语义上"标记 + 统一回收"比"哪里检测到哪里删"更安全：
   * 检测阶段只负责打标记，回收阶段只负责删除，职责清晰，绝不会在遍历中改数组。
   * @returns {void}
   */
  cleanup() {
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      if (this.bullets[i].dead) this.bullets.splice(i, 1);
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      if (this.particles[i].dead) this.particles.splice(i, 1);
    }
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (this.enemies[i].dead) this.enemies.splice(i, 1);
    }
  },

  /* ==========================================================================
   * 特效
   * ========================================================================== */

  /**
   * 在指定位置生成一团爆炸粒子。
   * @param {number} x      爆炸中心 x
   * @param {number} y      爆炸中心 y
   * @param {string} color  主色调
   * @param {number} count  粒子数量
   * @param {number} power  速度倍率（越大炸得越开）
   * @returns {void}
   */
  explode(x, y, color, count, power) {
    const P = CFG.PARTICLE;
    // 粒子上限保护：超限就放弃这次特效。
    // 宁可少一点华丽，也不要在敌人密集时因为几千个粒子而掉帧。
    if (this.particles.length > P.MAX) return;

    const n = Math.round(count);
    for (let i = 0; i < n; i++) {
      const d = randDir();
      const sp = rand(P.SPEED_MIN, P.SPEED_MAX) * (power || 1);
      const life = rand(P.LIFE_MIN, P.LIFE_MAX);
      // 35% 的粒子用白色：全同色的爆炸会显得很单薄，
      // 掺一点高光色才有"火花"的层次感
      const c = Math.random() < 0.35 ? '#ffffff' : color;
      this.particles.push(
        new Particle(x, y, d.x * sp, d.y * sp, life, c, rand(1.5, 3.6))
      );
    }

    // 每次爆炸都配一圈冲击波，半径随当量（粒子数 / 威力）缩放。
    // 只加粒子的话画面是"碎屑散开"，加上扩张的圆环才读得出"能量释放"。
    this.shockwaves.push(new Shockwave(
      x, y, (26 + n * 1.5) * (power || 1), color, 0.42
    ));
  },

  /**
   * 小簇火花：用于命中反馈（不需要冲击波和震动的轻量粒子）。
   * @param {number} x     位置 x
   * @param {number} y     位置 y
   * @param {string} color 颜色
   * @param {number} count 粒子数
   * @returns {void}
   */
  spark(x, y, color, count) {
    if (this.particles.length > CFG.PARTICLE.MAX) return;
    for (let i = 0; i < count; i++) {
      const d = randDir();
      const sp = rand(40, 175);
      this.particles.push(new Particle(
        x, y, d.x * sp, d.y * sp, rand(0.1, 0.3), color, rand(1, 2.2)
      ));
    }
  },

  /**
   * 触发屏幕震动。
   * @param {number} time     震动持续时间（秒）
   * @param {number} magnitude 震动幅度（像素）
   * @returns {void}
   */
  addShake(time, magnitude) {
    // 取较大值而不是直接覆盖：连续受击时震动不会被削弱
    this.shakeTime = Math.max(this.shakeTime, time);
    this.shakeMag = Math.max(this.shakeMag, magnitude);
  },

  /* ==========================================================================
   * 渲染
   * ========================================================================== */

  /**
   * 绘制一帧。
   * @returns {void}
   */
  render() {
    const ctx = this.ctx;
    const p = this.player;

    ctx.save();

    // ---- 屏幕震动：整个场景（不含 HUD）随机平移 ----
    if (this.shakeTime > 0 && this.shakeMag > 0) {
      // 用 clamp 把衰减比例限在 0~1。炸弹的震动时长(0.6s)比受击(0.45s)更长，
      // 不夹紧的话比例会超过 1，反而让炸弹的震幅"越衰减越大"，很怪。
      const k = clamp(this.shakeTime / CFG.SHAKE_ON_HIT, 0, 1);
      const a = Math.random() * Math.PI * 2;          // 随机方向（比左右晃更"炸"）
      const m = this.shakeMag * k;
      ctx.translate(Math.cos(a) * m, Math.sin(a) * m);
    } else {
      this.shakeMag = 0;   // 震动结束后清零，避免残留的大幅度值被下一次复用
    }

    // ---- 背景：多画一圈（±24px），防止震动平移时露出画布底色边 ----
    const PAD = 24;
    ctx.fillStyle = '#02030a';
    ctx.fillRect(-PAD, -PAD, CFG.W + PAD * 2, CFG.H + PAD * 2);

    // 星云光晕（缓存的渐变对象）
    ctx.fillStyle = this.bgGrad;
    ctx.fillRect(-PAD, -PAD, CFG.W + PAD * 2, CFG.H + PAD * 2);

    // ---- 星云团：垫在星空下面，给深空一点颜色倾向 ----
    for (let i = 0; i < this.nebulae.length; i++) this.nebulae[i].draw(ctx);
    // ---- 星星 ----
    for (let i = 0; i < this.stars.length; i++) this.stars[i].draw(ctx);

    // ================= 辉光层开始 =================
    // 从这里到 HUD 之前，全部用 'lighter'（加法混合）绘制。
    // 为什么值得单独切模式：普通混合下亮色叠亮色只会互相覆盖，
    // 加法混合下光会真的"叠加变亮"，爆炸中心和弹幕交汇处自然过曝成白色 ——
    // 这就是"辉光感"最便宜的来源，比真的做高斯模糊快一个数量级。
    if (CFG.FX.GLOW) ctx.globalCompositeOperation = 'lighter';

    // 流星（背景光迹）
    for (let i = 0; i < this.meteors.length; i++) this.meteors[i].draw(ctx);
    // 粒子与冲击波在最底层：它们是"光"，不该盖住实体轮廓
    for (let i = 0; i < this.particles.length; i++) this.particles[i].draw(ctx);
    for (let i = 0; i < this.shockwaves.length; i++) this.shockwaves[i].draw(ctx);

    if (CFG.FX.GLOW) ctx.globalCompositeOperation = 'source-over';
    // ================= 辉光层结束 =================

    // ---- 实体绘制顺序：敌人 → Boss → 道具 → 敌弹 → 玩家子弹 → 玩家 ----
    // 越靠后越上层。玩家子弹压在所有敌人之上（不会被敌人挡住），
    // 玩家本体又在最上层（自己的位置永远要看得清）。
    for (let i = 0; i < this.enemies.length; i++)   this.enemies[i].draw(ctx);
    if (this.boss) this.boss.draw(ctx);
    for (let i = 0; i < this.powerups.length; i++)  this.powerups[i].draw(ctx);
    for (let i = 0; i < this.enemyBullets.length; i++) this.enemyBullets[i].draw(ctx);
    for (let i = 0; i < this.bullets.length; i++)   this.bullets[i].draw(ctx);

    // ---- 激光光柱：画在实体之后、飞船之前 ----
    // 顺序是有讲究的：压在敌人上面（否则会被精英敌的机体挡住，看不出在持续输出），
    // 但压在飞船下面（让机头接住光柱根部，视觉上"从枪口射出"而不是"盖在船上"）。
    // 用 this.firing 而不是 Input.shoot：AI 接管时真人这边按着空格也没用，
    // 而 AI 一直在开火 —— 光柱必须跟着真正生效的那个输入源走。
    if (this.player.usingLaser && this.firing && this.state === 'playing') {
      this.drawLaser(ctx, p);
    }

    // ready 状态下把飞船静态地展示出来（当"机体预览"），over 时已被炸毁就不再画
    if (this.state === 'ready' || this.state === 'playing' || this.state === 'paused') {
      p.draw(ctx);
    }

    // ---- 飘字：在实体之上，让得分数字不会被任何东西遮住 ----
    for (let i = 0; i < this.floatTexts.length; i++) this.floatTexts[i].draw(ctx);

    ctx.restore();   // 结束震动坐标系

    // ==========================================================================
    // 后处理（不参与震动，固定在屏幕坐标系里）
    // ==========================================================================

    // ---- 暗角：压暗四周，把注意力收拢到中央战场 ----
    ctx.fillStyle = this.vignette;
    ctx.fillRect(0, 0, CFG.W, CFG.H);

    // ---- 受击红暗角：边缘报警，中央保持可读 ----
    if (this.flash > 0) {
      const a = clamp(this.flash / 0.35, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = this.vignetteHit;
      ctx.fillRect(0, 0, CFG.W, CFG.H);
      ctx.globalAlpha = 1;
    }

    // ---- 扫描线：极轻的横向细线，给画面一点显像管的质感 ----
    // 用逐行 fillRect 而不是 createPattern：单文件游戏里不必为了这点效果
    // 额外建离屏画布，而且 200 次 1px 矩形的开销在实际运行中完全可以忽略。
    if (CFG.FX.SCANLINE > 0) {
      ctx.globalAlpha = CFG.FX.SCANLINE;
      ctx.fillStyle = '#000000';
      for (let y = 0; y < CFG.H; y += 3) ctx.fillRect(0, y, CFG.W, 1);
      ctx.globalAlpha = 1;
    }

    // ---- HUD ----
    if (this.state !== 'ready') {
      // 先铺一层顶部渐隐遮罩，避免敌人从分数栏上方穿过时糊住文字
      ctx.fillStyle = this.hudGrad;
      ctx.fillRect(0, 0, CFG.W, 78);
      this.drawHUD(ctx);
    }

    // ---- 中央横幅（升级 / Boss 预警 / 击破）----
    if (this.bannerTime > 0) this.drawBanner(ctx);
  },

  /**
   * 绘制激光光柱。
   * @param {CanvasRenderingContext2D} ctx
   * @param {Player} p 玩家飞船
   * @returns {void}
   */
  drawLaser(ctx, p) {
    const beam = p.laserBeam;
    const cx = beam.x + beam.w / 2;
    const top = beam.y;
    const bottom = beam.y + beam.h;
    const t = p.laserOn;

    ctx.save();
    // 加法混合：光线叠在暗背景上要"越叠越亮"。
    // 用普通 source-over 会把它压成一根灰白色长条，看着像贴纸而不是光。
    ctx.globalCompositeOperation = 'lighter';

    // ---- 外层光晕：宽、软、带轻微呼吸 ----
    const glowW = beam.w * 2.8 * (1 + Math.sin(t * 22) * 0.06);
    const g = ctx.createLinearGradient(cx - glowW / 2, 0, cx + glowW / 2, 0);
    g.addColorStop(0,   'rgba(120, 90, 255, 0)');
    g.addColorStop(0.5, 'rgba(180, 140, 255, 0.40)');
    g.addColorStop(1,   'rgba(120, 90, 255, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - glowW / 2, top, glowW, beam.h);

    // ---- 主干：外紫内白两层矩形 ----
    ctx.fillStyle = 'rgba(150, 110, 255, 0.85)';
    ctx.fillRect(cx - beam.w / 2, top, beam.w, beam.h);
    const coreW = Math.max(2, beam.w * 0.34);
    ctx.fillStyle = 'rgba(240, 235, 255, 0.95)';
    ctx.fillRect(cx - coreW / 2, top, coreW, beam.h);

    // ---- 能量脉冲：一串持续向上飞的光斑 ----
    // 静止的光柱在视觉上就是"一根柱子"，加上流动光斑才有"能量在往上冲"的方向感，
    // 玩家扫一眼就能确认它活着、在持续输出，而不是一个卡住的贴图。
    const seg = 46;
    const head = (t * 620) % seg;
    for (let y = bottom + seg - head; y > top; y -= seg) {
      const k = clamp((y - top) / beam.h, 0, 1);
      ctx.globalAlpha = 0.5 * (1 - k) + 0.12;   // 越靠近枪口越亮
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - coreW / 2 - 1, y - 7, coreW + 2, 14);
    }
    ctx.globalAlpha = 1;

    // ---- 枪口爆点：给光柱一个明确的"源" ----
    ctx.beginPath();
    ctx.arc(cx, bottom, 9 + Math.sin(t * 30) * 1.6, 0, TAU);
    ctx.fillStyle = 'rgba(200, 170, 255, 0.9)';
    ctx.fill();

    ctx.restore();
  },

  /**
   * 绘制画面中央的横幅。
   * @param {CanvasRenderingContext2D} ctx
   * @returns {void}
   */
  drawBanner(ctx) {
    const t = this.bannerTime / this.bannerMax;   // 1 → 0
    // 进场 15% 淡入、退场 25% 淡出，中间保持全亮。
    // 全程线性淡出会让文字在大部分时间里都半透明，读不清也显得没气势。
    let a = 1;
    if (t > 0.85) a = (1 - t) / 0.15;
    else if (t < 0.25) a = t / 0.25;
    a = clamp(a, 0, 1);

    // 轻微的缩放：1.08 → 1.0，像"推上来"而不是突然出现
    const scale = 1 + (1 - Math.min(1, (1 - t) / 0.3)) * 0.08;

    ctx.save();
    ctx.globalAlpha = a;

    // ---- 先铺底衬（必须在 translate 之前画，渐变是按绝对坐标定义的）----
    ctx.fillStyle = this.bannerGrad;
    ctx.fillRect(0, CFG.H * 0.36 - 78, CFG.W, 154);

    ctx.translate(CFG.W / 2, CFG.H * 0.36);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // ---- 主标题：先描深色边，再填充 ----
    // 描边这一步不能省：阴影只能"发光"，撑不起对比度；
    // 真正把字形从亮背景里抠出来的是那圈深色轮廓。
    ctx.font = '700 38px "Segoe UI", "Microsoft YaHei", sans-serif';
    ctx.shadowBlur = 0;
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(2, 3, 10, 0.9)';
    ctx.strokeText(this.banner, 0, 0);

    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = this.bannerColor;
    ctx.shadowBlur = 26;
    ctx.fillText(this.banner, 0, 0);

    if (this.bannerSub) {
      ctx.font = '600 15px "Segoe UI", "Microsoft YaHei", sans-serif';
      // 副标题同样先描边：它是"细字 + 彩色"，比主标题更容易被背景吃掉
      ctx.shadowBlur = 0;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(2, 3, 10, 0.92)';
      ctx.strokeText(this.bannerSub, 0, 34);

      ctx.fillStyle = this.bannerColor;
      ctx.shadowBlur = 12;
      ctx.fillText(this.bannerSub, 0, 34);
    }
    ctx.restore();
  },

  /**
   * 绘制 HUD：分数、最高分、等级、连击、道具计时、冲刺冷却、生命、Boss 血条。
   * @param {CanvasRenderingContext2D} ctx
   * @returns {void}
   */
  drawHUD(ctx) {
    const p = this.player;
    ctx.save();
    ctx.textBaseline = 'top';

    // ---- 左上：分数 + 最高分 ----
    // ⚠️ 这一行的文本格式必须保持 'SCORE ' + 6 位补零 且独立成一次 fillText：
    //    自检脚本靠 /^SCORE (\d+)$/ 正则从绘制调用里反解分数，
    //    一旦把连击倍率拼进同一个字符串，测试就会直接读不到分数。
    ctx.textAlign = 'left';
    ctx.font = '600 21px Consolas, "Courier New", monospace';
    ctx.fillStyle = '#8fe3ff';
    ctx.shadowColor = 'rgba(79,209,255,.7)';
    ctx.shadowBlur = 12;
    ctx.fillText('SCORE ' + String(this.score).padStart(6, '0'), 18, 14);
    ctx.shadowBlur = 0;

    // ---- 二倍速角标：紧跟在分数右侧 ----
    // 为什么是常驻角标而不是只在切档时弹横幅：
    // 档位是持续生效的状态，玩家在结算时看到分数明显偏高，
    // 必须有一个一直都在的线索能解释"为什么"，否则会怀疑是计分出了 bug。
    // 单独一次 fillText，不拼进上面那行 —— 自检靠 /^SCORE (\d+)$/ 反解分数。
    if (this.timeScale === CFG.SPEED.FAST) {
      ctx.font = '700 16px Consolas, "Courier New", monospace';
      ctx.fillStyle = '#ffb457';
      ctx.fillText(CFG.SPEED.TAG, 190, 18);
    }

    // ---- AI 角标：与倍速角标同一行，往右顺延 ----
    // 理由同倍速角标：AI 接管时分数会明显偏高，必须有一个一直挂着的线索
    // 能解释"为什么"，否则玩家回头看到榜上高分只会怀疑计分坏了。
    // 位置用"档位已知"的固定偏移，不用 measureText —— 精简沙箱（自检桩）
    // 里的 ctx 没有 measureText，调用它会直接抛错。
    if (AutoPilot.on) {
      ctx.font = '700 16px Consolas, "Courier New", monospace';
      ctx.fillStyle = '#b48cff';
      ctx.fillText(CFG.AI.TAG, this.timeScale === CFG.SPEED.FAST ? 226 : 190, 18);
    }

    ctx.font = '12px Consolas, "Courier New", monospace';
    ctx.fillStyle = '#6f9dc0';
    ctx.fillText('BEST  ' + String(this.best).padStart(6, '0'), 18, 42);

    // ---- 连击条：只有 combo > 0 才出现 ----
    // 倍率用颜色区分（x1 灰 → x5 金），玩家扫一眼就知道自己现在值多少分。
    if (this.combo > 0) {
      const cw = 122, ch = 5, cx = 18, cy = 62;
      const ratio = clamp(this.comboTimer / CFG.COMBO.WINDOW, 0, 1);
      const lv = this.comboLevel;
      const colors = ['#7fa7c9', '#7fe8ff', '#ffb457', '#ff9db2', '#ffd479'];
      const c = colors[lv];

      ctx.font = '700 14px Consolas, "Courier New", monospace';
      ctx.fillStyle = c;
      ctx.fillText(this.combo + ' HIT', cx, cy - 3);

      ctx.font = '700 14px Consolas, "Courier New", monospace';
      ctx.fillStyle = c;
      ctx.fillText('x' + this.multiplier, cx + 74, cy - 3);

      // 断连倒计时条：把"还剩多久"做成可见的，玩家才会主动去续连
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(cx, cy + 17, cw, ch);
      ctx.fillStyle = c;
      ctx.fillRect(cx, cy + 17, cw * ratio, ch);
    }

    // ---- 左上偏下：生效中的道具计时 ----
    let py = 96;
    const timers = [
      [p.shieldTime, CFG.POWERUP.SHIELD_TIME, '#7fe8ff', 'SHIELD'],
      [p.spreadTime, CFG.POWERUP.SPREAD_TIME, '#ffb457', 'SPREAD'],
      [p.rapidTime,  CFG.POWERUP.RAPID_TIME,  '#b48cff', 'RAPID']
    ];
    for (let i = 0; i < timers.length; i++) {
      const [left, full, color, name] = timers[i];
      if (left <= 0) continue;
      ctx.font = '600 11px Consolas, "Courier New", monospace';
      ctx.fillStyle = color;
      ctx.fillText(name + ' ' + left.toFixed(1) + 's', 18, py);
      // 剩余比例条：比纯数字更快读懂
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(18, py + 14, 96, 3);
      ctx.fillStyle = color;
      ctx.fillRect(18, py + 14, 96 * clamp(left / full, 0, 1), 3);
      py += 24;
    }

    // ---- 右上：等级 ----
    ctx.textAlign = 'right';
    ctx.font = '600 15px Consolas, "Courier New", monospace';
    ctx.fillStyle = '#ffd479';
    ctx.fillText('LEVEL ' + this.level, CFG.W - 18, 16);

    // ---- 右上：生命图标（小飞船）----
    for (let i = 0; i < p.lives; i++) {
      const x = CFG.W - 26 - i * 24;
      const y = 50;
      ctx.beginPath();
      ctx.moveTo(x, y - 9);
      ctx.lineTo(x + 7, y + 7);
      ctx.lineTo(x, y + 3);
      ctx.lineTo(x - 7, y + 7);
      ctx.closePath();
      ctx.fillStyle = '#7fe8ff';
      ctx.fill();
    }

    // ---- 右下：冲刺冷却指示 ----
    // 冲刺是保命技，玩家必须随时知道它能不能用，否则等于没有这个功能。
    // bottomPad：触屏模式下把底部 HUD 整体上抬，给屏幕按钮让位
    const bottomPad = this.touchMode ? (this.hudBottomPad || 0) : 0;
    const ready = p.dashCd <= 0 && !p.isDashing;
    ctx.textAlign = 'right';
    ctx.font = '600 11px Consolas, "Courier New", monospace';
    ctx.fillStyle = ready ? '#8dffb0' : '#55799a';
    ctx.fillText(ready ? 'DASH ●READY' : 'DASH ' + Math.max(0, p.dashCd).toFixed(1) + 's',
                 CFG.W - 18, CFG.H - 26 - bottomPad);

    // ---- 左下：当前武器 + 已解锁槽位 ----
    // 武器是"改变输出方式"的状态，必须常驻可见：
    // 玩家切到激光后忘了自己拿的是激光、还在等子弹打出去，是最容易发生的困惑。
    const ORDER = ['pulse', 'twin', 'laser'];
    const WDEF = CFG.WEAPON[p.weapon.toUpperCase()];
    ctx.textAlign = 'left';
    ctx.font = '600 11px Consolas, "Courier New", monospace';
    ctx.fillStyle = '#d9c6ff';
    ctx.fillText('WEAPON ' + WDEF.name, 18, CFG.H - 26 - bottomPad);

    // 三个小方块表示"已解锁/当前选中"：不看说明也能立刻明白还有几把枪没拿到
    for (let i = 0; i < ORDER.length; i++) {
      const k = ORDER[i];
      const owned = p.weapons.includes(k);
      const x = 18 + i * 13;
      const y = CFG.H - 11 - bottomPad;
      ctx.fillStyle = owned ? (p.weapon === k ? '#ffffff' : '#b48cff') : 'rgba(255,255,255,0.13)';
      ctx.fillRect(x, y, 9, 4);
    }

    // ---- 底部中央：拾取提示 ----
    if (this.toastTime > 0) {
      ctx.textAlign = 'center';
      ctx.font = '600 13px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.globalAlpha = clamp(this.toastTime / 0.5, 0, 1);
      ctx.fillStyle = '#bcd7ee';
      ctx.fillText('拾取 ' + this.toast, CFG.W / 2, CFG.H - 30);
      ctx.globalAlpha = 1;
    }

    // ---- 顶部中央：Boss 血条 ----
    if (this.boss) {
      const bw = 380, bh = 11;
      const bx = (CFG.W - bw) / 2;
      const by = 24;
      const ratio = clamp(this.boss.hp / this.boss.maxHp, 0, 1);

      ctx.textAlign = 'center';
      ctx.font = '700 12px Consolas, "Courier New", monospace';
      ctx.fillStyle = '#ff9db2';
      ctx.fillText('B O S S   ' + this.bossIndex, CFG.W / 2, by - 16);

      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
      ctx.fillStyle = ratio > 0.5 ? '#ff6b8a' : (ratio > 0.22 ? '#ffb457' : '#ff3b5c');
      ctx.fillRect(bx, by, bw * ratio, bh);
      // 分段刻度：让玩家能数出"还剩几刀"，而不是看一根模糊的滑条
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      for (let i = 1; i < 10; i++) ctx.fillRect(bx + (bw / 10) * i, by, 1, bh);
    }

    // ---- Boss 预警：红色闪烁边框 ----
    if (this.bossWarn > 0) {
      const a = Math.abs(Math.sin(this.bossWarn * 12)) * 0.85;
      ctx.globalAlpha = a;
      ctx.strokeStyle = '#ff3b5c';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, CFG.W - 6, CFG.H - 6);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  },

  /* ==========================================================================
   * 状态机
   * ========================================================================== */

  /**
   * 切换游戏状态并同步覆盖层界面。
   * @param {'ready'|'playing'|'paused'|'over'} state 目标状态
   * @returns {void}
   */
  setState(state) {
    this.state = state;
    this.renderOverlay();
  },

  /**
   * 开始新一局（也会在结束后重开时被调用）。
   * @returns {void}
   */
  start() {
    this.reset();
    this.setState('playing');
    // 清空按键状态：点击按钮后鼠标/键盘可能还有残留按下状态，
    // 不清掉会出现"刚开局飞船自己就往一个方向飘"的现象
    Input.clear();
  },

  /** 从暂停恢复。参数：无。返回：无。 */
  resume() {
    this.setState('playing');
    Input.clear();
  },

  /** 在 进行中 ⇄ 暂停 之间切换。参数：无。返回：无。 */
  togglePause() {
    if (this.state === 'playing') this.setState('paused');
    else if (this.state === 'paused') this.resume();
  },

  /**
   * 游戏结束：结算分数并显示结束界面。
   * @returns {void}
   */
  gameOver() {
    this.player.lives = 0;

    // 飞船殉爆：大团粒子 + 冲击波 + 一次重震动
    this.explode(this.player.x, this.player.y, '#7fd8ff', 46, 1.7);
    this.explode(this.player.x, this.player.y, '#ffd479', 20, 1.1);
    this.shockwaves.push(new Shockwave(this.player.x, this.player.y, 260, '#7fd8ff', 0.7));
    this.addShake(CFG.SHAKE_ON_BOMB, CFG.SHAKE_ON_BOMB_MAG);
    this.flash = 0.45;
    this.bossWarn = 0;

    // 清掉滞留的敌方子弹：结束界面下它们已经冻结，
    // 留着会让画面在"任务失败"四个字后面挂着一屏弹幕，很脏。
    this.enemyBullets.length = 0;

    // 结算最高分并持久化
    if (this.score > this.best) this.best = this.score;
    this.recordScore();

    this.setState('over');
  },

  /**
   * 复位全部局内数据。
   * @returns {void}
   */
  reset() {
    this.score = 0;
    this.elapsed = 0;
    this.realElapsed = 0;
    this.level = 1;

    // ⚠️ 这里刻意不重置 timeScale。
    // 二倍速是"难度档位"而不是"本局状态"，重开一局后保持玩家选定的档位；
    // 每局都要重新按一次 F 只会让人烦。想回常速随时按一下即可。

    // 用 length = 0 清空数组而不是重新赋值：保持数组引用不变，
    // 万一有其他代码持有引用也不会指向一个"废弃的旧数组"
    this.bullets.length = 0;
    this.enemies.length = 0;
    this.particles.length = 0;
    this.meteors.length = 0;
    this.shockwaves.length = 0;
    this.floatTexts.length = 0;
    this.powerups.length = 0;
    this.enemyBullets.length = 0;

    // ---- 连击与 Boss 状态 ----
    this.combo = 0;
    this.comboTimer = 0;
    this.boss = null;
    this.bossIndex = 0;
    this.bossWarn = 0;

    // ---- 横幅 ----
    // 重置时要一并清掉横幅和提示，否则上一局的"BOSS 击破"会带进新一局的开场
    this.banner = '';
    this.bannerSub = '';
    this.bannerTime = 0;
    this.toast = '';
    this.toastTime = 0;

    // 开局给约 1 秒的缓冲，让玩家有反应时间，不至于一进来就被糊脸
    this.spawnTimer = 1.0;

    this.shakeTime = 0;
    this.shakeMag = 0;
    this.flash = 0;
    this.laserSparkTimer = 0;
    // 名次高亮只在"刚打完的那一局"有意义，重开时必须清掉，
    // 否则上一局的高亮会跟着带进新一局的开场界面
    this.lastRank = 0;

    this.player.reset();
    // AI 状态也要清（接管时长、换枪滞后计数、待执行的冲刺请求）。
    // 注意它**不**改变开关本身：AI 是一个档位，换一局不该把它关掉。
    AutoPilot.reset();
  },

  /* ==========================================================================
   * 一次性按键（开始 / 暂停 / 重开）
   * ========================================================================== */

  /**
   * 处理"按下的瞬间"触发的动作（不含长按重复）。
   * @param {string} k 已转为小写的键名
   * @returns {void}
   */
  handleOneShotKey(k) {
    // I：开关 AI 自动模式。
    // 放在最前面且不做状态限制 —— 它是档位开关（不是一次性动作），
    // 在开始界面先设好"这局让 AI 打"再开局是正常用法，与 F 二倍速同一套考虑。
    if (k === CFG.AI.KEY) {
      AutoPilot.toggle(this);
      return;
    }

    // 其余"操作类"按键都是明确的"我要自己玩"信号 → 先交还控制权，再执行动作。
    // 为什么不并进 AutoPilot._manualInput()：那里只能看见"按键当前的状态"，
    // 而这类键是"一次性意图"，按完就抬起来了，状态法抓不到。
    // 刻意**不**包含空格/回车：它们在菜单上是"开始/重开"，把它当成夺权信号会导致
    // "AI 打完一局 → 你按空格再来一局 → AI 却悄悄退出了"。真人对局中按住空格
    // （开火）已经会通过状态检测夺回控制权，不缺这一条路径。
    if (AutoPilot.on && (k === 'shift' || k === 'q' || k === 'tab' ||
                         k === '1' || k === '2' || k === '3')) {
      // 走 'toggle' 而不是 'manual'：玩家马上就会看到这个动作的结果，
      // 再弹一条"已交还操作"只会和动作本身的反馈抢注意力。
      AutoPilot.disengage(this, 'toggle');
    }

    // R：任何非初始状态下都能重开
    if (k === 'r') {
      if (this.state !== 'ready') this.start();
      return;
    }

    // P / Esc：进行中 ⇄ 暂停（顺带支持 Esc 关闭暂停，符合直觉）
    if (k === 'p' || k === 'escape') {
      this.togglePause();
      return;
    }

    // Shift：冲刺。
    // 只在游戏进行中响应 —— 在菜单/结束界面按 Shift 不该有任何副作用，
    // 而且 dash() 内部会读 Input 的方向键来决定冲哪边。
    if (k === 'shift') {
      if (this.state === 'playing' && this.player.dash(Input)) this.onDash();
      return;
    }

    // F：切换二倍速（Fast）。
    // 刻意不做状态限制 —— 它是档位开关而不是一次性动作，
    // 在开始界面先设好"这局我要打二倍速"再开局是正常用法。
    if (k === 'f') {
      this.toggleSpeed();
      return;
    }

    // Q / Tab：循环切换已解锁武器。
    // 用"循环"而不是"三选一"，是因为手机上只有一个换枪按钮，
    // 键盘和触摸必须共用同一套逻辑，否则两边的手感会不一致。
    if (k === 'q' || k === 'tab') {
      if (this.state === 'playing') this.switchWeapon(null);
      return;
    }

    // 1 / 2 / 3：直接指定武器（键盘玩家的快捷方式）
    if (k === '1' || k === '2' || k === '3') {
      if (this.state === 'playing') {
        this.switchWeapon(['pulse', 'twin', 'laser'][Number(k) - 1]);
      }
      return;
    }

    // 空格 / 回车：菜单确认键
    if (k === ' ' || k === 'enter') {
      if (this.state === 'ready' || this.state === 'over') {
        this.start();
      } else if (this.state === 'paused') {
        this.resume();
      }
    }
  },

  /**
   * 冲刺触发瞬间的视觉反馈。
   * @returns {void}
   */
  onDash() {
    const p = this.player;
    // 起点留一圈火花 + 一个小冲击波，玩家才能明确看到"我是从这里冲出去的"，
    // 否则高速度下位移太快，反而分不清自己有没有真的冲成功。
    this.spark(p.x, p.y, '#7fe8ff', 14);
    this.shockwaves.push(new Shockwave(p.x, p.y, 56, '#7fe8ff', 0.28));
  },

  /**
   * 切换二倍速档位（键盘 F 与屏幕按钮共用这一条路径）。
   * 不做状态限制：档位开关在菜单里预设好再开局是完全合理的用法。
   * @returns {number} 切换后的档位（1 或 2）
   */
  toggleSpeed() {
    const S = CFG.SPEED;
    this.timeScale = (this.timeScale === S.FAST) ? S.NORMAL : S.FAST;

    // 切档时给一次横幅反馈。为什么不能只靠 HUD 角标：
    // 角标是常驻的静态信息，玩家按下 F 之后如果没有"刚发生了什么"的即时确认，
    // 很容易怀疑自己到底按上没有，然后反复去按。
    // 提示只在进行中弹 —— 菜单界面上那个位置被覆盖层压着，弹了也看不见。
    if (this.state === 'playing') {
      this.showBanner('SPEED ' + S.TAG,
                      this.timeScale === S.FAST ? '二倍速 · 反应窗口减半' : '恢复常速',
                      1.1,
                      this.timeScale === S.FAST ? '#ffb457' : '#7fe8ff');
    }
    return this.timeScale;
  },

  /**
   * 切换武器（键盘 Q/1/2/3 与屏幕按钮共用这一条路径）。
   * @param {string|null} name 目标武器名；传 null 表示按顺序循环到下一把
   * @returns {void}
   */
  switchWeapon(name) {
    const p = this.player;
    const W = CFG.WEAPON;

    // 还没解锁任何第二把武器时，按键不该有任何响应 ——
    // 连按 Q 弹一堆"没有别的枪"的提示只会显得吵
    if (p.weapons.length <= 1) return;

    const before = p.weapon;
    if (name) p.switchWeapon(name);
    else p.cycleWeapon();
    if (p.weapon === before) return;   // 没真的换成就别播反馈

    const def = W[p.weapon.toUpperCase()];
    this.toast = def.name;
    this.toastTime = 1.2;
    this.floatTexts.push(new FloatText(
      p.x, p.y - 40, def.name, '#d9c6ff', 15, 0.7
    ));
    this.shockwaves.push(new Shockwave(p.x, p.y, 52, '#b48cff', 0.3));
  },

  /* ==========================================================================
   * 覆盖层 UI 与最高分持久化
   * ========================================================================== */

  /**
   * 根据当前状态刷新覆盖层文案与按钮。
   * @returns {void}
   */
  renderOverlay() {
    const ov = this.overlay;

    // 进行中：隐藏覆盖层（同时会通过 CSS 的 pointer-events 取消命中）
    if (this.state === 'playing') {
      ov.classList.add('hidden');
      return;
    }
    ov.classList.remove('hidden');

    if (this.state === 'ready') {
      this.ovTitle.textContent = '星 际 防 线';
      this.ovSub.textContent = '守住底部防线，击落一切来犯之敌';
      // 开始界面把"这局能玩到什么"提前摊开：
      // 连击、道具、武器、Boss 是这局的核心玩法，玩家不看说明也得能注意到
      this.ovStats.innerHTML = this.best > 0
        ? '历史最高分 <b>' + this.best + '</b><br>' +
          '<span style="font-size:.92em;opacity:.85">连击累积倍率（最高 x5）· 击落掉道具 · 3 种武器可切换 · 每 5 级 BOSS 战<br>' +
          '按 <b>I</b> 交给 AI 自动打（任意操作即可夺回）</span>'
        : '连续击杀累积倍率 · 击落敌机掉落道具 · 每 5 级 BOSS 战<br>' +
          '按 <b>I</b> 交给 AI 自动打（任意操作即可夺回）';
      this.ovBtn.textContent = '开始游戏';

    } else if (this.state === 'paused') {
      this.ovTitle.textContent = '已 暂 停';
      this.ovSub.textContent = '按 P / Esc，或点击按钮继续';
      this.ovStats.innerHTML =
        '当前得分 <b>' + this.score + '</b> · 到达 <b>Lv.' + this.level + '</b>' +
        (this.combo > 0 ? ' · 连击 <b>' + this.combo + '</b> (x' + this.multiplier + ')' : '');
      this.ovBtn.textContent = '继续游戏';

    } else {   // over
      this.ovTitle.textContent = '任 务 失 败';
      this.ovSub.textContent = '飞船已被摧毁';
      // 把结算数据一次摆出来，玩家能立刻知道这局表现如何。
      // 连击、武器、Boss 都是新增的目标维度，所以也放进结算里 ——
      // 只报总分的话，玩家没有动力去追"不断连"和"打通 Boss"。
      this.ovStats.innerHTML =
        '本局得分 <b>' + this.score + '</b> · 存活 <b>' + this.realElapsed.toFixed(1) + 's</b>' +
        ' · 到达 <b>Lv.' + this.level + '</b>' +
        (this.bossIndex > 0 ? ' · 击破 BOSS <b>' + this.bossIndex + '</b>' : '') +
        // 加速局必须在结算里点明：分数偏高、等级偏高、存活时间却没变长，
        // 不解释一句的话，玩家第一反应会是"计分是不是坏了"
        (this.timeScale === CFG.SPEED.FAST
          ? ' · <b style="color:#ffb457">二倍速 ' + CFG.SPEED.TAG + '</b>'
          : '') +
        // AI 接管局同样要说明：尤其是"AI 打到 Lv.40 才死"这种成绩，
        // 不标出来的话玩家会拿它去衡量自己，而这两件事根本不可比
        (AutoPilot.on
          ? ' · <b style="color:#b48cff">AI 接管 ' + CFG.AI.TAG + '</b>'
          : '') +
        '<br>' +
        // 进了榜就明确报出名次：这是排行榜最核心的反馈，不说出来等于没做
        (this.lastRank > 0
          ? '本局排名 <b>第 ' + this.lastRank + ' 名</b> · 历史最高 <b>' + this.best + '</b>'
          : '历史最高 <b>' + this.best + '</b>');
      this.ovBtn.textContent = '再来一局（R）';
    }

    // 排行榜在三个状态下都要刷新：ready 看目标、over 看新名次、paused 顺手看一眼
    this.renderBoard();
  },

  /**
   * 读取本地存档（最高分 + Top 5 排行榜）。
   * @returns {void}
   */
  loadBest() {
    const K = CFG.BOARD;
    let best = 0;
    let list = [];

    // file:// 协议或隐私模式下 localStorage 可能直接抛异常，
    // 用 try/catch 静默降级，绝不能因为读不了存档就把游戏搞崩
    try {
      const raw = window.localStorage.getItem(K.KEY_SCORES);
      const arr = raw ? JSON.parse(raw) : null;
      if (Array.isArray(arr)) list = this.sanitizeScores(arr);

      const v = parseInt(window.localStorage.getItem(K.KEY_BEST) || '0', 10);
      if (isFinite(v) && v > 0) best = v;
    } catch (err) {
      list = [];
      best = 0;
    }

    // ---- 旧存档迁移 ----
    // v1.1 及以前只存了一个数字（最高分）。第一次读到新格式时，把它当成
    // "一条没有细节的历史记录"塞进榜单 —— 否则老玩家一更新就会发现
    // 排行榜是空的，看起来像记录被清掉了。
    if (list.length === 0 && best > 0) {
      list = [{ score: best, level: 0, elapsed: 0, ts: 0, sp: CFG.SPEED.NORMAL, ai: 0 }];
    }

    this.scores = list;
    this.best = list.length > 0 ? Math.max(best, list[0].score) : best;
    this.lastRank = 0;
  },

  /**
   * 清洗排行榜数据。
   * @param {Array} arr 从 localStorage 读到的原始数组
   * @returns {Array<{score:number,level:number,elapsed:number,ts:number,sp:number}>}
   * 为什么必须清洗：localStorage 里的内容是玩家随手就能改的，也可能被旧版本
   * 写坏。少这一步的话，一条 score 为字符串或 NaN 的记录会让排序退化成
   * 随机顺序，NaN 还会一路污染到 HUD 的 padStart，最后显示成 "NaN"。
   */
  sanitizeScores(arr) {
    const out = [];
    for (let i = 0; i < arr.length; i++) {
      const e = arr[i];
      if (!e || typeof e !== 'object') continue;

      const score = Math.floor(Number(e.score));
      if (!isFinite(score) || score <= 0) continue;

      const level = Math.floor(Number(e.level));
      const elapsed = Number(e.elapsed);
      const ts = Number(e.ts);
      // 倍速档位只认"恰好等于 FAST"，其余一律归为常速。
      // 不能写 (e.sp || 1)：改过存档的人塞个 999 进来，榜单上就会多出一个
      // 无法解释的"×999"，而清洗环节的价值恰恰在于不信任存档内容。
      const sp = Number(e.sp) === CFG.SPEED.FAST ? CFG.SPEED.FAST : CFG.SPEED.NORMAL;
      // AI 标记同理：只认"恰好等于 1"，其余（含缺失、字符串、被改成 999）一律算真人局。
      // 不能写 `e.ai ? 1 : 0` —— 那样连 "false"/"0" 这种字符串都会被判成 AI 局。
      const ai = Number(e.ai) === 1 ? 1 : 0;
      out.push({
        score: score,
        level: (isFinite(level) && level > 0) ? level : 0,
        elapsed: (isFinite(elapsed) && elapsed > 0) ? elapsed : 0,
        ts: (isFinite(ts) && ts > 0) ? ts : 0,
        sp: sp,
        ai: ai
      });
    }
    out.sort((a, b) => b.score - a.score);
    return out.slice(0, CFG.BOARD.KEEP);
  },

  /**
   * 记录本局成绩到排行榜。
   * @returns {number} 本局名次（1 起）；没进榜返回 0
   */
  recordScore() {
    const entry = {
      score: this.score,
      level: this.level,
      // 存真实存活秒数（不是吃缩放 dt 的 elapsed），这样榜单上的时长
      // 在普通局和加速局之间仍然是同一个单位，可以直接横向比较。
      elapsed: Math.round(this.realElapsed * 10) / 10,
      ts: Date.now(),
      // 记录本局的倍速档位：榜单允许两种档位混排，但必须能一眼分辨，
      // 否则"×2 打出来的分"和"常速打出来的分"混在一起，这张榜就失去可比性。
      sp: this.timeScale === CFG.SPEED.FAST ? CFG.SPEED.FAST : CFG.SPEED.NORMAL,
      // AI 标记：接管局的成绩照样记，但必须标出来 ——
      // 一个"完美走位"的 AI 挂在榜上而没有任何说明，这张榜对真人就失去意义了。
      // 存档里存 1/0 而不是 true/false，与 sp 的存法保持一致，
      // 清洗时统一用"只认恰好等于 1"的严格判定。
      ai: AutoPilot.on ? 1 : 0
    };

    this.scores.push(entry);
    this.scores.sort((a, b) => b.score - a.score);
    if (this.scores.length > CFG.BOARD.KEEP) this.scores.length = CFG.BOARD.KEEP;

    // 名次用"对象引用"反查，而不是拿分数去比。
    // 两局同分时按分数比较永远只会命中第一条，玩家会看到错误的名次；
    // 被截断掉的成绩 indexOf 返回 -1，正好等价于"没进榜"。
    this.lastRank = this.scores.indexOf(entry) + 1;

    this.saveBest();
    return this.lastRank;
  },

  /** 写入本地存档（最高分 + 排行榜）。参数：无。返回：无。 */
  saveBest() {
    const K = CFG.BOARD;
    try {
      window.localStorage.setItem(K.KEY_BEST, String(this.best));
      window.localStorage.setItem(K.KEY_SCORES, JSON.stringify(this.scores));
    } catch (err) {
      /* 存不了就算了，不影响本局游戏 */
    }
  },

  /**
   * 把排行榜渲染到覆盖层。
   * @returns {void}
   */
  renderBoard() {
    const el = this.ovBoard;
    if (!el) return;

    const list = this.scores;
    if (!list || list.length === 0) {
      // 一条记录都没有时整块收起：留一个空框比不显示更难看
      el.classList.remove('show');
      el.innerHTML = '';
      return;
    }

    let html = '<div class="bhead">本 地 排 行 榜 · TOP ' + CFG.BOARD.KEEP + '</div>';
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      // 只有刚打完的那一局会被高亮，玩家一眼就能在榜上找到自己
      const now = (this.state === 'over' && (i + 1) === this.lastRank) ? ' now' : '';
      // 迁移进来的旧记录没有等级/时长信息，如实写"历史记录"而不是编一个 Lv.1
      const meta = e.level > 0
        ? 'Lv.' + e.level + ' · ' + e.elapsed.toFixed(1) + 's'
        : '历史记录';
      // 倍速标记紧贴在分数后面（放进 .sc 单元格里，而不是另起一列）：
      // .sc 是 flex:1 会把右侧撑开，标记若单独成列就会飘到离分数很远的地方，
      // 读起来不再像"这个分数"的注脚。
      const spTag = e.sp === CFG.SPEED.FAST
        ? '<span class="sp">' + CFG.SPEED.TAG + '</span>'
        : '';
      const aiTag = e.ai === 1
        ? '<span class="ai">' + CFG.AI.TAG + '</span>'
        : '';
      html += '<div class="brow' + now + '">' +
                '<span class="rk">' + (i + 1) + '</span>' +
                '<span class="sc">' + e.score + spTag + aiTag + '</span>' +
                '<span class="meta">' + meta + '</span>' +
              '</div>';
    }
    el.innerHTML = html;
    el.classList.add('show');
  },

  /* ==========================================================================
   * 触屏辅助 UI
   * ========================================================================== */

  /**
   * 初始化触屏按钮（只需一次）。
   * @returns {void}
   */
  initTouchUI() {
    // ---- 判定初始是否处于触屏模式 ----
    // 只看 pointer: coarse（"主输入设备是手指"）这一个信号。
    // 刻意不用 navigator.maxTouchPoints / 'ontouchstart' in window：
    // 带触摸屏的笔记本、以及 Chrome 开了 --touch-events 时，这两个都会报"有触摸"，
    // 于是桌面玩家会莫名其妙多出两个挡住画面的按钮 —— 而鼠标用户根本不需要它们。
    // 真正的兜底是下面那个"第一次收到真实触摸事件"的监听，那个信号才没有歧义。
    const hasMM = typeof window !== 'undefined' &&
                  typeof window.matchMedia === 'function' &&
                  window.matchMedia('(pointer: coarse)').matches;
    this.touchMode = !!hasMM;
    if (this.touchMode && this.wrap) this.wrap.classList.add('touch-mode');

    // 兜底：第一次真的收到触摸事件时，无条件再开一次。
    if (typeof window.addEventListener === 'function') {
      window.addEventListener('pointerdown', (ev) => {
        if (ev.pointerType !== 'touch' || this.touchMode) return;
        this.touchMode = true;
        if (this.wrap) this.wrap.classList.add('touch-mode');
        this.measureTouchPad();
      }, { passive: true });

      // 屏幕尺寸/方向变化后按钮的物理尺寸不变，但它占的逻辑高度会变
      // （画布缩放比例变了），所以要重新量一次。
      window.addEventListener('resize', () => this.measureTouchPad(), { passive: true });
      window.addEventListener('orientationchange', () => this.measureTouchPad(), { passive: true });
    }

    this.measureTouchPad();

    // ---- 冲刺按钮 ----
    // 只在游戏中生效：结束界面上按到按钮不该产生任何副作用。
    // 用 pointerdown 而不是 click：click 要等手指抬起（有 100ms 量级的延迟），
    // 保命技晚 100ms 就等于无效。
    if (this.touchDash) {
      this.touchDash.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        this.touchDash.blur();
        // AI 接管期间点冲刺 = 明确的"我要自己操作" → 先交还控制权再执行。
        // 若只是静默忽略，玩家会以为按钮坏了。
        if (AutoPilot.on) AutoPilot.disengage(this, 'toggle');
        if (this.state === 'playing') Input.requestDash();
      }, { passive: false });
    }

    // ---- 换枪按钮 ----
    if (this.touchWeapon) {
      this.touchWeapon.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        this.touchWeapon.blur();
        if (AutoPilot.on) AutoPilot.disengage(this, 'toggle');
        if (this.state === 'playing') this.switchWeapon(null);
      }, { passive: false });
    }

    // ---- 倍速按钮 ----
    // 与换枪/冲刺不同，这里不限制 state：档位开关在开始/结算界面上也能按，
    // 玩家可以先设好档位再开局。这样键盘 F 和屏幕按钮的行为完全一致。
    if (this.touchSpeed) {
      this.touchSpeed.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        this.touchSpeed.blur();
        this.toggleSpeed();
      }, { passive: false });
    }

    // ---- AI 自动模式按钮 ----
    // 与倍速按钮同一套：不限制 state，菜单上也能先开好再开局。
    // 这是按 I 键的等价入口 —— 手机上没法按 I。
    if (this.touchAi) {
      this.touchAi.addEventListener('pointerdown', (ev) => {
        ev.preventDefault();
        this.touchAi.blur();
        AutoPilot.toggle(this);
      }, { passive: false });
    }
  },

  /**
   * 测量屏幕按钮占用的"逻辑高度"，用于让底部 HUD 让位。
   * @returns {void}
   * 只在初始化与 resize 时算，绝不在每帧算：每帧读 getBoundingClientRect()
   * 会强制浏览器做同步重排（layout thrashing），在手机上足够吃掉十几帧。
   *
   * ⚠️ 必须取"所有按钮里最高的那条顶边"，而不是只量某单颗按钮的高度。
   *    这个坑是实拍截图里看出来的：倍速按钮一度叠在换枪按钮正上方，
   *    而这里只量了冲刺按钮 —— 于是算出的让位高度不够，
   *    倍速按钮正好压在左下角的 WEAPON 那一行字上（字被盖住，还不报任何错）。
   *    改成"取整摞按钮的最高顶边"之后，以后无论怎么加按钮、怎么叠，
   *    让位高度都会自动跟上，不必再回头改这个公式。
   */
  measureTouchPad() {
    if (!this.canvas) return;
    // 精简沙箱（无布局引擎）里 canvas 没有 getBoundingClientRect，
    // 量不出来就保持 0，HUD 位置退回默认值即可 —— 这不是错误路径。
    if (typeof this.canvas.getBoundingClientRect !== 'function') return;
    const cr = this.canvas.getBoundingClientRect();
    if (!cr || cr.height <= 0) return;

    // 画布底边。用 top + height 而不是 cr.bottom：
    // 精简环境（自检桩）只给 top/height，读 bottom 会得到 undefined → NaN。
    const canvasBottom = cr.top + cr.height;
    const btns = [this.touchWeapon, this.touchSpeed, this.touchAi, this.touchDash];

    let need = 0;   // 按钮从画布底边往上顶起的高度（CSS 像素）
    for (let i = 0; i < btns.length; i++) {
      const el = btns[i];
      if (!el || typeof el.getBoundingClientRect !== 'function') continue;
      const r = el.getBoundingClientRect();
      if (!(r.width > 0 && r.height > 0)) continue;
      const up = canvasBottom - r.top;
      if (up > need) need = up;
    }
    if (!(need > 0)) return;

    // +20 = 呼吸空间，避免 HUD 文字紧贴按钮。
    // 注意 need 里已经含了按钮自身的下边距（bottom: 14px），不要再加一遍 ——
    // 单排按钮时 need = 14 + 62 = 76，加 20 得 96，与改造前的取值完全一致。
    this.hudBottomPad = Math.round((need + 20) / cr.height * CFG.H);
  },

  /**
   * 同步触屏按钮的外观（冲刺冷却）。
   * @returns {void}
   */
  syncTouchUI() {
    if (!this.touchMode || !this.touchDash) return;
    const p = this.player;

    const ready = p.dashCd <= 0 && !p.isDashing;
    // 只在"状态真的变了"时才写 DOM。每帧无条件写 classList / textContent 会
    // 触发样式重算和重排，在手机上这 60 次/秒的开销足够吃掉好几帧。
    if (ready !== this._dashReady) {
      this._dashReady = ready;
      this.touchDash.classList.toggle('cooling', !ready);
    }
    const label = ready ? '冲刺' : Math.max(0, p.dashCd).toFixed(1);
    if (label !== this._dashLabel) {
      this._dashLabel = label;
      this.touchDashText.textContent = label;
    }

    // 换枪按钮上直接写着当前武器名：手机上没地方看 HUD 左下角的小字，
    // 按钮本身就是最好的状态显示位。
    const wname = CFG.WEAPON[p.weapon.toUpperCase()].name;
    if (wname !== this._weaponLabel && this.touchWeaponText) {
      this._weaponLabel = wname;
      this.touchWeaponText.textContent = wname;
      // 只有一把枪时按钮变暗，玩家一眼知道"现在按了也没用"
      this.touchWeapon.classList.toggle('dim', p.weapons.length <= 1);
    }

    // 倍速按钮同理：档位是常驻状态，按钮上直接写着当前是几倍，
    // 玩家不必去盯右上角的小角标。同样只在变化时写 DOM。
    const fast = this.timeScale === CFG.SPEED.FAST;
    const slabel = fast ? CFG.SPEED.TAG : '1×';
    if (slabel !== this._speedLabel && this.touchSpeedText) {
      this._speedLabel = slabel;
      this.touchSpeedText.textContent = slabel;
    }
    if (fast !== this._speedOn && this.touchSpeed) {
      this._speedOn = fast;
      this.touchSpeed.classList.toggle('on', fast);
    }

    // AI 按钮显示"接管中/待机"两态。手机上玩家看不到 HUD 里那个紫色角标
    // （字很小），按钮的点亮状态才是他判断"现在到底谁在操作"的主要依据。
    const aiLabel = AutoPilot.on ? 'ON' : 'AI';
    if (aiLabel !== this._aiLabel && this.touchAiText) {
      this._aiLabel = aiLabel;
      this.touchAiText.textContent = aiLabel;
    }
    if (AutoPilot.on !== this._aiOn && this.touchAi) {
      this._aiOn = AutoPilot.on;
      this.touchAi.classList.toggle('on', AutoPilot.on);
    }
  }
};

/* ============================================================================
 * 6. 启动
 * ========================================================================== */
if (document.readyState === 'loading') {
  // DOM 还没就绪（脚本放在 body 末尾通常不会走到这里，但稳妥起见保留分支）
  document.addEventListener('DOMContentLoaded', () => Game.init());
} else {
  Game.init();
}

/* ============================================================================
 * 7. 自动化验证钩子
 *    —— 以只读方式暴露内部状态，供 verify/selftest.js 断言。
 *
 *    为什么值得在交付代码里留这么一个口子：
 *    游戏逻辑全部包在 IIFE 里，外部脚本只能靠"反解绘制调用"来猜发生了什么
 *    （比如数 arc() 的半径来判断精英敌有没有出现）。那种测试极其脆弱 ——
 *    改一下画法就失效，而且它证明的是"画了某个圆"，不是"逻辑真的对了"。
 *    有了这个引用，自检可以直接断言连击倍率、震动时长、道具计时、Boss 血量
 *    这些真正的内部状态，测试强度完全不同量级。
 *
 *    它只是一个对象引用，不注册任何事件、不改变任何运行行为，
 *    在浏览器控制台里也顺便方便调试。
 * ========================================================================== */
if (typeof window !== 'undefined') {
  window.__SpaceLine = {
    game: Game,
    CFG: CFG,
    Input: Input,
    AutoPilot: AutoPilot,
    classes: { Player, Bullet, Enemy, PowerUp, Boss, EnemyBullet, Shockwave, FloatText }
  };
}

})();
</script>
</body>
</html>
